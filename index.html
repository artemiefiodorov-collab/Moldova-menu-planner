<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Меню & Покупки">
<title>Меню & Покупки — 120 рецептов, вакуумация и список</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root {
  --bg: #f3f5f9;
  --card: #ffffff;
  --card-alt: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --chip: #eef2f6;
  --acc: #e11d48;
  --acc-soft: rgba(225, 29, 72, 0.1);
  --ok: #059669;
  --ok-soft: rgba(5, 150, 105, 0.12);
  --cyan: #0891b2;
  --cyan-soft: rgba(8, 145, 178, 0.12);
}
:root[data-theme="dark"] {
  --bg: #0b0f19;
  --card: #131b2e;
  --card-alt: #182238;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #22304a;
  --chip: #1e293b;
  --acc: #fb7185;
  --acc-soft: rgba(251, 113, 133, 0.15);
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.14);
  --cyan: #22d3ee;
  --cyan-soft: rgba(34, 211, 238, 0.15);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 13.5px; line-height: 1.35;
  overflow-x: hidden;
}
.app-shell {
  max-width: 460px;
  margin: 0 auto;
  padding: 8px 10px 76px;
}
@media (min-width: 640px) {
  .app-shell { max-width: 660px; }
}
.card-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 11px;
  margin-bottom: 8px;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.03);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 7px 11px; border-radius: 10px; font-weight: 600; font-size: 12.5px;
  border: 1px solid transparent; cursor: pointer; transition: all 0.12s ease;
  user-select: none; white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--acc); color: #fff; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-cyan { background: var(--cyan); color: #fff; }
.btn-ghost { background: var(--chip); color: var(--text); border-color: var(--line); }
.btn-xs { padding: 4px 8px; font-size: 11.5px; border-radius: 8px; }

.inp {
  width: 100%; background: var(--card-alt); color: var(--text);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 10px; font-size: 13px; outline: none;
}
.inp:focus { border-color: var(--acc); }

.pill-scroll {
  display: flex; align-items: center; gap: 5px;
  overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  padding-bottom: 2px;
}
.pill-scroll::-webkit-scrollbar { display: none; }

.pill-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--chip); color: var(--text); border: 1px solid var(--line);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.pill-btn.active {
  background: var(--acc-soft); color: var(--acc); border-color: var(--acc); font-weight: 700;
}
.pill-btn.day-done {
  border-color: var(--ok);
}

.tag {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1.5px 6px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
}
.tag-ok { background: var(--ok-soft); color: var(--ok); }
.tag-acc { background: var(--acc-soft); color: var(--acc); }
.tag-cyan { background: var(--cyan-soft); color: var(--cyan); }

.compact-row {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 6px 8px; border-radius: 9px;
  background: var(--card-alt); border: 1px solid var(--line);
}
.compact-row.done { opacity: 0.48; }
.compact-row.done .row-title { text-decoration: line-through; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
}
.bottom-nav-inner {
  max-width: 460px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
}
.nav-tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 5px 2px; border-radius: 10px; cursor: pointer;
  color: var(--muted); font-size: 10.5px; font-weight: 600;
  border: none; background: transparent;
}
.nav-tab .ic { font-size: 16px; line-height: 1.1; margin-bottom: 1px; }
.nav-tab.active { color: var(--acc); background: var(--acc-soft); font-weight: 700; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(15, 23, 42, 0.58); backdrop-filter: blur(2px);
  display: none; align-items: flex-end; justify-content: center;
}
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 12px; }
}
.modal-backdrop.open { display: flex; }
.modal-sheet {
  background: var(--card); color: var(--text);
  border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
  max-width: 520px; width: 100%; max-height: 84vh; overflow-y: auto;
  padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.25);
}
@media (min-width: 640px) {
  .modal-sheet { border-radius: 16px; border: 1px solid var(--line); }
}

.toast-bar {
  position: fixed; top: 10px; left: 10px; right: 10px; max-width: 380px; margin: 0 auto;
  z-index: 80; background: var(--text); color: var(--card);
  padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600;
  display: none; align-items: center; justify-content: center; text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.22);
}
.toast-bar.show { display: flex; }

details > summary { list-style: none; cursor: pointer; user-select: none; }
details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body>

<div id="toast" class="toast-bar" role="status" aria-live="polite">
  <span id="toastText">Готово</span>
</div>

<div class="app-shell">
  <!-- КОМПАКТНАЯ ВЕРХНЯЯ ПАНЕЛЬ (В 1 СТРОКУ ПОД IPHONE 15) -->
  <header class="card-box flex items-center justify-between gap-2" style="padding: 8px 11px;">
    <div class="flex items-center gap-2 min-w-0">
      <span class="text-base">🧊</span>
      <span class="font-extrabold text-sm truncate">Меню & Покупки</span>
      <span class="tag tag-cyan" id="hdrRecipeCount">120 блюд</span>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button id="btnShareLink" class="btn btn-ghost btn-xs" title="Поделиться списком">🔗</button>
      <button id="btnThemeToggle" class="btn btn-ghost btn-xs" title="Тема">🌙</button>
    </div>
  </header>

  <!-- ==================== ВКЛАДКА 1: 📝 СПИСОК ПОКУПОК ==================== -->
  <section id="view-list" class="tab-view hidden">
    <div class="card-box">
      <div class="flex gap-1.5 mb-1.5">
        <input id="addNameInput" type="text" class="inp flex-1" placeholder="Продукт или химия (напр. пергамент)...">
        <input id="addNoteInput" type="text" class="inp" style="width: 82px;" placeholder="Кол-во">
        <button id="btnAddItem" class="btn btn-primary" style="padding: 7px 11px;">+</button>
      </div>
      <div class="flex items-center justify-between gap-1">
        <select id="addCatSelect" class="inp py-1 text-xs" style="width: auto; max-width: 195px;"></select>
        <div class="flex items-center gap-1">
          <button id="btnExportListPdf" class="btn btn-ok btn-xs">📄 PDF</button>
          <button id="btnCopyListText" class="btn btn-ghost btn-xs">📋 Текст</button>
          <button id="btnClearBought" class="btn btn-ghost btn-xs" title="Удалить отмеченные">🧹</button>
        </div>
      </div>
    </div>

    <div class="card-box">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <span id="listStatsLine" class="text-xs font-bold" style="color: var(--muted);">К покупке: 0</span>
        <div class="flex items-center gap-1">
          <button id="btnUncheckAll" class="btn btn-ghost btn-xs">Снять галочки</button>
          <button id="btnClearAllList" class="btn btn-ghost btn-xs" style="color: var(--acc);">Очистить</button>
        </div>
      </div>
      <div class="w-full h-1.5 rounded-full overflow-hidden mb-2" style="background: var(--chip);">
        <div id="listProgressBar" class="h-full transition-all duration-200" style="width: 0%; background: var(--ok);"></div>
      </div>
      <div id="shoppingListContainer"></div>
    </div>
  </section>

  <!-- ==================== ВКЛАДКА 2: 🧺 ПРОДУКТЫ И ХИМИЯ (2 КОЛОНКИ) ==================== -->
  <section id="view-catalog" class="tab-view hidden">
    <div class="card-box">
      <div class="flex items-center gap-1.5 mb-2">
        <input id="catSearchInput" type="text" class="inp flex-1" placeholder="🔍 Быстрый поиск товара или химии...">
        <button id="btnOpenCustomCatModal" class="btn btn-primary btn-xs">+ Свой</button>
      </div>
      <div class="pill-scroll mb-2" id="catFilterPills"></div>
      <div id="catalogContainer"></div>
    </div>
  </section>

  <!-- ==================== ВКЛАДКА 3: 🍽️ МЕНЮ НА НЕДЕЛЮ (МИНИМАЛИЗМ БЕЗ СКРОЛЛА) ==================== -->
  <section id="view-menu" class="tab-view">
    <!-- Компактная строка управления -->
    <div class="card-box">
      <div class="flex items-center justify-between gap-1.5 mb-2">
        <div class="flex items-center gap-1">
          <span class="text-xs font-bold">👥</span>
          <button id="btnPeopleMinus" class="btn btn-ghost btn-xs">−</button>
          <span id="peopleCountVal" class="font-extrabold text-xs px-1">2 чел</span>
          <button id="btnPeoplePlus" class="btn btn-ghost btn-xs">+</button>
        </div>

        <label class="flex items-center gap-1.5 cursor-pointer text-xs font-semibold px-2 py-1 rounded-lg" style="background: var(--chip);">
          <input id="chkBatchDinners" type="checkbox" class="w-3.5 h-3.5 accent-rose-600">
          <span>Ужин на 2 дня (Пн=Вт, Ср=Чт)</span>
        </label>

        <button id="btnGenerateMenu" class="btn btn-primary btn-xs">🎲 Автоменю</button>
      </div>

      <!-- Фильтр стиля меню (1 компактная полоса) -->
      <div class="pill-scroll mb-2" id="menuPrefChips">
        <button class="pill-btn active" data-pref="all">🍽️ Все простые</button>
        <button class="pill-btn" data-pref="vacuum">🧊 Под вакууматор</button>
        <button class="pill-btn" data-pref="chicken_mince">🍗 Курица и фарш</button>
        <button class="pill-btn" data-pref="fish">🐟 С рыбой (форель/дорада)</button>
      </div>

      <!-- Переключатель дней Пн-Вс + Все 7 дней (чтобы экран не уходил вниз!) -->
      <div class="pill-scroll" id="daySwitcherBar"></div>
    </div>

    <!-- Выбранный день (или компактная сводка) -->
    <div id="activeDayView"></div>

    <!-- Сворачиваемый блок 1: План вакуумации на выходные -->
    <details id="detailsVacuum" class="card-box">
      <summary class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <span>🧊</span>
          <span class="font-extrabold text-xs">Заготовки в вакууматор на неделю</span>
          <span id="vacCountBadge" class="tag tag-cyan">0</span>
        </div>
        <span class="text-xs font-bold" style="color: var(--cyan);">Развернуть ▾</span>
      </summary>
      <div class="mt-2 pt-2 border-t" style="border-color: var(--line);">
        <div class="flex justify-end mb-1.5">
          <button id="btnCopyVacuumPlan" class="btn btn-ghost btn-xs">📋 Скопировать план заготовок</button>
        </div>
        <div id="vacuumPrepList" class="space-y-1.5"></div>
      </div>
    </details>

    <!-- Сворачиваемый блок 2: Продукты по меню + Экспорт -->
    <details id="detailsMenuShop" class="card-box" open>
      <summary class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <span>🛒</span>
          <span class="font-extrabold text-xs">Продукты по меню на неделю</span>
          <span id="menuIngCountBadge" class="tag tag-ok">0 поз.</span>
        </div>
        <span class="text-xs font-bold" style="color: var(--muted);">Свернуть ▴</span>
      </summary>
      <div class="mt-2 pt-2 border-t" style="border-color: var(--line);">
        <div class="flex flex-wrap items-center justify-between gap-1.5 mb-2">
          <button id="btnMergeMenuToShopping" class="btn btn-ok btn-xs">➕ В «Список покупок»</button>
          <div class="flex items-center gap-1">
            <button id="btnExportMenuPdf" class="btn btn-ghost btn-xs">📄 PDF меню</button>
            <button id="btnCopyMenuText" class="btn btn-ghost btn-xs">📋 Текст</button>
          </div>
        </div>
        <div class="text-[11px] mb-1.5" style="color: var(--muted);">Нажмите на продукт, если он <b>уже есть дома</b> (он вычеркнется):</div>
        <div id="menuIngredientsSummary" class="grid grid-cols-2 gap-1.5"></div>
      </div>
    </details>
  </section>

  <!-- ==================== ВКЛАДКА 4: 📖 БАЗА 120 РЕЦЕПТОВ ==================== -->
  <section id="view-recipes" class="tab-view hidden">
    <div class="card-box">
      <div class="flex items-center gap-1.5 mb-2">
        <input id="recBookSearch" type="text" class="inp flex-1" placeholder="🔍 Сырники, блины, вафли, крылышки, котлеты...">
        <button id="btnOpenCustomRecipeModal" class="btn btn-primary btn-xs">+ Моё блюдо</button>
      </div>
      <div class="pill-scroll mb-2" id="recBookCatPills">
        <button class="pill-btn active" data-rcat="all">Все (120)</button>
        <button class="pill-btn" data-rcat="breakfast">🥞 Завтраки (28)</button>
        <button class="pill-btn" data-rcat="chicken">🍗 Курица (20)</button>
        <button class="pill-btn" data-rcat="mince">🧆 Фарш и котлеты (15)</button>
        <button class="pill-btn" data-rcat="meat">🥩 Свинина и говядина (16)</button>
        <button class="pill-btn" data-rcat="fish">🐟 Дорада, форель, лосось (12)</button>
        <button class="pill-btn" data-rcat="quick">🍝 Паста и картофель (13)</button>
        <button class="pill-btn" data-rcat="snack">🥗 Салаты и перекусы (16)</button>
        <button class="pill-btn" data-rcat="vacuum">🧊 Под вакуум (44)</button>
      </div>
      <div id="recBookGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5"></div>
    </div>
  </section>
</div>

<!-- НИЖНЯЯ НАВИГАЦИЯ (4 ВКЛАДКИ ПОД IPHONE 15) -->
<nav class="bottom-nav" aria-label="Навигация">
  <div class="bottom-nav-inner">
    <button class="nav-tab" data-tab="list">
      <span class="ic">📝</span>
      <span>Список (<span id="navBadgeList">0</span>)</span>
    </button>
    <button class="nav-tab" data-tab="catalog">
      <span class="ic">🧺</span>
      <span>Продукты</span>
    </button>
    <button class="nav-tab active" data-tab="menu">
      <span class="ic">🍽️</span>
      <span>Меню (7 дн)</span>
    </button>
    <button class="nav-tab" data-tab="recipes">
      <span class="ic">📖</span>
      <span>Рецепты (120)</span>
    </button>
  </div>
</nav>

<!-- МОДАЛЬНОЕ ОКНО: РЕЦЕПТ -->
<div id="recipeModal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal-sheet">
    <div id="recipeModalBody"></div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: ЗАМЕНА БЛЮДА -->
<div id="replaceModal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal-sheet">
    <div id="replaceModalBody"></div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: СВОЁ БЛЮДО / ТОВАР -->
<div id="customModal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal-sheet">
    <div id="customModalBody"></div>
  </div>
</div>

<script>

const BUILTIN_RECIPES = [{"id":"b01","name":"Классические сырники из творога на сковороде","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":380,"p":24,"f":16,"c":34,"emoji":"🥞","isVacuumPrep":true,"prepNote":"Можно слепить сырники впрок, подморозить на доске и запаять в вакуумный пакет.","sourceUrl":"https://1000.menu/cooking/17890-syrniki-klassicheskie-iz-tvoroga-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"curd","label":"Творог 5–9%","qty":350,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":45,"unit":"г"},{"id":"sugar","label":"Сахар","qty":20,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Разомните творог с яйцом и сахаром вилкой.","Добавьте муку, сформируйте шайбочки.","Обжарьте на сливочном масле по 4–5 мин с каждой стороны."]},{"id":"b02","name":"Сырники в духовке пышные со сметаной","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":340,"p":25,"f":13,"c":30,"emoji":"🥞","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/21450-syrniki-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"curd","label":"Творог 5–9%","qty":350,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"semolina","label":"Манная крупа","qty":35,"unit":"г"},{"id":"sugar","label":"Сахар","qty":20,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":50,"unit":"г"}],"steps":["Смешайте творог, яйцо, сахар и манку, оставьте на 10 мин.","Выложите в формочки или на пергамент.","Выпекайте при 190 °C 20 минут."]},{"id":"b03","name":"Сырники с бананом без сахара","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":360,"p":23,"f":14,"c":36,"emoji":"🍌","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/17890-syrniki-klassicheskie-iz-tvoroga-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"curd","label":"Творог 5–9%","qty":300,"unit":"г"},{"id":"banana","label":"Банан спелый","qty":120,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":45,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Разомните банан в пюре и смешайте с творогом и яйцом.","Всыпьте муку, слепите сырники.","Обжарьте под крышкой по 4 минуты с двух сторон."]},{"id":"b04","name":"Тонкие классические блинчики на молоке","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":360,"p":12,"f":14,"c":46,"emoji":"🥞","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1831-tonkie-bliny-na-moloke","sourceName":"1000.menu","ingredients":[{"id":"milk","label":"Молоко","qty":350,"unit":"мл"},{"id":"eggs","label":"Яйца куриные","qty":2,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":130,"unit":"г"},{"id":"sugar","label":"Сахар","qty":20,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Взбейте яйца с сахаром и солью, влейте половину молока.","Всыпьте муку, размешайте без комочков, влейте остаток молока и растопленное масло.","Выпекайте тонкие блинчики на горячей сковороде по 1 мин с каждой стороны."]},{"id":"b05","name":"Блинчики с творожной начинкой","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":420,"p":20,"f":16,"c":48,"emoji":"🥞","isVacuumPrep":true,"prepNote":"Готовые фаршированные блинчики отлично вакуумируются по 4 шт в пакет для быстрого разогрева на сливочном масле.","sourceUrl":"https://1000.menu/cooking/1831-tonkie-bliny-na-moloke","sourceName":"1000.menu","ingredients":[{"id":"milk","label":"Молоко","qty":250,"unit":"мл"},{"id":"eggs","label":"Яйца куриные","qty":2,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":100,"unit":"г"},{"id":"curd","label":"Творог для начинки","qty":200,"unit":"г"},{"id":"sugar","label":"Сахар","qty":25,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Испеките тонкие блинчики на молоке.","Творог разотрите с сахаром.","Заверните начинку конвертиками и подрумяньте на сливочном масле."]},{"id":"b06","name":"Блинчики с ветчиной и расплавленным сыром","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":440,"p":22,"f":20,"c":42,"emoji":"🥞","isVacuumPrep":true,"prepNote":"Завёрнутые блинчики с ветчиной и сыром можно завакуумировать и хранить в морозилке.","sourceUrl":"https://1000.menu/cooking/24100-bliny-s-vetchinoi-i-syrom","sourceName":"1000.menu","ingredients":[{"id":"milk","label":"Молоко","qty":250,"unit":"мл"},{"id":"eggs","label":"Яйцо куриное","qty":2,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":100,"unit":"г"},{"id":"ham","label":"Ветчина","qty":120,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":100,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Приготовьте тонкие блинчики.","На каждый выложите ломтики ветчины и тёртый сыр, сверните конвертом.","Прогрейте на сковороде со сливочным маслом 2 минуты до расплавления сыра."]},{"id":"b07","name":"Пышные оладьи на кефире","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":350,"p":10,"f":12,"c":50,"emoji":"🥞","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1840-pyshnye-oladi-na-kefire","sourceName":"1000.menu","ingredients":[{"id":"kefir","label":"Кефир тёплый","qty":250,"unit":"мл"},{"id":"flour","label":"Мука пшеничная","qty":180,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"sugar","label":"Сахар","qty":20,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":25,"unit":"мл"}],"steps":["Смешайте тёплый кефир, яйцо, сахар и щепотку соли.","Всыпьте муку и 0.5 ч.л. соды, перемешайте густое тесто и не мешайте повторно.","Жарьте ложкой на разогретом масле под крышкой по 3 минуты."]},{"id":"b08","name":"Американские панкейки на молоке","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":370,"p":12,"f":11,"c":54,"emoji":"🥞","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24101-pankeiki-na-moloke","sourceName":"1000.menu","ingredients":[{"id":"milk","label":"Молоко","qty":200,"unit":"мл"},{"id":"flour","label":"Мука пшеничная","qty":140,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"butter","label":"Масло сливочное","qty":25,"unit":"г"},{"id":"sugar","label":"Сахар и разрыхлитель","qty":25,"unit":"г"}],"steps":["Взбейте яйцо с сахаром и молоком, влейте растопленное масло.","Добавьте муку с 1 ч.л. разрыхлителя.","Выпекайте на сухой сковороде до пузырьков, затем переверните на 1 минуту."]},{"id":"b09","name":"Бельгийские / венские мягкие вафли","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":410,"p":11,"f":20,"c":46,"emoji":"🧇","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24102-venskie-vafli","sourceName":"1000.menu","ingredients":[{"id":"butter","label":"Масло сливочное мягкое","qty":80,"unit":"г"},{"id":"eggs","label":"Яйца куриные","qty":2,"unit":"шт"},{"id":"milk","label":"Молоко","qty":120,"unit":"мл"},{"id":"flour","label":"Мука пшеничная","qty":150,"unit":"г"},{"id":"sugar","label":"Сахар и разрыхлитель","qty":40,"unit":"г"}],"steps":["Взбейте мягкое масло с сахаром и яйцами.","Влейте молоко, всыпьте муку с разрыхлителем.","Выпекайте в вафельнице (или духовке) 4–5 минут до золотистого цвета."]},{"id":"b10","name":"Сырные вафли с зеленью (несладкие)","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":380,"p":19,"f":21,"c":28,"emoji":"🧇","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24103-syrnye-vafli","sourceName":"1000.menu","ingredients":[{"id":"chee ический омлет с ветчиной, сыром и помидорами","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":390,"p":25,"f":28,"c":8,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/57273-omlet-s-pomidorami-i-syrom-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"eggs","label":"Яйца куриные","qty":4,"unit":"шт"},{"id":"milk","label":"Молоко","qty":80,"unit":"мл"},{"id":"ham","label":"Ветчина","qty":80,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":120,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Обжарьте кубики ветчины и помидоров на сливочном масле 2 минуты.","Залейте взбитыми с молоком яйцами.","Посыпьте тёртым сыром и готовьте под крышкой 5 минут."]},{"id":"b14","name":"Пышный омлет в духовке «как в детском саду»","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":270,"p":17,"f":19,"c":6,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/3067-omlet-v-duxovke-kak-v-detskom-sadu","sourceName":"1000.menu","ingredients":[{"id":"eggs","label":"Яйца куриные","qty":4,"unit":"шт"},{"id":"milk","label":"Молоко","qty":200,"unit":"мл"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"},{"id":"salt","label":"Соль","qty":2,"unit":"г"}],"steps":["Перемешайте яйца с молоком и солью вилкой без пены.","Вылейте в небольшую высокую форму, смазанную сливочным маслом.","Запекайте при 190 °C 25 минут."]},{"id":"b15","name":"Нежный скрэмбл (яичница-болтунья) на сливочном масле","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":10,"baseServings":2,"kcal":310,"p":18,"f":23,"c":16,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/34680-skrembl-iz-yaic-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"eggs","label":"Яйца куриные","qty":4,"unit":"шт ":"мл"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"sugar","label":"Сахар","qty":20,"unit":"г"}],"steps":["Доведите молоко с сахаром и щепоткой соли до кипения.","Тонкой струйкой всыпьте манку, активно размешивая венчиком.","Варите 3 минуты и заправьте маслом."]},{"id":"b26","name":"Пышная творожная запеканка с манкой в духовке","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":330,"p":22,"f":15,"c":26,"emoji":"🥧","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/50176-pyshnaya-tvorojnaya-zapekanka-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"curd","label":"Творог 5–9%","qty":400,"unit":"г"},{"id":"eggs","label":"Яйца куриные","qty":2,"unit":"шт"},{"id":"sour_cream","label":"Сметана","qty":60,"unit":"г"},{"id":"semolina","label":"Крупа манная","qty":40,"unit":"г"},{"id":"sugar","label":"Сахар и ванилин","qty":35,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":10,"unit":"г"}],"steps":["Смешайте творог, яйца, сметану, сахар и манку, оставьте на 15 мин.","Выложите в смазанную маслом форму.","Запекайте при 180 °C 30–35 минут до золотистого верха."]},{"id":"b27","name":"Ленивые вареники из творога со сметаной","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":310,"p":23,"f":13,"c":25,"emoji":"🥟","isVacuumPrep":true,"prepNote":"Нарезанные творожные подушечки отлично замораживаются и хранятся в вакуумном пакете — утром варятся за 2 минуты!","sourceUrl":"https://1000.menu/cooking/51015-klassicheskie-lenivye-vareniki-iz-tvoroga","sourceName":"1000.menu","ingredients":[{"id":"curd","label":"Творог 5–9%","qty":350,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":60,"unit":"г"},{"id":"sugar","label":"Сахар","qty":25,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Смешайте творог, яйцо, сахар и муку.","Скатайте колбаску, нарежьте кусочками.","Отварите в кипящей воде 2 минуты после всплытия."]},{"id":"b28","name":"Гренки с яйцом пашот / глазуньей и сыром","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":12,"baseServings":2,"kcal":350,"p":19,"f":20,"c":24,"emoji":"🥪","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/2733-grenki-s-syrom-i-yaicom","sourceName":"1000.menu","ingredients":[{"id":"bread","label":"Хлеб тостовый","qty":90,"unit":"г"},{"id":"eggs","label":"Яйца куриные","qty":3,"unit":"шт"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Поджарьте хлеб на сливочном масле, посыпьте сыром.","Сверху выложите яйцо с жидким желтком."]},{"id":"c01","name":"Куриные крылышки в соево-медовом маринаде в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":440,"p":36,"f":26,"c":14,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: положите крылышки в пакет с соевым соусом, мёдом, чесноком и паприкой. Запаяйте и в морозилку.","sourceUrl":"https://1000.menu/cooking/24110-kurinye-krylyshki-v-soevom-souse-i-mede","sourceName":"1000.menu","ingredients":[{"id":"chicken_wings","label":"Куриные крылышки","qty":600,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":40,"unit":"мл"},{"id":"honey","label":"Мёд","qty":25,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"salt","label":"Паприка и перец","qty":4,"unit":"г"}],"steps":["Разрежьте крылышки по суставам, замаринуйте в соевом соусе, мёде и чесноке.","Выложите на противень с пергаментом в один слой.","Запекайте при 200 °C 25–28 минут до карамельной корочки."]},{"id":"c02","name":"Хрустящие куриные крылышки BBQ с паприкой","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":430,"p":35,"f":27,"c":10,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: крылышки + копчёная паприка, сухой чеснок, "},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"},{"id":"salt","label":"Соль, паприка, карри","qty":5,"unit":"г"}],"steps":["Натрите бёдрышки специями, давленым чесноком и маслом.","Запекайте при 200 °C 30–35 минут до золотистой хрустящей кожицы."]},{"id":"c05","name":"Куриные бёдрышки в сметанно-чесночном соусе на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":480,"p":37,"f":32,"c":8,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: бёдрышки без кости можно сразу завакуумировать со специями и чесноком.","sourceUrl":"https://1000.menu/cooking/18988-kurica-v-smetanno-chesnochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриные бёдрышки","qty":500,"unit":"г"},{"id":"sour_cream","label":"Сметана 20%","qty":100,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":10,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":15,"unit":"мл"},{"id":"greens","label":"Укроп и петрушка","qty":10,"unit":"г"}],"steps":["Обжарьте бёдрышки на сковороде по 6 минут с каждой стороны до румяности.","Залейте сметаной, смешанной с 70 мл воды, чесноком и солью.","Тушите под крышкой на тихом огне 15–18 минут."]},{"id":"c06","name":"Куриные голени с румяной картошкой в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":490,"p":36,"f":22,"c":38,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: голени замариновать в горчице, чесноке и паприке в вакуум-пакете.","sourceUrl":"https://1000.menu/cooking/19450-kurinye-goleni-s-kartoshkoi-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"chicken_leg","label":"Куриные голени","qty":500,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"mustard","label":"Горчица","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":20,"unit":"мл"}],"steps":["Смешайте голени и нарезанный дольками картофель с горчицей, маслом, чесноком и солью.","Выложите в форму и запекайте 35–40 минут при 195 °C."]},{"id":"c07","name":"Куриные голени в медово-горчичном маринаде на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":430,"p":38,"f":24,"c":12,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: голени + горчица + мёд + соевый соус в вакуумный пакет.","sourceUrl":"https://1000.menu/cooking/24113-kurinye-goleni-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_leg","label":"Куриные голени","qty":550,"unit":"г"},{"id":"mustard","label":"Горчица","qty":20,"unit":"г"},{"id":"honey","label":"Мёд","qty":15,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":25,"unit":"мл"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Замаринуйте голени в смеси горчицы, мёда и соевого соуса.","Обжарьте на сковороде под крышкой на среднем огне по 12–14 минут с каждой стороны."]},{"id":"c08","name":"Куриное филе в сливочно-чесночном соусе на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":390,"p":42,"f":20,"c":8,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: нарезанное филе со специями и чесноком запаять в пакет.","sourceUrl":"https://1000.menu/cooking/34112-pasta-s-kuricei-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе (грудка)","qty":450,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":150,"unit":"мл"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"greens","label":"Петрушка","qty":10,"unit":"г"}],"steps":["Нарежьте куриное филе кусочками и обжарьте на сливочном масле 6–7 минут.","Добавьте чеснок, влейте сливки, посолите и томите 5 минут до загустения соуса."]},{"id":"c09","name":"Сочные куриные отбивные в яичном кляре на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":410,"p":44,"f":18,"c":16,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: отбитое и посоленное филе запаять порционно в пакет.","sourceUrl":"https://1000.menu/cooking/24114-otbivnye-iz-kurinogo-file","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":450,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":2,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":40,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":20,"unit":"мл"},{"id":"salt","label":"Соль и перец","qty":4,"unit":"г"}],"steps":["Разрежьте филе вдоль на пластины, слегка отбейте, посолите и поперчите.","Обваляйте в муке, затем окуните во взбитое яйцо.","Жарьте на среднем огне по 3–4 минуты с каждой стороны."]},{"id":"c10","name":"Куриные отбивные под помидором и сырной шапочкой в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":430,"p":45,"f":22,"c":8,"emoji":"🍗","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24115-kurinoe-file-s-pomidorami-i-syrom","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":450,"unit":"г"},{"id":"tomato","label":"Помидоры свежие","qty":150,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":90,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"},{"id":"salt","label":"Соль и специи","qty":4,"unit":"г"}],"steps":["Выложите пластины филе на противень, посолите и смажьте сметаной.","Сверху положите кружочки помидоров и посыпьте тёртым сыром.","Запекайте при 190 °C 20 минут."]},{"id":"c11","name":"Куриное филе с овощами (кабачок, перец, томаты) в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":340,"p":38,"f":12,"c":18,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: замариновать кубики куриного филе в оливковом масле с травами.","sourceUrl":"https://1000.menu/cooking/21438-kurinoe-file-s-ovoshchami-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"zucchini","label":"Кабачки молодые","qty":250,"unit":"г"},{"id":"pepper","label":"Перец сладкий","qty":120,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":150,"unit":"г"},{"id":"oil_olive","label":"Масло оливковое","qty":15,"unit":"мл"}],"steps":["Нарежьте филе и овощи крупными кубиками, смешайте с маслом, солью и травами.","Выложите в форму и запекайте при 200 °C 22 минуты."]},{"id":"c12","name":"Курица терияки с кунжутом и рисом на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":480,"p":39,"f":14,"c":52,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: кусочки филе или бедра в соусе терияки/соевом с чесноком.","sourceUrl":"https://1000.menu/cooking/18993-kurinoe-file-v-soevom-souse-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе или бедро","qty":400,"unit":"г"},{"id":"rice","label":"Рис длиннозёрный","qty":130,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус / терияки","qty":40,"unit":"мл"},{"id":"honey","label":"Мёд","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"}],"steps":["Отварите рассыпчатый рис.","Обжарьте кусочки курицы на сильном огне 6 минут, влейте соевый соус с мёдом и чесноком, карамелизуйте 3 минуты."]},{"id":"c13","name":"Рассыпчатый домашний плов с курицей в сотейнике","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":45,"baseServings":2,"kcal":530,"p":33,"f":20,"c":54,"emoji":"🥘","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/52349-rassypchatyi-plov-s-kuricei-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриное филе бедра","qty":380,"unit":"г"},{"id":"rice","label":"Рис длиннозёрный","qty":150,"unit":"г"},{"id":"carrot","label":"Морковь","qty":100,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":10,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":25,"unit":"мл"}],"steps":["Обжарьте кусочки курицы с луком и морковью, добавьте зиру и соль.","Засыпьте промытый рис, залейте кипятком на 1.5 см выше риса.","Томите под плотной крышкой на минимальном огне 22 минуты."]},{"id":"c14","name":"Гречка по-купечески с куриным филе и морковью","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":470,"p":35,"f":15,"c":48,"emoji":"🥣","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/20102-grechka-po-kupecheski-s-kuricei","sourceName":"1000.menu","ingredients":[{"id":"buckwheat","label":"Крупа гречневая","qty":140,"unit":"г"},{"id":"chicken_fillet","label":"Куриное филе","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":15,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Обжарьте кубики курицы с луком, морковью и томатной пастой 7 минут.","Всыпьте гречку, залейте 280 мл горячей воды, посолите.","Томите под крышкой 18 минут."]},{"id":"c15","name":"Жульен с курицей и шампиньонами в сливочном соусе","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":440,"p":36,"f":28,"c":9,"emoji":"🍄","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24116-julen-s-kuricei-i-gribami-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":350,"unit":"г"},{"id":"mushrooms","label":"Шампиньоны свежие","qty":250,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"cream","label":"Сливки 20% или сметана","qty":120,"unit":"мл"},{"id":"cheese","label":"Сыр твёрдый","qty":80,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Обжарьте нарезанное куриное филе с шампиньонами и луком на сливочном масле 10 минут.","Влейте сливки, посолите, посыпьте толстым слоем тёртого сыра.","Накройте крышкой (или поставьте в духовку) на 5 минут до расплавления сыра."]},{"id":"c16","name":"Куриные стрипсы в сырной панировке в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":420,"p":43,"f":18,"c":20,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: замариновать полоски куриного филе со специями.","sourceUrl":"https://1000.menu/cooking/24090-kurinoe-file-v-panirovke-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый мелко натёртый","qty":60,"unit":"г"},{"id":"flour","label":"Панировочные сухари / мука","qty":40,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"salt","label":"Паприка, сухой чеснок, соль","qty":4,"unit":"г"}],"steps":["Нарежьте филе длинными полосками, окуните во взбитое яйцо.","Обваляйте в смеси сухарей, сыра и паприки.","Запекайте на пергаменте при 200 °C 16–18 минут."]},{"id":"c17","name":"Тушёная курица с картофелем в кастрюле / сотейнике","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":480,"p":34,"f":18,"c":42,"emoji":"🍲","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24117-tushenaya-kartoshka-s-kuricei","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриные бёдра или голени","qty":450,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"},{"id":"greens","label":"Укроп и лавровый лист","qty":10,"unit":"г"}],"steps":["В глубоком сотейнике обжарьте курицу с луком и морковью 8 минут.","Добавьте крупно нарезанный картофель, посолите, влейте 150 мл горячей воды.","Тушите под крышкой 25–30 минут до мягкости."]},{"id":"c18","name":"Чахохбили из курицы в ароматном томатном соусе","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":410,"p":36,"f":22,"c":14,"emoji":"🥘","isVacuumPrep":true,"prepNote":"Вакуум: кусочки курицы с аджикой/хмели-сунели и чесноком.","sourceUrl":"https://1000.menu/cooking/24118-chaxoxbili-iz-kuricy","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриные бёдрышки","qty":500,"unit":"г"},{"id":"tomato","label":"Помидоры свежие (или в собств. соку)","qty":300,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":120,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":10,"unit":"г"},{"id":"greens","label":"Кинза или петрушка","qty":15,"unit":"г"}],"steps":["Обжарьте курицу на сковороде до румяной корочки, добавьте много лука.","Влейте тёртые помидоры, посолите и тушите под крышкой 20 минут.","В конце добавьте давленый чеснок и свежую зелень."]},{"id":"c19","name":"Куриное филе со сладким перцем и соевым соусом на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":350,"p":40,"f":12,"c":16,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: нарезанное филе + соломка болгарского перца + соевый соус.","sourceUrl":"https://1000.menu/cooking/24119-kurica-s-bolgarskim-percem","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"pepper","label":"Перец сладкий болгарский","qty":180,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":30,"unit":"мл"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Быстро обжарьте полоски куриного филе на сильном огне 5 минут.","Добавьте соломку сладкого перца и чеснок, влейте соевый соус и готовьте ещё 5 минут."]},{"id":"c20","name":"Куриные сердечки / филе бедра в сметане с луком","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":420,"p":36,"f":26,"c":8,"emoji":"🥘","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/18988-kurica-v-smetanno-chesnochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Филе куриного бедра","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":90,"unit":"г"},{"id":"sour_cream","label":"Сметана 20%","qty":100,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":15,"unit":"мл"},{"id":"salt","label":"Соль и чёрный перец","qty":4,"unit":"г"}],"steps":["Нарежьте филе бедра кусочками, обжарьте с луком 10 минут.","Добавьте сметану, соль и перец, тушите под крышкой 12–15 минут."]},{"id":"m01","name":"Домашние сочные котлеты (свино-говяжьи) с пюре","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":540,"p":35,"f":28,"c":38,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: налепите котлеты впрок, подморозьте на доске 2 часа и запаяйте в вакуумные пакеты по 4 шт.","sourceUrl":"https://1000.menu/cooking/24120-domashnie-kotlety-iz-farsha","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш домашний (свинина + говядина)","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"potato","label":"Картофель для пюре","qty":400,"unit":"г"},{"id":"milk","label":"Молоко и сливочное масло","qty":100,"unit":"мл"}],"steps":["Смешайте фарш с тёртым луком, яйцом, солью и перцем, хорошо вымесите.","Сформируйте котлеты и обжарьте по 5–6 минут с каждой стороны.","Подавайте с горячим картофельным пюре."]},{"id":"m02","name":"Нежные куриные котлеты на сковороде или в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":420,"p":38,"f":20,"c":18,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: сформированные куриные котлеты заморозить на доске и завакуумировать.","sourceUrl":"https://1000.menu/cooking/1832-kotlety-kurinye-rublenye","sourceName":"1000.menu","ingredients":[{"id":"chicken_mince","label":"Куриный фарш (или рубленое филе)","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"sour_cream","label":"Сметана в фарш для сочности","qty":30,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Соедините куриный фарш, мелко тёртый лук, яйцо и ложку сметаны.","Обжарьте котлеты на сковороде по 5 минут с двух сторон или запеките при 190 °C 20 минут."]},{"id":"m03","name":"Рубленые куриные котлеты с сыром и зеленью","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":450,"p":40,"f":24,"c":12,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: отлично хранятся в морозилке после быстрой заморозки.","sourceUrl":"https://1000.menu/cooking/1832-kotlety-kurinye-rublenye","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":70,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"},{"id":"flour","label":"Мука пшеничная","qty":30,"unit":"г"},{"id":"greens","label":"Укроп","qty":10,"unit":"г"}],"steps":["Мелко нарежьте филе кубиками 5х5 мм, смешайте с тёртым сыром, яйцом, сметаной, зеленью и мукой.","Выкладывайте ложкой на сковороду и жарьте по 4 минуты с каждой стороны."]},{"id":"m04","name":"Котлеты с сырной начинкой внутри в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":490,"p":36,"f":29,"c":14,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: заготовить сырые котлеты с кубиком сыра внутри и заморозить.","sourceUrl":"https://1000.menu/cooking/24120-domashnie-kotlety-iz-farsha","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":450,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый или моцарелла","qty":80,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"salt","label":"Соль и специи","qty":4,"unit":"г"}],"steps":["Замесите фарш с луком, яйцом и солью.","Внутрь каждой котлеты вложите брусочек сыра.","Запекайте в духовке при 190 °C 25 минут."]},{"id":"m05","name":"Тефтели («ёжики») с рисом в томатно-сметанной подливке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":490,"p":32,"f":24,"c":34,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: скатанные сырые тефтели заморозить и запаять в пакет — вечером остаётся только залить соусом.","sourceUrl":"https://1000.menu/cooking/3002-tefteli-s-podlivkoi-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":400,"unit":"г"},{"id":"rice","label":"Рис отварной","qty":70,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":25,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":50,"unit":"г"}],"steps":["Смешайте фарш с рисом, луком и солью, сформируйте шарики.","Выложите в сотейник, залейте смесью сметаны, томатной пасты и 200 мл воды.","Тушите под крышкой на тихом огне 25–30 минут."]},{"id":"m06","name":"Фрикадельки в сливочно-сырном соусе на сковороде","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":480,"p":35,"f":29,"c":12,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: заморозьте пакет мелких фрикаделек — готовятся за 12 минут прямо из морозилки!","sourceUrl":"https://1000.menu/cooking/24121-frikadelki-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш говяжий или куриный","qty":400,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":150,"unit":"мл"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Скатайте небольшие фрикадельки и обжарьте на сливочном масле 7 минут.","Влейте сливки, добавьте чеснок и тёртый сыр, тушите под крышкой ещё 7 минут."]},{"id":"m07","name":"Макароны по-флотски с сочным фаршем и луком","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":520,"p":31,"f":22,"c":49,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/2135-makarony-po-flotski-s-farshem","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Макароны","qty":170,"unit":"г"},{"id":"mince","label":"Фарш мясной","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":90,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":10,"unit":"мл"}],"steps":["Отварите макароны в подсоленной воде.","Обжарьте нарезанный лук до золотистости, добавьте фарш и жарьте 10 минут, разбивая комочки.","Соедините макароны с фаршем и сливочным маслом, прогрейте 2 минуты."]},{"id":"m08","name":"Спагетти Болоньезе с мясным томатным соусом","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":530,"p":34,"f":20,"c":52,"emoji":"🍝","isVacuumPrep":true,"prepNote":"Вакуум: готовый густой соус Болоньезе можно завакуумировать порционно — вечером остаётся только сварить спагетти.","sourceUrl":"https://1000.menu/cooking/24122-spagetti-boloneze","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Спагетти","qty":160,"unit":"г"},{"id":"beef_mince","label":"Фарш говяжий или домашний","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"tomato","label":"Помидоры протёртые / томатная паста","qty":150,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":40,"unit":"г"},{"id":"garlic","label":"Чеснок и базилик","qty":6,"unit":"г"}],"steps":["Обжарьте фарш с луком и чесноком 8 минут.","Влейте протёртые томаты, посолите, добавьте базилик и тушите 10 минут.","Подавайте со спагетти под тёртым сыром."]},{"id":"m09","name":"Картофельная запеканка с мясным фаршем в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":45,"baseServings":2,"kcal":510,"p":30,"f":24,"c":42,"emoji":"🥧","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1834-kartofelnaya-zapekanka-s-farshem-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"potato","label":"Картофель (для пюре)","qty":500,"unit":"г"},{"id":"mince","label":"Фарш мясной","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":25,"unit":"г"}],"steps":["Сварите картофель и разомните со сливочным маслом в пюре.","Обжарьте фарш с луком на сковороде 8 минут.","Выложите в форму слой пюре, затем фарш, сверху пюре и сыр. Запекайте 25 мин при 190 °C."]},{"id":"m10","name":"Гнёзда из пасты с фаршем и сыром на сковороде","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":520,"p":33,"f":23,"c":46,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24123-gnezda-iz-makaron-s-farshem","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Макаронные гнёзда (тальолини)","qty":160,"unit":"г"},{"id":"mince","label":"Фарш мясной","qty":300,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":50,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"}],"steps":["Уложите сухие гнёзда в глубокую сковороду, в центр каждого выложите заправленный фарш.","Влейте горячую подсоленную воду со сметаной до середины гнёзд.","Тушите под крышкой 20 минут, в конце посыпьте сыром."]},{"id":"m11","name":"Домашние бургеры / бифштексы с сыром на сковороде","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":560,"p":38,"f":32,"c":30,"emoji":"🍔","isVacuumPrep":true,"prepNote":"Вакуум: сформированные плоские котлеты для бургеров через пергамент завакуумировать в морозилку.","sourceUrl":"https://1000.menu/cooking/24124-bifshteks-iz-farsha","sourceName":"1000.menu","ingredients":[{"id":"beef_mince","label":"Фарш говяжий","qty":400,"unit":"г"},{"id":"cheese","label":"Сыр чеддер / твёрдый","qty":60,"unit":"г"},{"id":"bread","label":"Булочки или тосты","qty":100,"unit":"г"},{"id":"tomato","label":"Помидоры и огурец","qty":120,"unit":"г"},{"id":"salt","label":"Соль и чёрный перец","qty":4,"unit":"г"}],"steps":["Сформируйте 2–4 широкие плоские котлеты из говяжьего фарша, посолите и поперчите.","Обжарьте на раскалённой сковороде по 3–4 минуты, сверху положите ломтик сыра.","Подавайте с подрумяненным хлебом и свежими овощами."]},{"id":"m12","name":"Кабачки «лодочки», запечённые с фаршем и сыром","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":390,"p":31,"f":20,"c":18,"emoji":"🥒","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24125-lodochki-iz-kabachkov-s-farshem","sourceName":"1000.menu","ingredients":[{"id":"zucchini","label":"Кабачки молодые","qty":450,"unit":"г"},{"id":"mince","label":"Фарш куриный или домашний","qty":350,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":100,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":70,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"}],"steps":["Разрежьте кабачки вдоль пополам, ложкой выберите часть мякоти.","Мелко порубите мякоть, смешайте с фаршем, чесноком и солью, наполните лодочки.","Сверху положите ломтики томатов и сыр, запекайте 30 минут при 190 °C."]},{"id":"m13","name":"Бризоль из фарша в яичном блинчике с сыром","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":440,"p":36,"f":28,"c":8,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/2871-brizol-iz-kurinogo-farsha","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш куриный или свино-говяжий","qty":300,"unit":"г"},{"id":"eggs","label":"Яйца куриные","qty":3,"unit":"шт"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"sour_cream","label":"Сметана с чесноком","qty":40,"unit":"г"}],"steps":["Тонко раскатайте порцию фарша, окуните во взбитое яйцо и выложите на сковороду.","Жарьте по 3 минуты с двух сторон, смажьте соусом, посыпьте сыром и сверните пополам."]},{"id":"m14","name":"Мясные стожки с сырной шапочкой в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":480,"p":35,"f":28,"c":16,"emoji":"🧆","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24126-stojki-iz-farsha-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":400,"unit":"г"},{"id":"potato","label":"Картофель тёртый сырой","qty":150,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":80,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"}],"steps":["Из фарша с солью сформируйте круглые котлеты-основы на противне.","Сверху выложите обжаренный лук, немного тёртого картофеля, сметану и сыр.","Запекайте 30 минут при 190 °C."]},{"id":"m15","name":"Быстрая лазанья на сковороде с фаршем и сыром","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":520,"p":34,"f":24,"c":42,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24127-lenivaya-lazanya-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":350,"unit":"г"},{"id":"pasta","label":"Широкая паста / листы лазаньи","qty":140,"unit":"г"},{"id":"tomato_paste","label":"Томатный соус","qty":80,"unit":"г"},{"id":"cheese","label":"Сыр моцарелла / твёрдый","qty":90,"unit":"г"},{"id":"onion","label":"Лук и чеснок","qty":60,"unit":"г"}],"steps":["Обжарьте фарш с луком, влейте томатный соус и 200 мл воды.","Разломайте листы лазаньи (или широкую пасту) прямо в соус, готовьте под крышкой 15 минут.","Посыпьте сыром и дайте расплавиться 2 минуты."]},{"id":"p01","name":"Сочные свиные отбивные на сковороде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":490,"p":40,"f":32,"c":10,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: отбитые ломтики свиной корейки со специями и луком запаять в пакет.","sourceUrl":"https://1000.menu/cooking/1827-otbivnye-iz-svininy-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиная корейка или шея","qty":450,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":30,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":20,"unit":"мл"},{"id":"salt","label":"Соль и чёрный перец","qty":4,"unit":"г"}],"steps":["Нарежьте свинину поперёк волокон, отбейте молотком, посолите.","Обмакните в муку и взбитое яйцо.","Жарьте на среднем огне по 4 минуты с каждой стороны."]},{"id":"p02","name":"Свинина по-французски с помидорами и сыром в духовке","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":540,"p":38,"f":36,"c":8,"emoji":"🥩","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24130-myaso-po-francuzski-iz-svininy","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиная корейка / мякоть","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":150,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":90,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"}],"steps":["Отбейте ломтики свинины, выложите на противень, посолите.","Сверху разложите кольца лука, кружочки помидоров, сетку сметаны и тёртый сыр.","Запекайте при 190 °C 25–30 минут."]},{"id":"p03","name":"Домашнее жаркое из свинины с картофелем в кастрюле","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":45,"baseServings":2,"kcal":510,"p":32,"f":26,"c":38,"emoji":"🍲","isVacuumPrep":true,"prepNote":"Вакуум: нарезанная кубиками свинина с чесноком и специями.","sourceUrl":"https://1000.menu/cooking/27071-jarkoe-iz-svininy-s-kartofelem-po-domashnemu","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина мякоть / лопатка","qty":400,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"garlic","label":"Чеснок и лавровый лист","qty":8,"unit":"г"}],"steps":["В глубоком сотейнике обжарьте кубики свинины до золотистой корочки (8 минут).","Добавьте лук и морковь, затем крупно нарезанный картофель и 150 мл кипятка.","Тушите под крышкой на тихом огне 30 минут."]},{"id":"p04","name":"Поджарка из свинины с луком и томатной подливкой","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":480,"p":36,"f":30,"c":12,"emoji":"🥘","isVacuumPrep":true,"prepNote":"Вакуум: брусочки свинины завакуумировать со специями.","sourceUrl":"https://1000.menu/cooking/24131-podjarka-iz-svininy","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина мякоть","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":90,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":25,"unit":"г"},{"id":"flour","label":"Мука пшеничная","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"}],"steps":["Нарежьте свинину брусочками и обжарьте на сильном огне 10 минут.","Добавьте лук, муку, томатную пасту и 150 мл горячей воды.","Тушите под крышкой 15 минут до мягкости мяса."]},{"id":"p05","name":"Свиные стейки (шея / корейка) в горчично-чесночном маринаде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":510,"p":42,"f":34,"c":4,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: стейки свинины смазать горчицей, чесноком и маслом, запаять в пакет.","sourceUrl":"https://1000.menu/cooking/18994-steik-iz-svininy-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиные стейки","qty":450,"unit":"г"},{"id":"mustard","label":"Горчица","qty":20,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"},{"id":"salt","label":"Соль и розмарин","qty":4,"unit":"г"}],"steps":["Достаньте замаринованные стейки, обжарьте на сковороде по 4 минуты с каждой стороны.","Накройте крышкой на слабом огне ещё на 5 минут для полной прожарки."]},{"id":"p06","name":"Свиные рёбрышки в медово-соевой глазури в духовке","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":55,"baseServings":2,"kcal":560,"p":35,"f":38,"c":16,"emoji":"🍖","isVacuumPrep":true,"prepNote":"Вакуум: рёбрышки в маринаде из соевого соуса, мёда, паприки и чеснока идеально маринуются в вакуумном пакете.","sourceUrl":"https://1000.menu/cooking/24132-svinye-rebryshki-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"pork_ribs","label":"Свиные рёбрышки мясные","qty":600,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":40,"unit":"мл"},{"id":"honey","label":"Мёд","qty":25,"unit":"г"},{"id":"tomato_paste","label":"Томатный соус","qty":30,"unit":"г"},{"id":"garlic","label":"Чеснок и паприка","qty":8,"unit":"г"}],"steps":["Заверните замаринованные рёбрышки в фольгу и запекайте при 190 °C 40 минут.","Раскройте фольгу и подрумяньте ещё 10–12 минут до карамельной корочки."]},{"id":"p07","name":"Запечённая свиная шея гармошкой с сыром и помидорами","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":50,"baseServings":2,"kcal":550,"p":42,"f":36,"c":6,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: подготовленный кусок свинины со специями и чесноком.","sourceUrl":"https://1000.menu/cooking/24133-svinina-garmoshka-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиная корейка / шея куском","qty":500,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":80,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":120,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"salt","label":"Соль, горчица, перец","qty":5,"unit":"г"}],"steps":["Сделайте глубокие поперечные надрезы в куске мяса, не прорезая до конца.","В каждый кармашек вложите ломтик сыра, кружочек помидора и пластинку чеснока.","Заверните в фольгу и запекайте при 190 °C 45 минут."]},{"id":"p08","name":"Свинина со сладким перцем в кисло-сладком соусе на сковороде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":460,"p":36,"f":24,"c":22,"emoji":"🥘","isVacuumPrep":true,"prepNote":"Вакуум: тонкие полоски свинины в соевом соусе.","sourceUrl":"https://1000.menu/cooking/24134-svinina-s-bolgarskim-percem","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина нежирная","qty":400,"unit":"г"},{"id":"pepper","label":"Перец сладкий","qty":180,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":30,"unit":"мл"},{"id":"tomato_paste","label":"Томатный соус","qty":25,"unit":"г"},{"id":"honey","label":"Мёд или сахар","qty":15,"unit":"г"}],"steps":["Обжарьте полоски свинины на раскалённой сковороде 7 минут.","Добавьте перец, соевый и томатный соус с мёдом, тушите на сильном огне 5 минут."]},{"id":"p09","name":"Бефстроганов из говядины со сметанным соусом","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":480,"p":40,"f":26,"c":12,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: заранее нарезанная тонкой соломкой говядина.","sourceUrl":"https://1000.menu/cooking/1825-befstroganov-iz-govyadiny-so-smetanoi","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина вырезка / мякоть","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"sour_cream","label":"Сметана 20% или сливки","qty":100,"unit":"г"},{"id":"flour","label":"Мука пшеничная","qty":15,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Быстро обжарьте тонкую соломку говядины с луком на сливочном масле.","Посыпьте мукой, влейте сметану и 80 мл горячей воды.","Томите под крышкой на слабом огне 15–20 минут."]},{"id":"p10","name":"Гуляш из говядины с густой подливкой и гречкой","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":60,"baseServings":2,"kcal":520,"p":42,"f":20,"c":44,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: кубики говядины со специями в пакет.","sourceUrl":"https://1000.menu/cooking/1826-gulyash-iz-govyadiny-s-podlivkoi","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина мякоть","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":25,"unit":"г"},{"id":"buckwheat","label":"Крупа гречневая","qty":130,"unit":"г"}],"steps":["Обжарьте кубики говядины с луком и морковью, добавьте томатную пасту и 300 мл горячей воды.","Тушите под крышкой на медленном огне 45–50 минут до мягкости.","Подавайте с отварной гречкой."]},{"id":"p11","name":"Стейк из говядины на сковороде с чесночным маслом","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":490,"p":45,"f":32,"c":0,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: стейки говядины с веточкой розмарина и каплей оливкового масла.","sourceUrl":"https://1000.menu/cooking/18996-steik-iz-govyadiny-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"beef_steak","label":"Стейк говяжий","qty":450,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":25,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"salt","label":"Крупная соль, перец, розмарин","qty":4,"unit":"г"}],"steps":["Обсушите стейки салфеткой, посолите.","Жарьте на раскалённой сковороде по 3 минуты с каждой стороны, поливая растопленным сливочным маслом с чесноком.","Дайте отдохнуть 5 минут на доске."]},{"id":"p12","name":"Говядина, тушённая с черносливом или луком в сотейнике","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":60,"baseServings":2,"kcal":460,"p":40,"f":22,"c":18,"emoji":"🥩","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1826-gulyash-iz-govyadiny-s-podlivkoi","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина мякоть","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":120,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"salt","label":"Соль, лавровый лист, перец","qty":4,"unit":"г"}],"steps":["В сотейнике выложите слоями кусочки говядины и много нарезанного полукольцами лука.","Добавьте сливочное масло и 100 мл воды, томите под крышкой на самом слабом огне 50 минут."]},{"id":"p13","name":"Жаркое по-домашнему с говядиной и картофелем","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":55,"baseServings":2,"kcal":490,"p":36,"f":20,"c":40,"emoji":"🍲","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/27071-jarkoe-iz-svininy-s-kartofelem-po-domashnemu","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина мякоть","qty":380,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Обжарьте говядину, залейте кипятком и протушите 25 минут.","Добавьте картофель, лук и морковь, тушите ещё 25 минут до мягкости."]},{"id":"p14","name":"Картошка, жаренная со свининой и луком на сковороде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":550,"p":30,"f":30,"c":42,"emoji":"🥔","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24135-jarenaya-kartoshka-s-myasom","sourceNa отистости, добавьте грибы и лук.","Через 8 минут влейте сливки, посолите и тушите под крышкой 10 минут."]},{"id":"f01","name":"Дорада целиком в духовке с лимоном и розмарином","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":310,"p":36,"f":14,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: очищенную дораду натереть морской солью, вложить в брюшко лимон, чеснок и розмарин, запаять в пакет.","sourceUrl":"https://1000.menu/cooking/24095-dorada-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"dorada","label":"Дорада свежая выпотрошенная","qty":600,"unit":"г"},{"id":"lemon","label":"Лимон","qty":40,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":15,"unit":"мл"},{"id":"salt","label":"Морская соль и розмарин","qty":4,"unit":"г"}],"steps":["Сделайте надрезы на боках рыбы, смажьте оливковым маслом со специями.","Запекайте на пергаменте при 200 °C 20–22 минуты."]},{"id":"f02","name":"Дорада на подушке из картофеля и томатов в духовке","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":420,"p":38,"f":16,"c":32,"emoji":"🐟","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24095-dorada-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"dorada","label":"Дорада свежая","qty":600,"unit":"г"},{"id":"potato","label":"Картофель тонкими кружочками","qty":350,"unit":"г"},{"id":"tomato","label":"Помидоры черри","qty":150,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":20,"unit":"мл"},{"id":"lemon","label":"Лимон","qty":30,"unit":"г"}],"steps":["Выложите тонкие кружочки картофеля на противень, сбрызните маслом и запекайте 12 минут.","Сверху положите подготовленную дораду и черри, запекайте ещё 20 минут при 200 °C."]},{"id":"f03","name":"Филе дорады на сковороде с хрустящей корочкой","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":320,"p":36,"f":16,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: филе дорады на коже с оливковым маслом и тимьяном.","sourceUrl":"https://1000.menu/cooking/24095-dorada-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"dorada","label":"Дорада (филе на коже)","qty":400,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"},{"id":"oil_olive","label":"Масло оливковое","qty":10,"unit":"мл"},{"id":"lemon","label":"Лимон","qty":30,"unit":"г"}],"steps":["Обжарьте филе дорады кожей вниз на хорошо разогретой сковороде 4 минуты, прижимая лопаткой.","Переверните, добавьте кусочек сливочного масла и жарьте ещё 2 минуты."]},{"id":"f04","name":"Стейки форели в лимонно-укропном маринаде в духовке","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":360,"p":38,"f":18,"c":3,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: стейки форели + оливковое масло + укроп + дольки лимона в пакет.","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"trout","label":"Форель (стейки или филе)","qty":400,"unit":"г"},{"id":"lemon","label":"Лимон","qty":40,"unit":"г"},{"id":"greens","label":"Укроп свежий","qty":10,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":15,"unit":"мл"},{"id":"salt","label":"Морская соль","qty":3,"unit":"г"}],"steps":["Выложите замаринованные стейки форели в форму.","Запекайте при 190 °C 16–18 минут."]},{"id":"f05","name":"Форель в сливочно-чесночном соусе в духовке","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":410,"p":37,"f":24,"c":4,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: стейки форели запаять со сливками и чесноком.","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"trout","label":"Форель свежая","qty":400,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":100,"unit":"мл"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый (по желанию)","qty":30,"unit":"г"},{"id":"greens","label":"Укроп","qty":10,"unit":"г"}],"steps":["Положите форель в форму, залейте сливками с чесноком, солью и укропом.","Запекайте 18 минут при 190 °C."]},{"id":"f06","name":"Радужная форель целиком в фольге с травами","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":340,"p":38,"f":16,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: целая тушка форели с лимоном и петрушкой.","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"trout","label":"Форель радужная потрошёная","qty":550,"unit":"г"},{"id":"lemon","label":"Лимон","qty":40,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"greens","label":"Петрушка и укроп","qty":15,"unit":"г"}],"steps":["Натрите форель солью, в брюшко вложите зелень, кружочки лимона и кусочки сливочного масла.","Заверните в фольгу и запекайте 22 минуты при 195 °C."]},{"id":"f07","name":"Стейк из лосося (сёмги) на сковороде","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":420,"p":40,"f":26,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: стейки лосося с морской солью, перцем и каплей масла.","sourceUrl":"https://1000.menu/cooking/18992-steik-iz-lososya-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Стейк лосося / сёмги","qty":400,"unit":"г"},{"id":"lemon","label":"Лимон","qty":30,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":10,"unit":"мл"},{"id":"salt","label":"Соль и дроблёный перец","qty":3,"unit":"г"}],"steps":["Выложите обсушенные стейки на горячую сковороду.","Жарьте по 3.5–4 минуты с каждой стороны до румяной корочки, сбрызните лимоном."]},{"id":"f08","name":"Лосось в медово-соевой глазури (терияки) с рисом","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":490,"p":38,"f":20,"c":44,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: филе лосося в маринаде из соевого соуса и мёда.","sourceUrl":"https://1000.menu/cooking/18992-steik-iz-lososya-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Филе лосося или форели","qty":380,"unit":"г"},{"id":"rice","label":"Рис на гарнир","qty":120,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":30,"unit":"мл"},{"id":"honey","label":"Мёд","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":5,"unit":"г"}],"steps":["Отварите рис.","Обжарьте лосось на сковороде по 3 минуты, влейте соевый соус с мёдом и прогрейте 1 минуту до глазури."]},{"id":"f09","name":"Красная рыба, запечённая с кабачками и черри","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":380,"p":36,"f":19,"c":12,"emoji":"🐟","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Форель или лосось (филе)","qty":380,"unit":"г"},{"id":"zucchini","label":"Кабачки молодые","qty":250,"unit":"г"},{"id":"tomato","label":"Помидоры черри","qty":150,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":15,"unit":"мл"}],"steps":["Нарежьте кабачки полукружьями, выложите в форму вместе с черри и порционными кусками рыбы.","Полейте оливковым маслом, посолите и запекайте 20 минут при 195 °C."]},{"id":"f10","name":"Сливочный суп (уха по-фински) с красной рыбой и картофелем","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":390,"p":28,"f":20,"c":24,"emoji":"🍲","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24140-uxa-po-finski-so-slivkami","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Форель или сёмга (филе)","qty":300,"unit":"г"},{"id":"potato","label":"Картофель","qty":250,"unit":"г"},{"id":"carrot","label":"Морковь и лук","qty":100,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":12
