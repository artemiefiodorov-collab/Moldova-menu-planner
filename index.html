<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Список и План">
<title>Список и План — Покупки, Меню на неделю и 120 рецептов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card-2: #f9f9fb;
  --text: #1c1c1e;
  --muted: #8e8e93;
  --line: #e5e5ea;
  --tint: #007aff;
  --tint-soft: rgba(0, 122, 255, 0.11);
  --green: #34c759;
  --green-soft: rgba(52, 199, 89, 0.12);
  --orange: #ff9500;
  --orange-soft: rgba(255, 149, 0, 0.12);
  --red: #ff3b30;
  --cyan: #00a2c7;
  --cyan-soft: rgba(0, 162, 199, 0.11);
}
:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1c1c1e;
  --card-2: #2c2c2e;
  --text: #f2f2f7;
  --muted: #98989d;
  --line: #38383a;
  --tint: #0a84ff;
  --tint-soft: rgba(10, 132, 255, 0.18);
  --green: #30d158;
  --green-soft: rgba(48, 209, 88, 0.18);
  --orange: #ff9f0a;
  --orange-soft: rgba(255, 159, 10, 0.18);
  --red: #ff453a;
  --cyan: #5ac8fa;
  --cyan-soft: rgba(90, 200, 250, 0.18);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  font-size: 15px; line-height: 1.38;
  overflow-x: hidden;
}
.ios-shell {
  max-width: 430px;
  margin: 0 auto;
  padding: 10px 12px 82px;
}
@media (min-width: 640px) {
  .ios-shell { max-width: 580px; }
}

/* iOS Grouped List Card */
.ios-group {
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 12px;
  border: 0.5px solid var(--line);
}
.ios-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 14px;
  border-bottom: 0.5px solid var(--line);
  background: var(--card);
  transition: background 0.12s;
}
.ios-row:last-child { border-bottom: none; }
.ios-row:active { background: var(--card-2); }

/* Круглый чекбокс как в iOS Напоминаниях / AnyList */
.ios-check {
  width: 22px; height: 22px; border-radius: 999px;
  border: 2px solid var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; transition: all 0.15s;
  color: transparent; font-size: 12px; font-weight: 800;
}
.ios-check.checked {
  background: var(--green); border-color: var(--green); color: #fff;
}

.ios-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 13px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
  border: none; cursor: pointer; transition: opacity 0.12s, transform 0.1s;
  user-select: none; white-space: nowrap;
}
.ios-btn:active { transform: scale(0.97); opacity: 0.85; }
.ios-btn-primary { background: var(--tint); color: #ffffff; }
.ios-btn-green { background: var(--green); color: #ffffff; }
.ios-btn-soft { background: var(--tint-soft); color: var(--tint); }
.ios-btn-gray { background: var(--card-2); color: var(--text); border: 0.5px solid var(--line); }
.ios-btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }

.ios-input-wrap {
  position: relative;
  background: var(--card);
  border-radius: 12px;
  border: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 3px 6px 3px 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
.ios-input-wrap:focus-within { border-color: var(--tint); }
.ios-input {
  width: 100%; border: none; background: transparent; color: var(--text);
  font-size: 15px; padding: 8px 4px; outline: none;
}

/* Выпадающие автоподсказки (как в AnyList / Купи Батон) */
.suggest-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-top: 6px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}

/* Быстрые облачка (Чипсы) */
.chip-bar {
  display: flex; align-items: center; gap: 6px;
  overflow-x: auto; scrollbar-width: none; padding: 2px 0;
}
.chip-bar::-webkit-scrollbar { display: none; }
.ios-chip {
  padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--card); color: var(--text); border: 0.5px solid var(--line);
  white-space: nowrap; cursor: pointer; flex-shrink: 0;
}
.ios-chip.active {
  background: var(--tint); color: #fff; border-color: var(--tint);
}

/* Сетка папок рецептов 2x4 (Paprika 4 / AnyList) */
.folder-card {
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: 14px;
  padding: 13px 12px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; transition: transform 0.12s, background 0.12s;
  min-height: 82px;
}
.folder-card:active { transform: scale(0.98); background: var(--card-2); }

/* Нижняя панель из 3 вкладок (iOS Tab Bar) */
.ios-tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 0.5px solid var(--line);
  padding: 5px 12px calc(5px + env(safe-area-inset-bottom));
}
:root[data-theme="dark"] .ios-tabbar {
  background: rgba(28, 28, 30, 0.9);
}
.ios-tabbar-inner {
  max-width: 430px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
}
.tab-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4px 0; border: none; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 11px; font-weight: 600; position: relative;
}
.tab-item .tab-ic { font-size: 20px; line-height: 1.1; margin-bottom: 2px; }
.tab-item.active { color: var(--tint); font-weight: 700; }
.tab-badge {
  position: absolute; top: 1px; right: 26%;
  background: var(--red); color: #fff; font-size: 10px; font-weight: 800;
  padding: 0 5px; border-radius: 999px; min-width: 16px; height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
}

/* Модальная шторка снизу (iOS Bottom Sheet) */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(2px);
  display: none; align-items: flex-end; justify-content: center;
}
@media (min-width: 640px) {
  .sheet-backdrop { align-items: center; padding: 16px; }
}
.sheet-backdrop.open { display: flex; }
.sheet-box {
  background: var(--bg); color: var(--text);
  border-radius: 20px 20px 0 0;
  max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto;
  padding: 12px 14px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.28);
}
@media (min-width: 640px) {
  .sheet-box { border-radius: 18px; }
}
.sheet-handle {
  width: 38px; height: 4.5px; border-radius: 999px;
  background: var(--line); margin: 0 auto 10px;
}

.toast-pill {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 90; background: rgba(28, 28, 30, 0.92); color: #fff;
  padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
  display: none; align-items: center; gap: 6px; white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.toast-pill.show { display: inline-flex; }
</style>
<style id="market-theme">
/* «Свежий рынок» — мятный фон, базилик, томатные акценты.
   Подключить ПОСЛЕ основного <style>: перекрывает его, JS не трогаем. */

:root {
  --bg: #f3faf5;
  --card: #ffffff;
  --card-2: #eaf6ee;
  --text: #17331f;
  --muted: #6b8573;
  --line: #dcebe1;
  --tint: #1f9d63;            /* базилик */
  --tint-soft: rgba(31, 157, 99, 0.12);
  --green: #2bb673;           /* галочки, «куплено» */
  --green-soft: rgba(43, 182, 115, 0.14);
  --orange: #ff9f1c;          /* лимон-апельсин */
  --orange-soft: rgba(255, 159, 28, 0.15);
  --red: #f0583a;             /* томат: бейджи, «очистить» */
  --cyan: #1c9bb5;
  --cyan-soft: rgba(28, 155, 181, 0.13);
  --shadow: 0 4px 16px rgba(31, 110, 70, 0.08);
}
:root[data-theme="dark"] {
  --bg: #0d1511;
  --card: #16211b;
  --card-2: #1e2d25;
  --text: #eaf6ee;
  --muted: #8fa89a;
  --line: #27382f;
  --tint: #3ccf8a;
  --tint-soft: rgba(60, 207, 138, 0.18);
  --green: #3ccf8a;
  --green-soft: rgba(60, 207, 138, 0.18);
  --orange: #ffb340;
  --orange-soft: rgba(255, 179, 64, 0.18);
  --red: #ff7a5c;
  --cyan: #52c7df;
  --cyan-soft: rgba(82, 199, 223, 0.18);
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
}

html, body {
  font-family: 'Nunito', 'Inter', -apple-system, sans-serif;
  font-size: 16px; line-height: 1.4;
}
h1, h3 { font-family: 'Nunito', sans-serif; font-weight: 900 !important; letter-spacing: -0.01em; }
.ios-shell { padding-top: 14px; }

/* Карточки и строки: мягче, выше, без рамок — только тень */
.ios-group {
  border: none; border-radius: 22px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.ios-row { min-height: 52px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ios-row:active { background: var(--tint-soft); }

/* Кнопки: пилюли, увеличенная зона нажатия */
.ios-btn {
  border-radius: 999px; font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: 14.5px; padding: 10px 18px; min-height: 42px;
}
.ios-btn-sm { min-height: 36px; padding: 6px 14px; font-size: 13.5px; border-radius: 999px; }
.ios-btn-primary, .ios-btn-green { box-shadow: 0 4px 12px rgba(31, 157, 99, 0.28); color: #fff; }
.ios-btn-primary { background: var(--tint); }
.ios-btn-soft { background: var(--tint-soft); color: var(--tint); }
.ios-btn-gray { background: var(--card); border: 1px solid var(--line); color: var(--text); }

/* Поля ввода */
.ios-input-wrap { border-radius: 18px; border: 2px solid var(--line); box-shadow: none; padding: 4px 8px 4px 14px; }
.ios-input-wrap:focus-within { border-color: var(--tint); box-shadow: 0 0 0 4px var(--tint-soft); }
.ios-input { font-size: 16px; font-family: inherit; }
.suggest-box { border: none; border-radius: 18px; box-shadow: 0 10px 28px rgba(31, 110, 70, 0.16); }

/* Галочка: крупнее, с «пружиной» */
.ios-check {
  width: 26px; height: 26px; border: 2px solid #b9d3c2; font-size: 14px;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.ios-check.checked { background: var(--green); border-color: var(--green); transform: scale(1.08); }

/* Быстрые чипсы */
.ios-chip {
  padding: 8px 14px; font-size: 14px; font-weight: 700; border: 1.5px solid var(--line);
  background: var(--card); box-shadow: 0 2px 6px rgba(31, 110, 70, 0.05);
}
.ios-chip.active { background: var(--tint); border-color: var(--tint); color: #fff; }

/* Папки рецептов: пастельные плитки у каждой свой цвет */
.folder-card {
  --fc: var(--tint);
  background: color-mix(in srgb, var(--fc) 16%, var(--card));
  border: none; border-radius: 24px; min-height: 108px; padding: 16px 14px;
  box-shadow: var(--shadow);
}
.folder-card:active { background: color-mix(in srgb, var(--fc) 26%, var(--card)); }
.folder-card .text-2xl { font-size: 34px; line-height: 1; }
.folder-card .font-bold { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; }
.folder-card[data-folder="breakfast"] { --fc: #ffc83d; }
.folder-card[data-folder="chicken"]   { --fc: #ff9f5a; }
.folder-card[data-folder="mince"]     { --fc: #f0583a; }
.folder-card[data-folder="meat"]      { --fc: #c9786a; }
.folder-card[data-folder="fish"]      { --fc: #3fb4e0; }
.folder-card[data-folder="quick"]     { --fc: #f2c14e; }
.folder-card[data-folder="snack"]     { --fc: #3ccf8a; }
.folder-card[data-folder="vacuum"]    { --fc: #1c9bb5; }

/* Плашки дней ПН/ВТ… в плане */
.open-rec-sheet > span.w-8 {
  width: 42px !important; height: 42px !important; border-radius: 14px !important;
  background: var(--tint-soft) !important; color: var(--tint) !important;
  font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px !important;
}

/* Нижняя панель */
.ios-tabbar {
  background: rgba(255, 255, 255, 0.92); border-top: none;
  box-shadow: 0 -6px 24px rgba(31, 110, 70, 0.08); padding-top: 8px;
}
:root[data-theme="dark"] .ios-tabbar { background: rgba(22, 33, 27, 0.92); }
.tab-item { font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; }
.tab-item .tab-ic { font-size: 24px; }
.tab-item.active { color: var(--tint); }
.tab-item.active .tab-ic { transform: translateY(-1px) scale(1.1); }
.tab-badge { background: var(--red); }

/* Шторки и тост */
.sheet-box { border-radius: 28px 28px 0 0; background: var(--bg); }
.sheet-handle { width: 44px; height: 5px; background: #c5dccd; }
.toast-pill { background: rgba(23, 51, 31, 0.94); font-family: 'Nunito', sans-serif; font-weight: 800; }

/* ===== Дополнения под market-patch.js ===== */
.uppercase { text-transform: none !important; letter-spacing: 0 !important; font-size: 13px !important; font-weight: 800 !important; }

/* Карточка «Сегодня на ужин» */
.today-card {
  background: linear-gradient(135deg, #1f9d63 0%, #53c98a 100%);
  color: #fff; border-radius: 26px; padding: 18px 18px 16px; margin-bottom: 14px;
  box-shadow: 0 10px 24px rgba(31, 157, 99, 0.32); cursor: pointer;
}
.today-card:active { transform: scale(0.985); }
.today-kicker { font-size: 12.5px; font-weight: 800; opacity: 0.9; margin-bottom: 4px; }
.today-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 20px; line-height: 1.2; }
.today-hint { margin-top: 8px; display: inline-block; font-size: 13px; font-weight: 700;
  background: rgba(255, 255, 255, 0.22); padding: 4px 12px; border-radius: 999px; }
:root[data-theme="dark"] .today-card { background: linear-gradient(135deg, #1b7a4f 0%, #2f9e6a 100%); }

/* Прогресс покупок */
.progress-wrap { padding: 2px 6px 12px; }
.progress-wrap .bar { height: 8px; border-radius: 999px; background: var(--card-2); margin-top: 6px; overflow: hidden; }
.progress-wrap .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2bb673, #7ad9a5); border-radius: 999px; transition: width 0.3s; }
.done-banner { background: var(--green-soft); text-align: center; padding: 16px; font-weight: 900; font-size: 17px; color: var(--tint); box-shadow: none; }

</style>
</head>
<body>

<div id="toast" class="toast-pill" role="status" aria-live="polite">
  <span id="toastText">Готово</span>
</div>

<div class="ios-shell">

  <!-- ==================== ВКЛАДКА 1: 🛒 СПИСОК (КАК В ANYLIST / КУПИ БАТОН) ==================== -->
  <section id="view-list" class="tab-page hidden">
    <!-- Шапка вкладки Список -->
    <div class="flex items-center justify-between mb-2.5 px-1">
      <h1 class="text-xl font-extrabold tracking-tight m-0">Список покупок</h1>
      <div class="flex items-center gap-1.5">
        <button id="btnOpenCatalogSheet" class="ios-btn ios-btn-soft ios-btn-sm">🧺 Каталог</button>
        <button id="btnListSharePdf" class="ios-btn ios-btn-gray ios-btn-sm" title="Скачать PDF">📄 PDF</button>
        <button id="btnListCopyTxt" class="ios-btn ios-btn-gray ios-btn-sm" title="Скопировать текст">📋</button>
        <button id="btnTheme1" class="ios-btn ios-btn-gray ios-btn-sm theme-toggle-btn">🌙</button>
      </div>
    </div>

    <!-- ЕДИНАЯ СТРОКА УМНОГО ВВОДА (1 ПОЛЕ КАК В ANYLIST) -->
    <div class="mb-2">
      <div class="ios-input-wrap">
        <span class="text-base mr-1.5" style="color: var(--muted);">➕</span>
        <input id="smartAddInput" type="text" class="ios-input" placeholder="Добавить (напр: пергамент, крылышки 1 кг)..." autocomplete="off">
        <button id="btnSmartAddSubmit" class="ios-btn ios-btn-primary ios-btn-sm">Ввод</button>
      </div>
      <!-- Выпадающие подсказки при вводе -->
      <div id="smartSuggestions" class="suggest-box hidden"></div>
    </div>

    <!-- Быстрые облачка самых частых товаров (в 1 касание) -->
    <div class="chip-bar mb-3" id="quickAddChips"></div>

    <!-- Контейнер сгруппированного по отделам списка -->
    <div id="shoppingListGroups"></div>
  </section>

  <!-- ==================== ВКЛАДКА 2: 📅 ПЛАН НА НЕДЕЛЮ (7 ЧИСТЫХ СТРОК НА 1 ЭКРАН) ==================== -->
  <section id="view-plan" class="tab-page">
    <!-- Шапка вкладки План -->
    <div class="flex items-center justify-between mb-2.5 px-1">
      <div>
        <h1 class="text-xl font-extrabold tracking-tight m-0">План на неделю</h1>
        <p class="text-xs m-0" style="color: var(--muted);">Будни: Ужин • Выходные: Завтрак, Перекус, Ужин</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btnPlanPdf" class="ios-btn ios-btn-gray ios-btn-sm">📄 PDF</button>
        <button id="btnTheme2" class="ios-btn ios-btn-gray ios-btn-sm theme-toggle-btn">🌙</button>
      </div>
    </div>

    <!-- Компактная панель настроек (1 тонкая карточка) -->
    <div class="ios-group" style="margin-bottom: 10px;">
      <div class="ios-row" style="padding: 8px 12px;">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold" style="color: var(--muted);">Порции:</span>
          <button id="btnPeopleMinus" class="ios-btn ios-btn-gray ios-btn-sm" style="padding: 2px 8px;">−</button>
          <span id="peopleVal" class="font-bold text-sm">2 чел</span>
          <button id="btnPeoplePlus" class="ios-btn ios-btn-gray ios-btn-sm" style="padding: 2px 8px;">+</button>
        </div>
        <label class="flex items-center gap-1.5 cursor-pointer text-xs font-semibold">
          <input id="chkBatchDinners" type="checkbox" class="w-4 h-4 accent-blue-600">
          <span>Ужин на 2 дня (Пн=Вт, Ср=Чт)</span>
        </label>
      </div>
    </div>

    <!-- 2 главные кнопки действия (как в Mealime / AnyList) -->
    <div class="grid grid-cols-2 gap-2 mb-2.5">
      <button id="btnAutoFillWeek" class="ios-btn ios-btn-soft w-full">🎲 Заполнить неделю</button>
      <button id="btnOpenGroceriesModal" class="ios-btn ios-btn-green w-full">🛒 В список покупок</button>
    </div>

    <!-- 7 ДНЕЙ НЕДЕЛИ (ЧИСТЫЙ СПИСОК БЕЗ ВИЗУАЛЬНОГО ШУМА) -->
    <div id="weekDaysList" class="ios-group" style="margin-bottom: 10px;"></div>

    <!-- Кнопка просмотра плана вакуумации на выходные -->
    <button id="btnOpenVacuumSheet" class="ios-btn ios-btn-gray w-full flex items-center justify-between" style="padding: 10px 14px; border-radius: 12px;">
      <span class="flex items-center gap-2 font-bold text-xs" style="color: var(--cyan);">
        <span>🧊</span>
        <span>План заготовок в вакууматор на неделю</span>
      </span>
      <span id="vacPlanCountLabel" class="text-xs font-bold" style="color: var(--muted);">Открыть ›</span>
    </button>

ический омлет с ветчиной, сыром и помидорами","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":390,"p":25,"f":28,"c":8,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/57273-omlet-s-pomidorami-i-syrom-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"eggs","label":"Яйца куриные","qty":4,"unit":"шт"},{"id":"milk","label":"Молоко","qty":80,"unit":"мл"},{"id":"ham","label":"Ветчина","qty":80,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":120,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Обжарьте кубики ветчины и помидоров на сливочном масле 2 минуты.","Залейте взбитыми с молоком яйцами.","Посыпьте тёртым сыром и готовьте под крышкой 5 минут."]},{"id":"b14","name":"Пышный омлет в духовке «как в детском саду»","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":270,"p":17,"f":19,"c":6,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/3067-omlet-v-duxovke-kak-v-detskom-sadu","sourceName":"1000.menu","ingredients":[{"id":"eggs","label":"Яйца куриные","qty":4,"unit":"шт"},{"id":"milk","label":"Молоко","qty":200,"unit":"мл"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"},{"id":"salt","label":"Соль","qty":2,"unit":"г"}],"steps":["Перемешайте яйца с молоком и солью вилкой без пены.","Вылейте в небольшую высокую форму, смазанную сливочным маслом.","Запекайте при 190 °C 25 минут."]},{"id":"b15","name":"Нежный скрэмбл (яичница-болтунья) на сливочном масле","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":10,"baseServings":2,"kcal":310,"p":18,"f":23,"c":16,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/34680-skrembl-iz-yaic-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"eggs","label":"Яйца куриные","qty":4,"unit":"шт"},{"id":"butter","label":"Масло сливочное","qty":25,"unit":"г"},{"id":"bread","label":"Хлеб тостовый","qty":70,"unit":"г"},{"id":"greens","label":"Зелёный лук","qty":10,"unit":"г"}],"steps":["Разбейте яйца в миску и слегка размешайте вилкой.","Вылейте на сковороду с растопленным сливочным маслом на слабом огне.","Постоянно двигайте лопаткой 2–3 минуты до кремовой текстуры, подавайте на тосте."]},{"id":"b16","name":"Шакшука (яйца в пряном томатном соусе с перцем)","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":280,"p":14,"f":18,"c":14,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/33494-shakshuka-klassicheskaya","sourceName":"1000.menu","ingredients":[{"id":"eggs","label":"Яйца куриные","qty":4,"unit":"шт"},{"id":"tomato","label":"Помидоры спелые","qty":250,"unit":"г"},{"id":"pepper","label":"Перец сладкий","qty":100,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":50,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":20,"unit":"мл"},{"id":"greens","label":"Петрушка","qty":10,"unit":"г"}],"steps":["Обжарьте мелко нарезанный лук и перец 4 минуты.","Добавьте кубики помидоров и тушите 5 минут до густого соуса.","Сделайте лунки, вбейте яйца и готовьте под крышкой 4 минуты."]},{"id":"b17","name":"Французские гренки (тосты в яйце и молоке)","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":12,"baseServings":2,"kcal":340,"p":14,"f":15,"c":38,"emoji":"🍞","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/2733-grenki-s-syrom-i-yaicom","sourceName":"1000.menu","ingredients":[{"id":"bread","label":"Хлеб тостовый или батон","qty":120,"unit":"г"},{"id":"eggs","label":"Яйца куриные","qty":2,"unit":"шт"},{"id":"milk","label":"Молоко","qty":70,"unit":"мл"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"sugar","label":"Сахар или мёд","qty":15,"unit":"г"}],"steps":["Взбейте яйца с молоком и щепоткой сахара.","Окуните молоко всыпьте овсяные хлопья, варите 7 минут.","Добавьте сливочное масло, кружочки банана и мёд."]},{"id":"b23","name":"Овсяная каша с яблоком и корицей","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":295,"p":9,"f":8,"c":46,"emoji":"🥣","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://www.iamcook.ru/showrecipe/1200","sourceName":"1000.menu","ingredients":[{"id":"oats","label":"Овсяные хлопья","qty":90,"unit":"г"},{"id":"milk","label":"Молоко","qty":380,"unit":"мл"},{"id":"apple","label":"Яблоко сладкое","qty":150,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"},{"id":"sugar","label":"Сахар и корица","qty":15,"unit":"г"}],"steps":["Сварите овсянку на молоке до кремовости.","Добавьте мелко нарезанное яблоко, масло и щепотку корицы."]},{"id":"b24","name":"Сливочная рисовая каша на молоке","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":330,"p":8,"f":10,"c":52,"emoji":"🥣","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1838-risovaya-kasha-na-moloke","sourceName":"1000.menu","ingredients":[{"id":"rice","label":"Рис круглозёрный","qty":100,"unit":"г"},{"id":"milk","label":"Молоко","qty":400,"unit":"мл"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"sugar","label":"Сахар","qty":20,"unit":"г"}],"steps":["Отварите промытый рис в 150 мл воды 7 минут.","Влейте горячее молоко, добавьте сахар и томите на слабом огне 15 минут.","Заправьте сливочным маслом."]},{"id":"b25","name":"Манная каша без комочков со сливочным маслом","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":10,"baseServings":2,"kcal":310,"p":9,"f":10,"c":46,"emoji":"🥣","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1841-mannaya-kasha-na-moloke","sourceName":"1000.menu","ingredients":[{"id":"semolina","label":"Крупа манная","qty":50,"unit":"г"},{"id":"milk","label":"Молоко","qty":450,"unit":"мл"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"sugar","label":"Сахар","qty":20,"unit":"г"}],"steps":["Доведите молоко с сахаром и щепоткой соли до кипения.","Тонкой струйкой всыпьте манку, активно размешивая венчиком.","Варите 3 минуты и заправьте маслом."]},{"id":"b26","name":"Пышная творожная запеканка с манкой в духовке","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":330,"p":22,"f":15,"c":26,"emoji":"🥧","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/50176-pyshnaya-tvorojnaya-zapekanka-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"curd","label":"Творог 5–9%","qty":400,"unit":"г"},{"id":"eggs","label":"Яйца куриные","qty":2,"unit":"шт"},{"id":"sour_cream","label":"Сметана","qty":60,"unit":"г"},{"id":"semolina","label":"Крупа манная","qty":40,"unit":"г"},{"id":"sugar","label":"Сахар и ванилин","qty":35,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":10,"unit":"г"}],"steps":["Смешайте творог, яйца, сметану, сахар и манку, оставьте на 15 мин.","Выложите в смазанную маслом форму.","Запекайте при 180 °C 30–35 минут до золотистого верха."]},{"id":"b27","name":"Ленивые вареники из творога со сметаной","type":"Завтрак","subcat":"breakfast","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":310,"p":23,"f":13,"c":25,"emoji":"🥟","isVacuumPrep":true,"prepNote":"Нарезанные творожные подушечки отлично замораживаются и хранятся в вакуумном пакете — утром варятся за 2 минуты!","sourceUrl":"https://1000.menu/cooking/51015-klassicheskie-lenivye-vareniki-iz-tvoroga","sourceName":"1000.menu","ingredients":[{"id":"curd","label":"Творог 5–9%","qty":350,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":60,"unit":"г"},{"id":"sugar","label":"Сахар","qty":25,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Смешайте творог, яйцо, сахар и муку.","Скатайте к "},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"},{"id":"salt","label":"Соль, паприка, карри","qty":5,"unit":"г"}],"steps":["Натрите бёдрышки специями, давленым чесноком и маслом.","Запекайте при 200 °C 30–35 минут до золотистой хрустящей кожицы."]},{"id":"c05","name":"Куриные бёдрышки в сметанно-чесночном соусе на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":480,"p":37,"f":32,"c":8,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: бёдрышки без кости можно сразу завакуумировать со специями и чесноком.","sourceUrl":"https://1000.menu/cooking/18988-kurica-v-smetanno-chesnochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриные бёдрышки","qty":500,"unit":"г"},{"id":"sour_cream","label":"Сметана 20%","qty":100,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":10,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":15,"unit":"мл"},{"id":"greens","label":"Укроп и петрушка","qty":10,"unit":"г"}],"steps":["Обжарьте бёдрышки на сковороде по 6 минут с каждой стороны до румяности.","Залейте сметаной, смешанной с 70 мл воды, чесноком и солью.","Тушите под крышкой на тихом огне 15–18 минут."]},{"id":"c06","name":"Куриные голени с румяной картошкой в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":490,"p":36,"f":22,"c":38,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: голени замариновать в горчице, чесноке и паприке в вакуум-пакете.","sourceUrl":"https://1000.menu/cooking/19450-kurinye-goleni-s-kartoshkoi-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"chicken_leg","label":"Куриные голени","qty":500,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"mustard","label":"Горчица","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":20,"unit":"мл"}],"steps":["Смешайте голени и нарезанный дольками картофель с горчицей, маслом, чесноком и солью.","Выложите в форму и запекайте 35–40 минут при 195 °C."]},{"id":"c07","name":"Куриные голени в медово-горчичном маринаде на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":430,"p":38,"f":24,"c":12,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: голени + горчица + мёд + соевый соус в вакуумный пакет.","sourceUrl":"https://1000.menu/cooking/24113-kurinye-goleni-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_leg","label":"Куриные голени","qty":550,"unit":"г"},{"id":"mustard","label":"Горчица","qty":20,"unit":"г"},{"id":"honey","label":"Мёд","qty":15,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":25,"unit":"мл"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Замаринуйте голени в смеси горчицы, мёда и соевого соуса.","Обжарьте на сковороде под крышкой на среднем огне по 12–14 минут с каждой стороны."]},{"id":"c08","name":"Куриное филе в сливочно-чесночном соусе на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":390,"p":42,"f":20,"c":8,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: нарезанное филе со специями и чесноком запаять в пакет.","sourceUrl":"https://1000.menu/cooking/34112-pasta-s-kuricei-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе (грудка)","qty":450,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":150,"unit":"мл"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"greens","label":"Петрушка","qty":10,"unit":"г"}],"steps":["Нарежьте куриное филе кусочками и обжарьте на сливочном масле 6–7 минут.","Добавьте чеснок, влейте сливки, посолите и томите 5 минут до загустения соуса."]},{"id":"c09","name":"Сочные куриные отбивные в яичном кляре на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":410,"p":44,"f":18,"c":16,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: отбитое и посоленное филе запаять порционно в пакет.","sourceUrl":"https://1000.menu/cooking/24114-otbivnye-iz-kurinogo-file","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":450,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":2,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":40,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":20,"unit":"мл"},{"id":"salt","label":"Соль и перец","qty":4,"unit":"г"}],"steps":["Разрежьте филе вдоль на пластины, слегка отбейте, посолите и поперчите.","Обваляйте в муке, затем окуните во взбитое яйцо.","Жарьте на среднем огне по 3–4 минуты с каждой стороны."]},{"id":"c10","name":"Куриные отбивные под помидором и сырной шапочкой в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":430,"p":45,"f":22,"c":8,"emoji":"🍗","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24115-kurinoe-file-s-pomidorami-i-syrom","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":450,"unit":"г"},{"id":"tomato","label":"Помидоры свежие","qty":150,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":90,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"},{"id":"salt","label":"Соль и специи","qty":4,"unit":"г"}],"steps":["Выложите пластины филе на противень, посолите и смажьте сметаной.","Сверху положите кружочки помидоров и посыпьте тёртым сыром.","Запекайте при 190 °C 20 минут."]},{"id":"c11","name":"Куриное филе с овощами (кабачок, перец, томаты) в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":340,"p":38,"f":12,"c":18,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: замариновать кубики куриного филе в оливковом масле с травами.","sourceUrl":"https://1000.menu/cooking/21438-kurinoe-file-s-ovoshchami-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"zucchini","label":"Кабачки молодые","qty":250,"unit":"г"},{"id":"pepper","label":"Перец сладкий","qty":120,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":150,"unit":"г"},{"id":"oil_olive","label":"Масло оливковое","qty":15,"unit":"мл"}],"steps":["Нарежьте филе и овощи крупными кубиками, смешайте с маслом, солью и травами.","Выложите в форму и запекайте при 200 °C 22 минуты."]},{"id":"c12","name":"Курица терияки с кунжутом и рисом на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":480,"p":39,"f":14,"c":52,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: кусочки филе или бедра в соусе терияки/соевом с чесноком.","sourceUrl":"https://1000.menu/cooking/18993-kurinoe-file-v-soevom-souse-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе или бедро","qty":400,"unit":"г"},{"id":"rice","label":"Рис длиннозёрный","qty":130,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус / терияки","qty":40,"unit":"мл"},{"id":"honey","label":"Мёд","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"}],"steps":["Отварите рассыпчатый рис.","Обжарьте кусочки курицы на сильном огне 6 минут, влейте соевый соус с мёдом и чесноком, карамелизуйте 3 минуты."]},{"id":"c13","name":"Рассыпчатый домашний плов с курицей в сотейнике","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":45,"baseServings":2,"kcal":530,"p":33,"f":20,"c":54,"emoji":"🥘","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/52349-rassypchatyi-plov-s-kuricei-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриное филе бедра","qty":380,"unit":"г"},{"id":"rice","label":"Рис длиннозёрный","qty":150,"unit":"г"},{"id":"carrot","label":"Морковь","qty":100,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":10,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":25,"unit":"мл"}],"steps":["Обжарьте кусочки курицы с луком и морковью, добавьте зиру и соль.","Засыпьте промытый рис, залейте кипятком на 1.5 см выше риса.","Томите под плотной крышкой на минимальном огне 22 минуты."]},{"id":"c14","name":"Гречка по-купечески с куриным филе и морковью","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":470,"p":35,"f":15,"c":48,"emoji":"🥣","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/20102-grechka-po-kupecheski-s-kuricei","sourceName":"1000.menu","ingredients":[{"id":"buckwheat","label":"Крупа гречневая","qty":140,"unit":"г"},{"id":"chicken_fillet","label":"Куриное филе","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":15,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Обжарьте кубики курицы с луком, морковью и томатной пастой 7 минут.","Всыпьте гречку, залейте 280 мл горячей воды, посолите.","Томите под крышкой 18 минут."]},{"id":"c15","name":"Жульен с курицей и шампиньонами в сливочном соусе","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":440,"p":36,"f":28,"c":9,"emoji":"🍄","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24116-julen-s-kuricei-i-gribami-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":350,"unit":"г"},{"id":"mushrooms","label":"Шампиньоны свежие","qty":250,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"cream","label":"Сливки 20% или сметана","qty":120,"unit":"мл"},{"id":"cheese","label":"Сыр твёрдый","qty":80,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Обжарьте нарезанное куриное филе с шампиньонами и луком на сливочном масле 10 минут.","Влейте сливки, посолите, посыпьте толстым слоем тёртого сыра.","Накройте крышкой (или поставьте в духовку) на 5 минут до расплавления сыра."]},{"id":"c16","name":"Куриные стрипсы в сырной панировке в духовке","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":420,"p":43,"f":18,"c":20,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: замариновать полоски куриного филе со специями.","sourceUrl":"https://1000.menu/cooking/24090-kurinoe-file-v-panirovke-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый мелко натёртый","qty":60,"unit":"г"},{"id":"flour","label":"Панировочные сухари / мука","qty":40,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"salt","label":"Паприка, сухой чеснок, соль","qty":4,"unit":"г"}],"steps":["Нарежьте филе длинными полосками, окуните во взбитое яйцо.","Обваляйте в смеси сухарей, сыра и паприки.","Запекайте на пергаменте при 200 °C 16–18 минут."]},{"id":"c17","name":"Тушёная курица с картофелем в кастрюле / сотейнике","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":480,"p":34,"f":18,"c":42,"emoji":"🍲","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24117-tushenaya-kartoshka-s-kuricei","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриные бёдра или голени","qty":450,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"},{"id":"greens","label":"Укроп и лавровый лист","qty":10,"unit":"г"}],"steps":["В глубоком сотейнике обжарьте курицу с луком и морковью 8 минут.","Добавьте крупно нарезанный картофель, посолите, влейте 150 мл горячей воды.","Тушите под крышкой 25–30 минут до мягкости."]},{"id":"c18","name":"Чахохбили из курицы в ароматном томатном соусе","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":410,"p":36,"f":22,"c":14,"emoji":"🥘","isVacuumPrep":true,"prepNote":"Вакуум: кусочки курицы с аджикой/хмели-сунели и чесноком.","sourceUrl":"https://1000.menu/cooking/24118-chaxoxbili-iz-kuricy","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Куриные бёдрышки","qty":500,"unit":"г"},{"id":"tomato","label":"Помидоры свежие (или в собств. соку)","qty":300,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":120,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":10,"unit":"г"},{"id":"greens","label":"Кинза или петрушка","qty":15,"unit":"г"}],"steps":["Обжарьте курицу на сковороде до румяной корочки, добавьте много лука.","Влейте тёртые помидоры, посолите и тушите под крышкой 20 минут.","В конце добавьте давленый чеснок и свежую зелень."]},{"id":"c19","name":"Куриное филе со сладким перцем и соевым соусом на сковороде","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":350,"p":40,"f":12,"c":16,"emoji":"🍗","isVacuumPrep":true,"prepNote":"Вакуум: нарезанное филе + соломка болгарского перца + соевый соус.","sourceUrl":"https://1000.menu/cooking/24119-kurica-s-bolgarskim-percem","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"pepper","label":"Перец сладкий болгарский","qty":180,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":30,"unit":"мл"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Быстро обжарьте полоски куриного филе на сильном огне 5 минут.","Добавьте соломку сладкого перца и чеснок, влейте соевый соус и готовьте ещё 5 минут."]},{"id":"c20","name":"Куриные сердечки / филе бедра в сметане с луком","type":"Ужин","subcat":"chicken","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":420,"p":36,"f":26,"c":8,"emoji":"🥘","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/18988-kurica-v-smetanno-chesnochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"chicken_thigh","label":"Филе куриного бедра","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":90,"unit":"г"},{"id":"sour_cream","label":"Сметана 20%","qty":100,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":15,"unit":"мл"},{"id":"salt","label":"Соль и чёрный перец","qty":4,"unit":"г"}],"steps":["Нарежьте филе бедра кусочками, обжарьте с луком 10 минут.","Добавьте сметану, соль и перец, тушите под крышкой 12–15 минут."]},{"id":"m01","name":"Домашние сочные котлеты (свино-говяжьи) с пюре","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":540,"p":35,"f":28,"c":38,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: налепите котлеты впрок, подморозьте на доске 2 часа и запаяйте в вакуумные пакеты по 4 шт.","sourceUrl":"https://1000.menu/cooking/24120-domashnie-kotlety-iz-farsha","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш домашний (свинина + говядина)","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"potato","label":"Картофель для пюре","qty":400,"unit":"г"},{"id":"milk","label":"Молоко и сливочное масло","qty":100,"unit":"мл"}],"steps":["Смешайте фарш с тёртым луком, яйцом, солью и перцем, хорошо вымесите.","Сформируйте котлеты и обжарьте по 5–6 минут с каждой стороны.","Подавайте с горячим картофельным пюре."]},{"id":"m02","name":"Нежные куриные котлеты на сковороде или в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":420,"p":38,"f":20,"c":18,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: сформированные куриные котлеты заморозить на доске и завакуумировать.","sourceUrl":"https://1000.menu/cooking/1832-kotlety-kurinye-rublenye","sourceName":"1000.menu","ingredients":[{"id":"chicken_mince","label":"Куриный фарш (или рубленое филе)","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"sour_cream","label":"Сметана в фарш для сочности","qty":30,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Соедините куриный фарш, мелко тёртый лук, яйцо и ложку сметаны.","Обжарьте котлеты на сковороде по 5 минут с двух сторон или запеките при 190 °C 20 минут."]},{"id":"m03","name":"Рубленые куриные котлеты с сыром и зеленью","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":450,"p":40,"f":24,"c":12,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: отлично хранятся в морозилке после быстрой заморозки.","sourceUrl":"https://1000.menu/cooking/1832-kotlety-kurinye-rublenye","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":400,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":70,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"},{"id":"flour","label":"Мука пшеничная","qty":30,"unit":"г"},{"id":"greens","label":"Укроп","qty":10,"unit":"г"}],"steps":["Мелко нарежьте филе кубиками 5х5 мм, смешайте с тёртым сыром, яйцом, сметаной, зеленью и мукой.","Выкладывайте ложкой на сковороду и жарьте по 4 минуты с каждой стороны."]},{"id":"m04","name":"Котлеты с сырной начинкой внутри в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":490,"p":36,"f":29,"c":14,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: заготовить сырые котлеты с кубиком сыра внутри и заморозить.","sourceUrl":"https://1000.menu/cooking/24120-domashnie-kotlety-iz-farsha","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":450,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый или моцарелла","qty":80,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"salt","label":"Соль и специи","qty":4,"unit":"г"}],"steps":["Замесите фарш с луком, яйцом и солью.","Внутрь каждой котлеты вложите брусочек сыра.","Запекайте в духовке при 190 °C 25 минут."]},{"id":"m05","name":"Тефтели («ёжики») с рисом в томатно-сметанной подливке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":40,"baseServings":2,"kcal":490,"p":32,"f":24,"c":34,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: скатанные сырые тефтели заморозить и запаять в пакет — вечером остаётся только залить соусом.","sourceUrl":"https://1000.menu/cooking/3002-tefteli-s-podlivkoi-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":400,"unit":"г"},{"id":"rice","label":"Рис отварной","qty":70,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":25,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":50,"unit":"г"}],"steps":["Смешайте фарш с рисом, луком и солью, сформируйте шарики.","Выложите в сотейник, залейте смесью сметаны, томатной пасты и 200 мл воды.","Тушите под крышкой на тихом огне 25–30 минут."]},{"id":"m06","name":"Фрикадельки в сливочно-сырном соусе на сковороде","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":480,"p":35,"f":29,"c":12,"emoji":"🧆","isVacuumPrep":true,"prepNote":"Вакуум: заморозьте пакет мелких фрикаделек — готовятся за 12 минут прямо из морозилки!","sourceUrl":"https://1000.menu/cooking/24121-frikadelki-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш говяжий или куриный","qty":400,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":150,"unit":"мл"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"}],"steps":["Скатайте небольшие фрикадельки и обжарьте на сливочном масле 7 минут.","Влейте сливки, добавьте чеснок и тёртый сыр, тушите под крышкой ещё 7 минут."]},{"id":"m07","name":"Макароны по-флотски с сочным фаршем и луком","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":520,"p":31,"f":22,"c":49,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/2135-makarony-po-flotski-s-farshem","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Макароны","qty":170,"unit":"г"},{"id":"mince","label":"Фарш мясной","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":90,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":10,"unit":"мл"}],"steps":["Отварите макароны в подсоленной воде.","Обжарьте нарезанный лук до золотистости, добавьте фарш и жарьте 10 минут, разбивая комочки.","Соедините макароны с фаршем и сливочным маслом, прогрейте 2 минуты."]},{"id":"m08","name":"Спагетти Болоньезе с мясным томатным соусом","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":530,"p":34,"f":20,"c":52,"emoji":"🍝","isVacuumPrep":true,"prepNote":"Вакуум: готовый густой соус Болоньезе можно завакуумировать порционно — вечером остаётся только сварить спагетти.","sourceUrl":"https://1000.menu/cooking/24122-spagetti-boloneze","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Спагетти","qty":160,"unit":"г"},{"id":"beef_mince","label":"Фарш говяжий или домашний","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"tomato","label":"Помидоры протёртые / томатная паста","qty":150,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":40,"unit":"г"},{"id":"garlic","label":"Чеснок и базилик","qty":6,"unit":"г"}],"steps":["Обжарьте фарш с луком и чесноком 8 минут.","Влейте протёртые томаты, посолите, добавьте базилик и тушите 10 минут.","Подавайте со спагетти под тёртым сыром."]},{"id":"m09","name":"Картофельная запеканка с мясным фаршем в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":45,"baseServings":2,"kcal":510,"p":30,"f":24,"c":42,"emoji":"🥧","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1834-kartofelnaya-zapekanka-s-farshem-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"potato","label":"Картофель (для пюре)","qty":500,"unit":"г"},{"id":"mince","label":"Фарш мясной","qty":350,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":25,"unit":"г"}],"steps":["Сварите картофель и разомните со сливочным маслом в пюре.","Обжарьте фарш с луком на сковороде 8 минут.","Выложите в форму слой пюре, затем фарш, сверху пюре и сыр. Запекайте 25 мин при 190 °C."]},{"id":"m10","name":"Гнёзда из пасты с фаршем и сыром на сковороде","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":520,"p":33,"f":23,"c":46,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24123-gnezda-iz-makaron-s-farshem","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Макаронные гнёзда (тальолини)","qty":160,"unit":"г"},{"id":"mince","label":"Фарш мясной","qty":300,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":50,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"}],"steps":["Уложите сухие гнёзда в глубокую сковороду, в центр каждого выложите заправленный фарш.","Влейте горячую подсоленную воду со сметаной до середины гнёзд.","Тушите под крышкой 20 минут, в конце посыпьте сыром."]},{"id":"m11","name":"Домашние бургеры / бифштексы с сыром на сковороде","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":560,"p":38,"f":32,"c":30,"emoji":"🍔","isVacuumPrep":true,"prepNote":"Вакуум: сформированные плоские котлеты для бургеров через пергамент завакуумировать в морозилку.","sourceUrl":"https://1000.menu/cooking/24124-bifshteks-iz-farsha","sourceName":"1000.menu","ingredients":[{"id":"beef_mince","label":"Фарш говяжий","qty":400,"unit":"г"},{"id":"cheese","label":"Сыр чеддер / твёрдый","qty":60,"unit":"г"},{"id":"bread","label":"Булочки или тосты","qty":100,"unit":"г"},{"id":"tomato","label":"Помидоры и огурец","qty":120,"unit":"г"},{"id":"salt","label":"Соль и чёрный перец","qty":4,"unit":"г"}],"steps":["Сформируйте 2–4 широкие плоские котлеты из говяжьего фарша, посолите и поперчите.","Обжарьте на раскалённой сковороде по 3–4 минуты, сверху положите ломтик сыра.","Подавайте с подрумяненным хлебом и свежими овощами."]},{"id":"m12","name":"Кабачки «лодочки», запечённые с фаршем и сыром","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":390,"p":31,"f":20,"c":18,"emoji":"🥒","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24125-lodochki-iz-kabachkov-s-farshem","sourceName":"1000.menu","ingredients":[{"id":"zucchini","label":"Кабачки молодые","qty":450,"unit":"г"},{"id":"mince","label":"Фарш куриный или домашний","qty":350,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":100,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":70,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"}],"steps":["Разрежьте кабачки вдоль пополам, ложкой выберите часть мякоти.","Мелко порубите мякоть, смешайте с фаршем, чесноком и солью, наполните лодочки.","Сверху положите ломтики томатов и сыр, запекайте 30 минут при 190 °C."]},{"id":"m13","name":"Бризоль из фарша в яичном блинчике с сыром","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":440,"p":36,"f":28,"c":8,"emoji":"🍳","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/2871-brizol-iz-kurinogo-farsha","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш куриный или свино-говяжий","qty":300,"unit":"г"},{"id":"eggs","label":"Яйца куриные","qty":3,"unit":"шт"},{"id":"cheese","label":"Сыр твёрдый","qty":60,"unit":"г"},{"id":"sour_cream","label":"Сметана с чесноком","qty":40,"unit":"г"}],"steps":["Тонко раскатайте порцию фарша, окуните во взбитое яйцо и выложите на сковороду.","Жарьте по 3 минуты с двух сторон, смажьте соусом, посыпьте сыром и сверните пополам."]},{"id":"m14","name":"Мясные стожки с сырной шапочкой в духовке","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":480,"p":35,"f":28,"c":16,"emoji":"🧆","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24126-stojki-iz-farsha-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":400,"unit":"г"},{"id":"potato","label":"Картофель тёртый сырой","qty":150,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":80,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"}],"steps":["Из фарша с солью сформируйте круглые котлеты-основы на противне.","Сверху выложите обжаренный лук, немного тёртого картофеля, сметану и сыр.","Запекайте 30 минут при 190 °C."]},{"id":"m15","name":"Быстрая лазанья на сковороде с фаршем и сыром","type":"Ужин","subcat":"mince","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":520,"p":34,"f":24,"c":42,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24127-lenivaya-lazanya-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"mince","label":"Фарш мясной","qty":350,"unit":"г"},{"id":"pasta","label":"Широкая паста / листы лазаньи","qty":140,"unit":"г"},{"id":"tomato_paste","label":"Томатный соус","qty":80,"unit":"г"},{"id":"cheese","label":"Сыр моцарелла / твёрдый","qty":90,"unit":"г"},{"id":"onion","label":"Лук и чеснок","qty":60,"unit":"г"}],"steps":["Обжарьте фарш с луком, влейте томатный соус и 200 мл воды.","Разломайте листы лазаньи (или широкую пасту) прямо в соус, готовьте под крышкой 15 минут.","Посыпьте сыром и дайте расплавиться 2 минуты."]},{"id":"p01","name":"Сочные свиные отбивные на сковороде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":490,"p":40,"f":32,"c":10,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: отбитые ломтики свиной корейки со специями и луком запаять в пакет.","sourceUrl":"https://1000.menu/cooking/1827-otbivnye-iz-svininy-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиная корейка или шея","qty":450,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":30,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":20,"unit":"мл"},{"id":"salt","label":"Соль и чёрный перец","qty":4,"unit":"г"}],"steps":["Нарежьте свинину поперёк волокон, отбейте молотком, посолите.","Обмакните в муку и взбитое яйцо.","Жарьте на среднем огне по 4 минуты с каждой стороны."]},{"id":"p02","name":"Свинина по-французски с помидорами и сыром в духовке","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":540,"p":38,"f":36,"c":8,"emoji":"🥩","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24130-myaso-po-francuzski-iz-svininy","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиная корейка / мякоть","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":150,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":90,"unit":"г"},{"id":"sour_cream","label":"Сметана","qty":40,"unit":"г"}],"steps":["Отбейте ломтики свинины, выложите на противень, посолите.","Сверху разложите кольца лука, кружочки помидоров, сетку сметаны и тёртый сыр.","Запекайте при 190 °C 25–30 минут."]},{"id":"p03","name":"Домашнее жаркое из свинины с картофелем в кастрюле","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":45,"baseServings":2,"kcal":510,"p":32,"f":26,"c":38,"emoji":"🍲","isVacuumPrep":true,"prepNote":"Вакуум: нарезанная кубиками свинина с чесноком и специями.","sourceUrl":"https://1000.menu/cooking/27071-jarkoe-iz-svininy-s-kartofelem-po-domashnemu","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина мякоть / лопатка","qty":400,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"garlic","label":"Чеснок и лавровый лист","qty":8,"unit":"г"}],"steps":["В глубоком сотейнике обжарьте кубики свинины до золотистой корочки (8 минут).","Добавьте лук и морковь, затем крупно нарезанный картофель и 150 мл кипятка.","Тушите под крышкой на тихом огне 30 минут."]},{"id":"p04","name":"Поджарка из свинины с луком и томатной подливкой","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":480,"p":36,"f":30,"c":12,"emoji":"🥘","isVacuumPrep":true,"prepNote":"Вакуум: брусочки свинины завакуумировать со специями.","sourceUrl":"https://1000.menu/cooking/24131-podjarka-iz-svininy","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина мякоть","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":90,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":25,"unit":"г"},{"id":"flour","label":"Мука пшеничная","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"}],"steps":["Нарежьте свинину брусочками и обжарьте на сильном огне 10 минут.","Добавьте лук, муку, томатную пасту и 150 мл горячей воды.","Тушите под крышкой 15 минут до мягкости мяса."]},{"id":"p05","name":"Свиные стейки (шея / корейка) в горчично-чесночном маринаде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":510,"p":42,"f":34,"c":4,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: стейки свинины смазать горчицей, чесноком и маслом, запаять в пакет.","sourceUrl":"https://1000.menu/cooking/18994-steik-iz-svininy-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиные стейки","qty":450,"unit":"г"},{"id":"mustard","label":"Горчица","qty":20,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"},{"id":"salt","label":"Соль и розмарин","qty":4,"unit":"г"}],"steps":["Достаньте замаринованные стейки, обжарьте на сковороде по 4 минуты с каждой стороны.","Накройте крышкой на слабом огне ещё на 5 минут для полной прожарки."]},{"id":"p06","name":"Свиные рёбрышки в медово-соевой глазури в духовке","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":55,"baseServings":2,"kcal":560,"p":35,"f":38,"c":16,"emoji":"🍖","isVacuumPrep":true,"prepNote":"Вакуум: рёбрышки в маринаде из соевого соуса, мёда, паприки и чеснока идеально маринуются в вакуумном пакете.","sourceUrl":"https://1000.menu/cooking/24132-svinye-rebryshki-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"pork_ribs","label":"Свиные рёбрышки мясные","qty":600,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":40,"unit":"мл"},{"id":"honey","label":"Мёд","qty":25,"unit":"г"},{"id":"tomato_paste","label":"Томатный соус","qty":30,"unit":"г"},{"id":"garlic","label":"Чеснок и паприка","qty":8,"unit":"г"}],"steps":["Заверните замаринованные рёбрышки в фольгу и запекайте при 190 °C 40 минут.","Раскройте фольгу и подрумяньте ещё 10–12 минут до карамельной корочки."]},{"id":"p07","name":"Запечённая свиная шея гармошкой с сыром и помидорами","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":50,"baseServings":2,"kcal":550,"p":42,"f":36,"c":6,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: подготовленный кусок свинины со специями и чесноком.","sourceUrl":"https://1000.menu/cooking/24133-svinina-garmoshka-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свиная корейка / шея куском","qty":500,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый","qty":80,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":120,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"salt","label":"Соль, горчица, перец","qty":5,"unit":"г"}],"steps":["Сделайте глубокие поперечные надрезы в куске мяса, не прорезая до конца.","В каждый кармашек вложите ломтик сыра, кружочек помидора и пластинку чеснока.","Заверните в фольгу и запекайте при 190 °C 45 минут."]},{"id":"p08","name":"Свинина со сладким перцем в кисло-сладком соусе на сковороде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":460,"p":36,"f":24,"c":22,"emoji":"🥘","isVacuumPrep":true,"prepNote":"Вакуум: тонкие полоски свинины в соевом соусе.","sourceUrl":"https://1000.menu/cooking/24134-svinina-s-bolgarskim-percem","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина нежирная","qty":400,"unit":"г"},{"id":"pepper","label":"Перец сладкий","qty":180,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":30,"unit":"мл"},{"id":"tomato_paste","label":"Томатный соус","qty":25,"unit":"г"},{"id":"honey","label":"Мёд или сахар","qty":15,"unit":"г"}],"steps":["Обжарьте полоски свинины на раскалённой сковороде 7 минут.","Добавьте перец, соевый и томатный соус с мёдом, тушите на сильном огне 5 минут."]},{"id":"p09","name":"Бефстроганов из говядины со сметанным соусом","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":480,"p":40,"f":26,"c":12,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: заранее нарезанная тонкой соломкой говядина.","sourceUrl":"https://1000.menu/cooking/1825-befstroganov-iz-govyadiny-so-smetanoi","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина вырезка / мякоть","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"sour_cream","label":"Сметана 20% или сливки","qty":100,"unit":"г"},{"id":"flour","label":"Мука пшеничная","qty":15,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"}],"steps":["Быстро обжарьте тонкую соломку говядины с луком на сливочном масле.","Посыпьте мукой, влейте сметану и 80 мл горячей воды.","Томите под крышкой на слабом огне 15–20 минут."]},{"id":"p10","name":"Гуляш из говядины с густой подливкой и гречкой","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":60,"baseServings":2,"kcal":520,"p":42,"f":20,"c":44,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: кубики говядины со специями в пакет.","sourceUrl":"https://1000.menu/cooking/1826-gulyash-iz-govyadiny-s-podlivkoi","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина мякоть","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"tomato_paste","label":"Томатная паста","qty":25,"unit":"г"},{"id":"buckwheat","label":"Крупа гречневая","qty":130,"unit":"г"}],"steps":["Обжарьте кубики говядины с луком и морковью, добавьте томатную пасту и 300 мл горячей воды.","Тушите под крышкой на медленном огне 45–50 минут до мягкости.","Подавайте с отварной гречкой."]},{"id":"p11","name":"Стейк из говядины на сковороде с чесночным маслом","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":490,"p":45,"f":32,"c":0,"emoji":"🥩","isVacuumPrep":true,"prepNote":"Вакуум: стейки говядины с веточкой розмарина и каплей оливкового масла.","sourceUrl":"https://1000.menu/cooking/18996-steik-iz-govyadiny-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"beef_steak","label":"Стейк говяжий","qty":450,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":25,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"salt","label":"Крупная соль, перец, розмарин","qty":4,"unit":"г"}],"steps":["Обсушите стейки салфеткой, посолите.","Жарьте на раскалённой сковороде по 3 минуты с каждой стороны, поливая растопленным сливочным маслом с чесноком.","Дайте отдохнуть 5 минут на доске."]},{"id":"p12","name":"Говядина, тушённая с черносливом или луком в сотейнике","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":60,"baseServings":2,"kcal":460,"p":40,"f":22,"c":18,"emoji":"🥩","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1826-gulyash-iz-govyadiny-s-podlivkoi","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина мякоть","qty":400,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":120,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"salt","label":"Соль, лавровый лист, перец","qty":4,"unit":"г"}],"steps":["В сотейнике выложите слоями кусочки говядины и много нарезанного полукольцами лука.","Добавьте сливочное масло и 100 мл воды, томите под крышкой на самом слабом огне 50 минут."]},{"id":"p13","name":"Жаркое по-домашнему с говядиной и картофелем","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":55,"baseServings":2,"kcal":490,"p":36,"f":20,"c":40,"emoji":"🍲","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/27071-jarkoe-iz-svininy-s-kartofelem-po-domashnemu","sourceName":"1000.menu","ingredients":[{"id":"beef","label":"Говядина мякоть","qty":380,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"carrot","label":"Морковь","qty":60,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":70,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Обжарьте говядину, залейте кипятком и протушите 25 минут.","Добавьте картофель, лук и морковь, тушите ещё 25 минут до мягкости."]},{"id":"p14","name":"Картошка, жаренная со свининой и луком на сковороде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":550,"p":30,"f":30,"c":42,"emoji":"🥔","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24135-jarenaya-kartoshka-s-myasom","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина шея или грудинка","qty":350,"unit":"г"},{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"garlic","label":"Чеснок и укроп","qty":8,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":20,"unit":"мл"}],"steps":["Обжарьте брусочки свинины на сковороде 8 минут до румяности.","Добавьте нарезанный соломкой картофель и жарьте 15–18 минут, в конце добавьте лук и чеснок."]},{"id":"p15","name":"Плов со свининой рассыпчатый в казане / сотейнике","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":50,"baseServings":2,"kcal":580,"p":32,"f":28,"c":52,"emoji":"🥘","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/52349-rassypchatyi-plov-s-kuricei-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина мякоть","qty":400,"unit":"г"},{"id":"rice","label":"Рис пропаренный","qty":150,"unit":"г"},{"id":"carrot","label":"Морковь","qty":100,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":80,"unit":"г"},{"id":"garlic","label":"Чеснок и зира","qty":10,"unit":"г"}],"steps":["Обжарьте свинину с луком и морковью, добавьте специи.","Всыпьте рис, залейте кипятком и томите под крышкой 25 минут."]},{"id":"p16","name":"Мясо с грибами в сливочном соусе на сковороде","type":"Ужин","subcat":"meat","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":490,"p":36,"f":30,"c":10,"emoji":"🍄","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24116-julen-s-kuricei-i-gribami-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"pork","label":"Свинина нежирная","qty":400,"unit":"г"},{"id":"mushrooms","label":"Шампиньоны","qty":200,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"cream","label":"Сливки 20% или сметана","qty":120,"unit":"мл"},{"id":"oil","label":"Масло для жарки","qty":15,"unit":"мл"}],"steps":["Обжарьте кусочки свинины до золотистости, добавьте грибы и лук.","Через 8 минут влейте сливки, посолите и тушите под крышкой 10 минут."]},{"id":"f01","name":"Дорада целиком в духовке с лимоном и розмарином","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":310,"p":36,"f":14,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: очищенную дораду натереть морской солью, вложить в брюшко лимон, чеснок и розмарин, запаять в пакет.","sourceUrl":"https://1000.menu/cooking/24095-dorada-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"dorada","label":"Дорада свежая выпотрошенная","qty":600,"unit":"г"},{"id":"lemon","label":"Лимон","qty":40,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":15,"unit":"мл"},{"id":"salt","label":"Морская соль и розмарин","qty":4,"unit":"г"}],"steps":["Сделайте надрезы на боках рыбы, смажьте оливковым маслом со специями.","Запекайте на пергаменте при 200 °C 20–22 минуты."]},{"id":"f02","name":"Дорада на подушке из картофеля и томатов в духовке","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":35,"baseServings":2,"kcal":420,"p":38,"f":16,"c":32,"emoji":"🐟","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24095-dorada-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"dorada","label":"Дорада свежая","qty":600,"unit":"г"},{"id":"potato","label":"Картофель тонкими кружочками","qty":350,"unit":"г"},{"id":"tomato","label":"Помидоры черри","qty":150,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":20,"unit":"мл"},{"id":"lemon","label":"Лимон","qty":30,"unit":"г"}],"steps":["Выложите тонкие кружочки картофеля на противень, сбрызните маслом и запекайте 12 минут.","Сверху положите подготовленную дораду и черри, запекайте ещё 20 минут при 200 °C."]},{"id":"f03","name":"Филе дорады на сковороде с хрустящей корочкой","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":320,"p":36,"f":16,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: филе дорады на коже с оливковым маслом и тимьяном.","sourceUrl":"https://1000.menu/cooking/24095-dorada-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"dorada","label":"Дорада (филе на коже)","qty":400,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":15,"unit":"г"},{"id":"oil_olive","label":"Масло оливковое","qty":10,"unit":"мл"},{"id":"lemon","label":"Лимон","qty":30,"unit":"г"}],"steps":["Обжарьте филе дорады кожей вниз на хорошо разогретой сковороде 4 минуты, прижимая лопаткой.","Переверните, добавьте кусочек сливочного масла и жарьте ещё 2 минуты."]},{"id":"f04","name":"Стейки форели в лимонно-укропном маринаде в духовке","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":360,"p":38,"f":18,"c":3,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: стейки форели + оливковое масло + укроп + дольки лимона в пакет.","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"trout","label":"Форель (стейки или филе)","qty":400,"unit":"г"},{"id":"lemon","label":"Лимон","qty":40,"unit":"г"},{"id":"greens","label":"Укроп свежий","qty":10,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":15,"unit":"мл"},{"id":"salt","label":"Морская соль","qty":3,"unit":"г"}],"steps":["Выложите замаринованные стейки форели в форму.","Запекайте при 190 °C 16–18 минут."]},{"id":"f05","name":"Форель в сливочно-чесночном соусе в духовке","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":410,"p":37,"f":24,"c":4,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: стейки форели запаять со сливками и чесноком.","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"trout","label":"Форель свежая","qty":400,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":100,"unit":"мл"},{"id":"garlic","label":"Чеснок","qty":6,"unit":"г"},{"id":"cheese","label":"Сыр твёрдый (по желанию)","qty":30,"unit":"г"},{"id":"greens","label":"Укроп","qty":10,"unit":"г"}],"steps":["Положите форель в форму, залейте сливками с чесноком, солью и укропом.","Запекайте 18 минут при 190 °C."]},{"id":"f06","name":"Радужная форель целиком в фольге с травами","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":340,"p":38,"f":16,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: целая тушка форели с лимоном и петрушкой.","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"trout","label":"Форель радужная потрошёная","qty":550,"unit":"г"},{"id":"lemon","label":"Лимон","qty":40,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":20,"unit":"г"},{"id":"greens","label":"Петрушка и укроп","qty":15,"unit":"г"}],"steps":["Натрите форель солью, в брюшко вложите зелень, кружочки лимона и кусочки сливочного масла.","Заверните в фольгу и запекайте 22 минуты при 195 °C."]},{"id":"f07","name":"Стейк из лосося (сёмги) на сковороде","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":15,"baseServings":2,"kcal":420,"p":40,"f":26,"c":2,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: стейки лосося с морской солью, перцем и каплей масла.","sourceUrl":"https://1000.menu/cooking/18992-steik-iz-lososya-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Стейк лосося / сёмги","qty":400,"unit":"г"},{"id":"lemon","label":"Лимон","qty":30,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":10,"unit":"мл"},{"id":"salt","label":"Соль и дроблёный перец","qty":3,"unit":"г"}],"steps":["Выложите обсушенные стейки на горячую сковороду.","Жарьте по 3.5–4 минуты с каждой стороны до румяной корочки, сбрызните лимоном."]},{"id":"f08","name":"Лосось в медово-соевой глазури (терияки) с рисом","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":490,"p":38,"f":20,"c":44,"emoji":"🐟","isVacuumPrep":true,"prepNote":"Вакуум: филе лосося в маринаде из соевого соуса и мёда.","sourceUrl":"https://1000.menu/cooking/18992-steik-iz-lososya-na-skovorode","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Филе лосося или форели","qty":380,"unit":"г"},{"id":"rice","label":"Рис на гарнир","qty":120,"unit":"г"},{"id":"soy_sauce","label":"Соевый соус","qty":30,"unit":"мл"},{"id":"honey","label":"Мёд","qty":15,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":5,"unit":"г"}],"steps":["Отварите рис.","Обжарьте лосось на сковороде по 3 минуты, влейте соевый соус с мёдом и прогрейте 1 минуту до глазури."]},{"id":"f09","name":"Красная рыба, запечённая с кабачками и черри","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":380,"p":36,"f":19,"c":12,"emoji":"🐟","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/18991-forel-v-duxovke","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Форель или лосось (филе)","qty":380,"unit":"г"},{"id":"zucchini","label":"Кабачки молодые","qty":250,"unit":"г"},{"id":"tomato","label":"Помидоры черри","qty":150,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":15,"unit":"мл"}],"steps":["Нарежьте кабачки полукружьями, выложите в форму вместе с черри и порционными кусками рыбы.","Полейте оливковым маслом, посолите и запекайте 20 минут при 195 °C."]},{"id":"f10","name":"Сливочный суп (уха по-фински) с красной рыбой и картофелем","type":"Ужин","subcat":"fish","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":390,"p":28,"f":20,"c":24,"emoji":"🍲","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24140-uxa-po-finski-so-slivkami","sourceName":"1000.menu","ingredients":[{"id":"salmon","label":"Форель или сёмга (филе)","qty":300,"unit":"г"},{"id":"potato","label":"Картофель","qty":250,"unit":"г"},{"id":"carrot","label":"Морковь и лук","qty":100,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":12 ji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1833-pasta-karbonara-klassicheskaya","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Спагетти","qty":170,"unit":"г"},{"id":"bacon","label":"Бекон сырокопчёный","qty":120,"unit":"г"},{"id":"eggs","label":"Желтки яичные","qty":3,"unit":"шт"},{"id":"cheese","label":"Сыр пармезан","qty":50,"unit":"г"},{"id":"garlic","label":"Чеснок и чёрный перец","qty":5,"unit":"г"}],"steps":["Отварите спагетти.","Обжарьте полоски бекона до хруста.","Смешайте горячую пасту с беконом, снимите с огня и быстро вмешайте желтки, взбитые с тёртым сыром и 3 ложками воды от пасты."]},{"id":"q02","name":"Паста Альфредо с куриным филе и пармезаном","type":"Ужин","subcat":"quick","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":520,"p":35,"f":21,"c":48,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/34112-pasta-s-kuricei-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Паста феттуччине / пенне","qty":160,"unit":"г"},{"id":"chicken_fillet","label":"Куриное филе","qty":280,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":120,"unit":"мл"},{"id":"cheese","label":"Сыр твёрдый","qty":50,"unit":"г"},{"id":"garlic","label":"Чеснок и сливочное масло","qty":15,"unit":"г"}],"steps":["Отварите пасту.","Обжарьте куриное филе с чесноком на сливочном масле 6 минут, влейте сливки и тёртый сыр.","Перемешайте пасту с густым сырным соусом."]},{"id":"q03","name":"Паста с курицей и шампиньонами в сметанном соусе","type":"Ужин","subcat":"quick","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":490,"p":33,"f":18,"c":49,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/34112-pasta-s-kuricei-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Макароны / паста","qty":160,"unit":"г"},{"id":"chicken_fillet","label":"Куриное филе","qty":250,"unit":"г"},{"id":"mushrooms
