ty":"Простая","timeMin":25,"baseServings":2,"kcal":320,"p":6,"f":12,"c":48,"emoji":"🥔","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24142-molodaya-kartoshka-s-ukropom","sourceName":"1000.menu","ingredients":[{"id":"potato","label":"Картофель","qty":550,"unit":"г"},{"id":"butter","label":"Масло сливочное","qty":35,"unit":"г"},{"id":"garlic","label":"Чеснок","qty":8,"unit":"г"},{"id":"greens","label":"Свежий укроп","qty":20,"unit":"г"}],"steps":["Отварите картофель в подсоленной воде до готовности, слейте воду.","Добавьте в кастрюлю сливочное масло, рубленый укроп и чеснок, накройте крышкой и встряхните."]},{"id":"q07","name":"Золотистые драники из картофеля со сметаной","type":"Ужин","subcat":"quick","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":380,"p":8,"f":18,"c":46,"emoji":"🥞","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24143-draniki-kartofelnye","sourceName":"1000.menu","ingredients":[{"id":"potato","label":"Картофель","qty":500,"unit":"г"},{"id":"onion","label":"Лук репчатый","qty":60,"unit":"г"},{"id":"eggs","label":"Яйцо куриное","qty":1,"unit":"шт"},{"id":"flour","label":"Мука пшеничная","qty":35,"unit":"г"},{"id":"sour_cream","label":"Сметана для подачи","qty":60,"unit":"г"},{"id":"oil","label":"Масло для жарки","qty":25,"unit":"мл"}],"steps":["Натрите картофель и лук на тёрке, отожмите лишний сок.","Добавьте яйцо, муку и соль.","Жарьте тонкие оладьи на разогретом масле по 3–4 минуты с каждой стороны."]},{"id":"q08","name":"Жареный картофель с шампиньонами и луком на сковороде","type":"Ужин","subcat":"quick","difficulty":"Простая","timeMin":30,"baseServings":2,"kcal":390,"p":9,"f":17,"c":50,"emoji":"🍄","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24144-jarenaya-kartoshka-s-gribami","sourceName":"1000.menu","ingredients":[{"id":"potato","label":"Картофель","qty":450,"unit":"г"},{"id":"mushrooms","label":"Шампиньоны свежие","qty":250,"unit":"г"},{"id":"onion" const STORAGE_KEY = 'moldova_anylist_ios_v5';

const DAYS_CONFIG = [
  { dayIndex: 0, code: 'ПН', name: 'Понедельник', isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 1, code: 'ВТ', name: 'Вторник',     isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 2, code: 'СР', name: 'Среда',       isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 3, code: 'ЧТ', name: 'Четверг',     isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 4, code: 'ПТ', name: 'Пятница',     isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 5, code: 'СБ', name: 'Суббота',     isWeekend: true,  slots: ['Завтрак', 'Перекус', 'Ужин'] },
  { dayIndex: 6, code: 'ВС', name: 'Воскресенье', isWeekend: true,  slots: ['Завтрак', 'Перекус', 'Ужин'] }
];

let state = {
  theme: 'light',
  activeTab: 'plan',
  people: 2,
  batchDinners: true,
  activeFolder: null, // null = показываем 8 папок, иначе список блюд папки
  shoppingList: [
    { id: 's1', name: 'Куриные крылышки', note: '1 кг', cat: 'meat', done: false },
    { id: 's2', name: 'Творог 5–9% (на сырники)', note: '500 г', cat: 'dairy', done: false },
    { id: 's3', name: 'Пергамент для выпечки', note: '1 рулон', cat: 'household', done: false },
    { id: 's4', name: 'Пакеты для вакууматора 20х30', note: '1 упак', cat: 'vacuum', done: false }
  ],
  customCatalog: [],
  customRecipes: [],
  haveAtHome: {},
  weeklyMenu: []
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign({}, state, JSON.parse(raw));
  } catch (e) {}
  if (!Array.isArray(state.weeklyMenu) || state.weeklyMenu.length !== 7) {
    generateWeeklyMenu(false);
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  updateTabBadge();
}

function getAllRecipes() { return BUILTIN_RECIPES.concat(state.customRecipes || []); }
function getRecipeById(id) {
  const all = getAllRecipes();
  return all.find(r => r.id === id) || all[0];
}
function getAllCatalog() { return DEFAULT_CATALOG.concat(state.customCatalog || []); }
function getCatInfo(catId) { return CATEGORIES.find(c => c.id === catId) || CATEGORIES[CATEGORIES.length - 1]; }

let toastTimer = null;
function showToast(msg) {
  const box = document.getElementById('toast');
  const txt = document.getElementById('toastText');
  if (!box || !txt) return;
  txt.textContent = msg;
  box.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('show'), 2100);
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
    btn.textContent = state.theme === 'dark' ? '☀️' : '🌙';
  });
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function scaleQty(qty) {
  const val = qty * (state.people / 2);
  return val >= 10 ? Math.round(val) : Math.round(val * 10) / 10;
}

function formatAmount(qty, unit) {
  if (unit === 'г' && qty >= 1000) return (Math.round((qty / 1000) * 100) / 100) + ' кг';
  if (unit === 'мл' && qty >= 1000) return (Math.round((qty / 1000) * 100) / 100) + ' л';
  return `${qty} ${unit}`;
}

function updateTabBadge() {
  const left = state.shoppingList.filter(i => !i.done).length;
  const b = document.getElementById('badgeListCount');
  if (!b) return;
  if (left > 0) {
    b.textContent = String(left);
    b.classList.remove('hidden');
  } else {
    b.classList.add('hidden');
  }
}

function guessCategoryByName(name) {
  const n = name.toLowerCase();
  if (/вакуум|пакет для вакуум|рулон для вакуум/.test(n)) return 'vacuum';
  if (/мыло|порошок|гель|стирк|посуд|губк|бумаг|салфет|мусор|фольг|пергамент|зубн|шампун|чист|таблет|тряп/.test(n)) return 'household';
  if (/форел|дорад|лосос|семг|сёмг|рыб/.test(n)) return 'fish';
  if (/куриц|крыл|бедр|бёдр|голен|филе|грудк|фарш|котлет|мясо|свинин|говяд|стейк|ветчин|бекон|пельмен|ребр/.test(n)) return 'meat';
  if (/молок|кефир|сливк|сметан|творог|сыр|масло слив|яйц|йогурт/.test(n)) return 'dairy';
  if (/картош|картоф|помидор|черри|огурц|кабач|перец|лук|морков|чеснок|зелен|укроп|лимон|банан|яблок|гриб|шампин|капуст/.test(n)) return 'veggies';
  if (/макарон|паста|спагет|рис|гречк|овсян|манк|мука/.test(n)) return 'grains';
  if (/хлеб|батон|тост|багет|лаваш|булоч/.test(n)) return 'bakery';
  if (/соев|масло|горчиц|мёд|мед|паста томат|соус|паприк|соль|сахар|специ/.test(n)) return 'grocery';
  return 'other';
}

// Автоматическое отделение количества из одной строки, например: "Крылышки 1.5 кг" -> name: "Крылышки", note: "1.5 кг"
function parseSmartInputString(raw) {
  const str = (raw || '').trim();
  const match = str.match(/^(.+?)\s+(\d+(?:[.,]\d+)?\s*(?:кг|г|гр|мл|л|шт|уп|упак|пач|бут|рул|бан).*)$/i);
  if (match) {
    return { name: match[1].trim(), note: match[2].trim() };
  }
  return { name: str, note: '' };
}

function addShoppingItem(name, note, catId) {
  const cleanName = (name || '').trim();
  if (!cleanName) return;
  const cleanNote = (note || '').trim();
  const resolvedCat = catId || guessCategoryByName(cleanName);

  const existing = state.shoppingList.find(it => !it.done && it.name.toLowerCase() === cleanName.toLowerCase());
  if (existing) {
    if (cleanNote && existing.note !== cleanNote) {
      existing.note = existing.note ? `${existing.note}, ${cleanNote}` : cleanNote;
    }
    saveState();
    renderShoppingList();
    renderQuickChips();
    showToast(`Обновлено: ${cleanName}`);
    return;
  }

  state.shoppingList.unshift({
    id: 'it_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    name: cleanName,
    note: cleanNote,
    cat: resolvedCat,
    done: false
  });
  saveState();
  renderShoppingList();
  renderQuickChips();
  showToast(`Добавлено: ${cleanName}`);
}

function renderQuickChips() {
  const bar = document.getElementById('quickAddChips');
  if (!bar) return;
  bar.innerHTML = QUICK_CHIPS.map(ch => {
    const inList = state.shoppingList.some(x => !x.done && x.name.toLowerCase() === ch.name.toLowerCase());
    return `<button class="ios-chip ${inList ? 'active' : ''}" data-name="${escapeHtml(ch.name)}" data-note="${escapeHtml(ch.note)}" data-cat="${ch.cat}">${inList ? '✓ ' : '+ '}${escapeHtml(ch.name)}</button>`;
  }).join('');

  bar.querySelectorAll('.ios-chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const name = e.currentTarget.getAttribute('data-name');
      const note = e.currentTarget.getAttribute('data-note');
      const cat = e.currentTarget.getAttribute('data-cat');
      const idx = state.shoppingList.findIndex(x => !x.done && x.name.toLowerCase() === name.toLowerCase());
      if (idx !== -1) {
        state.shoppingList.splice(idx, 1);
        saveState();
        renderShoppingList();
        renderQuickChips();
      } else {
        addShoppingItem(name, note, cat);
      }
    });
  });
}

function renderSmartSuggestions(query) {
  const box = document.getElementById('smartSuggestions');
  if (!box) return;
  const q = (query || '').trim().toLowerCase();
  if (!q) {
    box.classList.add('hidden');
    return;
  }

  const matches = getAllCatalog().filter(c => c.name.toLowerCase().includes(q)).slice(0, 5);
  if (matches.length === 0) {
    box.classList.add('hidden');
    return;
  }

  box.innerHTML = matches.map(m => `
    <div class="ios-row cursor-pointer suggest-item" style="padding: 9px 12px;" data-name="${escapeHtml(m.name)}" data-note="${escapeHtml(m.defNote || '')}" data-cat="${m.cat}">
      <span class="font-medium text-sm">➕ ${escapeHtml(m.name)}</span>
      <span class="text-xs" style="color: var(--muted);">${escapeHtml(m.defNote || '')}</span>
    </div>
  `).join('');
  box.classList.remove('hidden');

  box.querySelectorAll('.suggest-item').forEach(row => {
    row.addEventListener('click', e => {
      addShoppingItem(
        e.currentTarget.getAttribute('data-name'),
        e.currentTarget.getAttribute('data-note'),
        e.currentTarget.getAttribute('data-cat')
      );
      const inp = document.getElementById('smartAddInput');
      if (inp) inp.value = '';
      box.classList.add('hidden');
    });
  });
}

function renderShoppingList() {
  const container = document.getElementById('shoppingListGroups');
  if (!container) return;

  const activeItems = state.shoppingList.filter(i => !i.done);
  const boughtItems = state.shoppingList.filter(i => i.done);

  if (state.shoppingList.length === 0) {
    container.innerHTML = `
      <div class="ios-group p-8 text-center">
        <div class="text-3xl mb-2">🛒</div>
        <div class="font-bold text-base mb-1">Список покупок пуст</div>
        <div class="text-xs" style="color: var(--muted);">Начните вводить название сверху, нажмите на быстрые кнопки или перенесите продукты из вкладки «План».</div>
      </div>
    `;
    return;
  }

  let html = '';

  // Группируем активные покупки по отделам магазина (как в AnyList)
  const groups = {};
  activeItems.forEach(item => {
    const c = item.cat || 'other';
    if (!groups[c]) groups[c] = [];
    groups[c].push(item);
  });

  const sortedCatIds = Object.keys(groups).sort((a, b) => getCatInfo(a).order - getCatInfo(b).order);

  sortedCatIds.forEach(catId => {
    const cat = getCatInfo(catId);
    html += `
      <div class="text-xs font-bold uppercase tracking-wider px-2 mb-1 mt-2" style="color: var(--muted);">${cat.name}</div>
      <div class="ios-group">
    `;
    groups[catId].forEach(it => {
      html += `
        <div class="ios-row cursor-pointer item-toggle" data-id="${it.id}">
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <span class="ios-check">✓</span>
            <span class="font-medium text-[15px] truncate">${escapeHtml(it.name)}</span>
          </div>
          <span class="text-xs font-semibold shrink-0" style="color: var(--muted);">${escapeHtml(it.note || '')}</span>
        </div>
      `;
    });
    html += `</div>`;
  });

  // Купленные позиции внизу одним аккуратным блоком
  if (boughtItems.length > 0) {
    html += `
      <div class="flex items-center justify-between px-2 mb-1 mt-3">
        <span class="text-xs font-bold uppercase tracking-wider" style="color: var(--muted);">Куплено (${boughtItems.length})</span>
        <button id="btnClearBoughtInline" class="text-xs font-bold border-none bg-transparent cursor-pointer" style="color: var(--red);">Очистить купленные</button>
      </div>
      <div class="ios-group" style="opacity: 0.6;">
    `;
    boughtItems.forEach(it => {
      html += `
        <div class="ios-row cursor-pointer item-toggle" data-id="${it.id}">
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <span class="ios-check checked">✓</span>
            <span class="font-medium text-[14.5px] line-through truncate" style="color: var(--muted);">${escapeHtml(it.name)}</span>
          </div>
          <span class="text-xs shrink-0" style="color: var(--muted);">${escapeHtml(it.note || '')}</span>
        </div>
      `;
    });
    html += `</div>`;
  }

  container.innerHTML = html;

  container.querySelectorAll('.item-toggle').forEach(row => {
    row.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      const target = state.shoppingList.find(x => x.id === id);
      if (target) {
        target.done = !target.done;
        saveState();
        renderShoppingList();
        renderQuickChips();
      }
    });
  });

  const clearBtn = document.getElementById('btnClearBoughtInline');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      state.shoppingList = state.shoppingList.filter(i => !i.done);
      saveState();
      renderShoppingList();
      renderQuickChips();
      showToast('Купленные позиции удалены');
    });
  }
}

/* =========================================================================
   5. ВКЛАДКА 2: 📅 ПЛАН НА НЕДЕЛЮ (7 ЧИСТЫХ СТРОК КАК В ANYLIST)
   ========================================================================= */
function generateWeeklyMenu(notify = true) {
  const all = getAllRecipes();
  const bPool = all.filter(r => r.type === 'Завтрак');
  const sPool = all.filter(r => r.type === 'Перекус');
  const dPool = all.filter(r => r.type === 'Ужин');

  const usedB = new Set(), usedS = new Set(), usedD = new Set();
  const pick = (pool, set) => {
    const unused = pool.filter(r => !set.has(r.id));
    const arr = unused.length > 0 ? unused : pool;
    const item = arr[Math.floor(Math.random() * arr.length)];
    if (item) set.add(item.id);
    return item ? item.id : pool[0].id;
  };

  const monD = pick(dPool, usedD);
  const tueD = state.batchDinners ? monD : pick(dPool, usedD);
  const wedD = pick(dPool, usedD);
  const thuD = state.batchDinners ? wedD : pick(dPool, usedD);
  const friD = pick(dPool, usedD);
  const satD = pick(dPool, usedD);
  const sunD = pick(dPool, usedD);

  const dinners = [monD, tueD, wedD, thuD, friD, satD, sunD];

  state.weeklyMenu = DAYS_CONFIG.map((d, idx) => {
    const meals = { 'Ужин': dinners[idx] };
    if (d.isWeekend) {
      meals['Завтрак'] = pick(bPool, usedB);
      meals['Перекус'] = pick(sPool, usedS);
    }
    return { dayIndex: idx, meals };
  });

  saveState();
  renderWeekPlan();
  if (notify) showToast('Меню на неделю обновлено!');
}

function renderWeekPlan() {
  const pVal = document.getElementById('peopleVal');
  if (pVal) pVal.textContent = `${state.people} чел`;
  const chk = document.getElementById('chkBatchDinners');
  if (chk) chk.checked = !!state.batchDinners;

  const listEl = document.getElementById('weekDaysList');
  if (!listEl) return;

  let vacCount = 0;
  const vacIds = new Set();

  let html = '';
  DAYS_CONFIG.forEach((dCfg, dIdx) => {
    const dayObj = state.weeklyMenu[dIdx] || { meals: {} };
    const isSecondBatchDay = state.batchDinners && (dIdx === 1 || dIdx === 3) &&
      dayObj.meals['Ужин'] === state.weeklyMenu[dIdx - 1]?.meals['Ужин'];

    dCfg.slots.forEach(s => {
      const rec = getRecipeById(dayObj.meals[s]);
      if (rec && rec.isVacuumPrep && !vacIds.has(rec.id)) {
        vacIds.add(rec.id);
        vacCount++;
      }
    });

    if (!dCfg.isWeekend) {
      // Будний день: одна чистая компактная строка (ПН — Блюдо)
      const r = getRecipeById(dayObj.meals['Ужин']);
      html += `
        <div class="ios-row" style="padding: 10px 12px;">
          <div class="flex items-center gap-2.5 min-w-0 flex-1 cursor-pointer open-rec-sheet" data-id="${r.id}">
            <span class="w-8 h-8 rounded-lg flex items-center justify-center font-extrabold text-xs shrink-0" style="background: var(--card-2); color: var(--text);">${dCfg.code}</span>
            <div class="min-w-0 flex-1">
              <div class="font-semibold text-[14.5px] truncate">${r.emoji || '🍽️'} ${escapeHtml(r.name)}</div>
              <div class="text-xs truncate" style="color: var(--muted);">
                ${isSecondBatchDay ? '🍲 Готово со вчерашнего дня' : `Ужин • ${r.timeMin} мин${r.isVacuumPrep ? ' • 🧊 Вакуум' : ''}`}
              </div>
            </div>
          </div>
          <button class="ios-btn ios-btn-gray ios-btn-sm open-picker-sheet shrink-0" data-day="${dIdx}" data-slot="Ужин" title="Выбрать другое блюдо">↻</button>
        </div>
      `;
    } else {
      // Выходной день: аккуратный блок СБ / ВС с 3 строками
      html += `
        <div class="ios-row flex-col items-stretch gap-1.5" style="padding: 10px 12px; background: var(--card-2);">
          <div class="flex items-center justify-between">
            <span class="font-extrabold text-xs uppercase tracking-wider" style="color: var(--tint);">${dCfg.code} — ${dCfg.name}</span>
            <span class="text-[11px]" style="color: var(--muted);">Завтрак • Перекус • Ужин</span>
          </div>
      `;
      dCfg.slots.forEach(slot => {
        const r = getRecipeById(dayObj.meals[slot]);
        html += `
          <div class="flex items-center justify-between gap-2 py-1 border-t" style="border-color: var(--line);">
            <div class="min-w-0 flex-1 cursor-pointer open-rec-sheet" data-id="${r.id}">
              <span class="text-[11px] font-bold mr-1.5" style="color: var(--muted);">${slot}:</span>
              <span class="font-semibold text-[14px]">${r.emoji || '🍽️'} ${escapeHtml(r.name)}</span>
            </div>
            <button class="ios-btn ios-btn-gray ios-btn-sm open-picker-sheet shrink-0" style="padding: 3px 8px;" data-day="${dIdx}" data-slot="${slot}">↻</button>
          </div>
        `;
      });
      html += `</div>`;
    }
  });

  listEl.innerHTML = html;

  const vacLabel = document.getElementById('vacPlanCountLabel');
  if (vacLabel) vacLabel.textContent = `${vacCount} заготовок ›`;

  listEl.querySelectorAll('.open-rec-sheet').forEach(el => {
    el.addEventListener('click', e => openRecipeSheet(e.currentTarget.getAttribute('data-id')));
  });

  listEl.querySelectorAll('.open-picker-sheet').forEach(btn => {
    btn.addEventListener('click', e => {
      openMealPickerSheet(
        Number(e.currentTarget.getAttribute('data-day')),
        e.currentTarget.getAttribute('data-slot')
      );
    });
  });
}

function calculateWeeklyIngredients() {
  const map = {};
  state.weeklyMenu.forEach((dayObj, idx) => {
    const dayCfg = DAYS_CONFIG[idx];
    dayCfg.slots.forEach(slot => {
      const r = getRecipeById(dayObj.meals[slot]);
      if (!r) return;
      (r.ingredients || []).forEach(ing => {
        const key = (ing.id || ing.label).toLowerCase();
        const scaled = scaleQty(ing.qty);
        if (!map[key]) {
          map[key] = {
            key, id: ing.id || key, label: ing.label, qty: 0,
            unit: ing.unit || 'г',
            cat: INGREDIENT_CAT_MAP[ing.id] || guessCategoryByName(ing.label)
          };
        }
        map[key].qty = Math.round((map[key].qty + scaled) * 10) / 10;
      });
    });
  });
  return Object.values(map).sort((a, b) => getCatInfo(a.cat).order - getCatInfo(b.cat).order);
}

/* Шторка проверки продуктов перед добавлением в Список (как в Mealime) */
function openGroceriesReviewModal() {
  const sheet = document.getElementById('groceriesReviewSheet');
  const body = document.getElementById('groceriesReviewBody');
  const list = calculateWeeklyIngredients();

  const renderContent = () => {
    const needCount = list.filter(i => !state.haveAtHome[i.key]).length;
    body.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <div>
          <h3 class="text-base font-extrabold m-0">Собрать продукты на неделю</h3>
          <p class="text-xs m-0" style="color: var(--muted);">Снимите галочку с того, что уже есть дома в холодильнике</p>
        </div>
        <button id="btnCloseGrocRev" class="ios-btn ios-btn-gray ios-btn-sm">✕</button>
      </div>

      <div class="ios-group max-h-[54vh] overflow-y-auto mb-3">
        ${list.map(ing => {
          const needToBuy = !state.haveAtHome[ing.key];
          return `
            <div class="ios-row cursor-pointer toggle-have-ing" data-key="${escapeHtml(ing.key)}" style="padding: 9px 12px;">
              <div class="flex items-center gap-3 min-w-0 flex-1">
                <span class="ios-check ${needToBuy ? 'checked' : ''}">✓</span>
                <span class="font-medium text-sm ${needToBuy ? '' : 'line-through'}" style="${needToBuy ? '' : 'color: var(--muted);'}">${escapeHtml(ing.label)}</span>
              </div>
              <span class="text-xs font-bold" style="color: ${needToBuy ? 'var(--tint)' : 'var(--muted)'};">${needToBuy ? formatAmount(ing.qty, ing.unit) : 'Есть дома'}</span>
            </div>
          `;
        }).join('')}
      </div>

      <button id="btnConfirmAddMenuGroceries" class="ios-btn ios-btn-green w-full" style="padding: 12px;">
        ➕ Добавить выбранные (${needCount}) в Список покупок
      </button>
    `;

    document.getElementById('btnCloseGrocRev').addEventListener('click', () => sheet.classList.remove('open'));
    body.querySelectorAll('.toggle-have-ing').forEach(row => {
      row.addEventListener('click', e => {
        const k = e.currentTarget.getAttribute('data-key');
        state.haveAtHome[k] = !state.haveAtHome[k];
        saveState();
        renderContent();
      });
    });

    document.getElementById('btnConfirmAddMenuGroceries').addEventListener('click', () => {
      let added = 0;
      list.forEach(ing => {
        if (state.haveAtHome[ing.key]) return;
        const amt = formatAmount(ing.qty, ing.unit);
        const existing = state.shoppingList.find(x => !x.done && x.name.toLowerCase() === ing.label.toLowerCase());
        if (existing) existing.note = amt;
        else {
          state.shoppingList.push({
            id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
            name: ing.label, note: amt, cat: ing.cat, done: false
          });
        }
        added++;
      });
      saveState();
      renderShoppingList();
      renderQuickChips();
      sheet.classList.remove('open');
      switchTab('list');
      showToast(`В список покупок добавлено ${added} продуктов!`);
    });
  };

  renderContent();
  sheet.classList.add('open');
}

function renderRecipesTab() {
  const foldersGrid = document.getElementById('recipeFoldersGrid');
  const catList = document.getElementById('recipeCategoryList');
  const backBtn = document.getElementById('btnBackToFolders');
  const titleEl = document.getElementById('recipesHeaderTitle');
  const clearSearchBtn = document.getElementById('btnClearRecSearch');
  const q = (document.getElementById('globalRecipeSearch')?.value || '').trim().toLowerCase();

  const all = getAllRecipes();

  if (clearSearchBtn) clearSearchBtn.classList.toggle('hidden', !q);

  // Если ничего не введено в поиске и не открыта конкретная папка — показываем 8 красивых папок 2x4 на один экран
  if (!q && !state.activeFolder) {
    foldersGrid.classList.remove('hidden');
    catList.classList.add('hidden');
    backBtn.classList.add('hidden');
    titleEl.textContent = `Рецепты (${all.length})`;

    foldersGrid.innerHTML = RECIPE_FOLDERS.map(f => {
      const count = f.id === 'vacuum'
        ? all.filter(r => r.isVacuumPrep).length
        : all.filter(r => r.subcat === f.id).length;
      return `
        <div class="folder-card" data-folder="${f.id}">
          <div class="flex items-center justify-between mb-1">
            <span class="text-2xl">${f.icon}</span>
            <span class="text-xs font-extrabold px-2 py-0.5 rounded-full" style="background: var(--card-2); color: var(--muted);">${count}</span>
          </div>
          <div>
            <div class="font-bold text-[15px]">${escapeHtml(f.title)}</div>
            <div class="text-[11.5px] truncate" style="color: var(--muted);">${escapeHtml(f.sub)}</div>
          </div>
        </div>
      `;
    }).join('');

    foldersGrid.querySelectorAll('.folder-card').forEach(card => {
      card.addEventListener('click', e => {
        state.activeFolder = e.currentTarget.getAttribute('data-folder');
        renderRecipesTab();
      });
    });
    return;
  }

  // Иначе показываем чистый список блюд выбранной папки или результатов поиска
  foldersGrid.classList.add('hidden');
  catList.classList.remove('hidden');
  backBtn.classList.toggle('hidden', !state.activeFolder && !q);

  let filtered = all;
  if (q) {
    titleEl.textContent = `Поиск: «${q}»`;
    filtered = all.filter(r =>
      r.name.toLowerCase().includes(q) ||
      (r.ingredients || []).some(i => i.label.toLowerCase().includes(q))
    );
  } else if (state.activeFolder) {
    const fObj = RECIPE_FOLDERS.find(x => x.id === state.activeFolder);
    titleEl.textContent = fObj ? `${fObj.icon} ${fObj.title}` : 'Рецепты';
    filtered = state.activeFolder === 'vacuum'
      ? all.filter(r => r.isVacuumPrep)
      : all.filter(r => r.subcat === state.activeFolder);
  }

  if (filtered.length === 0) {
    catList.innerHTML = `<div class="p-6 text-center text-xs" style="color: var(--muted);">Ничего не найдено.</div>`;
    return;
  }

  catList.innerHTML = filtered.map(r => `
    <div class="ios-row cursor-pointer open-rec-from-book" data-id="${r.id}">
      <div class="min-w-0 flex-1">
        <div class="font-semibold text-[15px] truncate">${r.emoji || '🍽️'} ${escapeHtml(r.name)}</div>
        <div class="text-xs" style="color: var(--muted);">
          ⏱ ${r.timeMin} мин • ${r.kcal} ккал${r.isVacuumPrep ? ' • 🧊 Под вакуум' : ''}

/* =========================================================================
   8. ЭКСПОРТ В PDF И ТЕКСТ
   ========================================================================= */
function buildPdfFromCanvasPages(jpegs, W, H) {
  const enc = new TextEncoder(), chunks = [], offs = [];
  let off = 0;
  const push = b => { if (typeof b === 'string') b = enc.encode(b); chunks.push(b); off += b.length; };
  const obj = (id, fn) => { offs[id] = off; push(id + ' 0 obj\n'); fn(); push('\nendobj\n'); };
  const n = jpegs.length;
  push('%PDF-1.4\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${jpegs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ')}] /Count ${n} >>`));
  jpegs.forEach((j, i) => {
    const p = 3 + 3 * i, cs = 'q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(p, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${p + 2} 0 R >> >> /Contents ${p + 1} 0 R >>`));
    obj(p + 1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p + 2, () => {
      push(`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);
      push(j);
      push('\nendstream');
    });
  });
  const total = 3 + 3 * n, xo = off;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let id = 1; id < total; id++) push(String(offs[id]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

async function renderBlocksToPdf(blocks, filename) {
  try { await document.fonts.ready; } catch (e) {}
  const W = 1240, H = 1754, M = 85, F = 'Inter, Arial, sans-serif', pages = [];
  let cv, ctx, y;
  const newPage = () => {
    cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    ctx = cv.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top'; ctx.textAlign = 'left'; y = M; pages.push(cv);
  };
  newPage();
  const wrap = (t, maxW) => {
    const out = []; let line = '';
    String(t).split(/\s+/).forEach(w => {
      const tst = line ? line + ' ' + w : w;
      if (ctx.measureText(tst).width > maxW && line) { out.push(line); line = w; }
      else line = tst;
    });
    if (line) out.push(line);
    return out;
  };
  const ST = {
    h1: [800, 42, '#1c1c1e', 0, 12],
    h2: [700, 28, '#007aff', 20, 8],
    b:  [700, 24, '#1c1c1e', 10, 4],
    p:  [400, 21, '#3a3a3c', 0, 4],
    row:[500, 23, '#1c1c1e', 0, 6]
  };
  blocks.forEach(bk => {
    const [wt, sz, col, mt, mb] = ST[bk.k];
    ctx.font = `${wt} ${sz}px ${F}`; ctx.fillStyle = col;
    const lh = Math.round(sz * 1.35);
    if (bk.k === 'row') {
      if (y + mt + lh > H - M) newPage();
      y += mt; ctx.font = `${wt} ${sz}px ${F}`; ctx.fillStyle = col;
      ctx.fillText(bk.l, M, y);
      ctx.textAlign = 'right'; ctx.fillStyle = '#007aff'; ctx.fillText(bk.r, W - M, y);
      ctx.textAlign = 'left'; y += lh + mb;
      return;
    }
    const lines = wrap(bk.t, W - 2 * M);
    if (y + mt + lh > H - M) newPage();
    y += mt;
    lines.forEach(l => {
      if (y + lh > H - M) newPage();
      ctx.font = `${wt} ${sz}px ${F}`; ctx.fillStyle = col;
      ctx.fillText(l, M, y); y += lh;
    });
    y += mb;
  });
  const jpegs = pages.map(c => {
    const b = atob(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    const u = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  });
  const blob = buildPdfFromCanvasPages(jpegs, W, H);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast('PDF скачан!');
}

function exportShoppingListPdf() {
  const active = state.shoppingList.filter(i => !i.done);
  const list = active.length > 0 ? active : state.shoppingList;
  if (!list.length) { showToast('Список пуст'); return; }
  const blocks = [
    { k: 'h1', t: 'Список покупок' },
    { k: 'p',  t: `Дата: ${new Date().toLocaleDateString('ru-RU')} • Позиций: ${list.length}` }
  ];
  const groups = {};
  list.forEach(it => { const c = it.cat || 'other'; if (!groups[c]) groups[c] = []; groups[c].push(it); });
  Object.keys(groups).sort((a, b) => getCatInfo(a).order - getCatInfo(b).order).forEach(cId => {
    blocks.push({ k: 'h2', t: getCatInfo(cId).name });
    groups[cId].forEach(it => blocks.push({ k: 'row', l: `☐  ${it.name}`, r: it.note || '' }));
  });
  renderBlocksToPdf(blocks, 'spisok-pokupok.pdf');
}

function exportWeeklyPlanPdf() {
  const blocks = [
    { k: 'h1', t: `План питания на неделю (${state.people} чел.)` },
    { k: 'h2', t: '1. Меню по дням' }
  ];
  DAYS_CONFIG.forEach((dCfg, idx) => {
    const dayObj = state.weeklyMenu[idx];
    const mealsStr = dCfg.slots.map(s => `${s}: ${getRecipeById(dayObj.meals[s]).name}`).join('  |  ');
    blocks.push({ k: 'b', t: `${dCfg.code} — ${dCfg.name}` });
    blocks.push({ k: 'p', t: mealsStr });
  });
  blocks.push({ k: 'h2', t: '2. Необходимые продукты' });
  calculateWeeklyIngredients().filter(i => !state.haveAtHome[i.key]).forEach(ing => {
    blocks.push({ k: 'row', l: `☐  ${ing.label}`, r: formatAmount(ing.qty, ing.unit) });
  });
  renderBlocksToPdf(blocks, 'plan-na-nedelyu.pdf');
}

function copyText(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
  } else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast(msg); } catch (e) {}
  ta.remove();
}

/* =========================================================================
   9. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК И СОБЫТИЯ
   ========================================================================= */
function switchTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll('.tab-page').forEach(p => p.classList.add('hidden'));
  const target = document.getElementById('view-' + tabId);
  if (target) target.classList.remove('hidden');

  document.querySelectorAll('.tab-item').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-tab') === tabId);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  loadState();
  applyTheme();
  renderQuickChips();
  renderShoppingList();
  renderWeekPlan();
  renderRecipesTab();
  updateTabBadge();
  switchTab(state.activeTab || 'plan');

  document.querySelectorAll('.tab-item').forEach(btn => {
    btn.addEventListener('click', e => switchTab(e.currentTarget.getAttribute('data-tab')));
  });

  document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
    });
  });

  // Единое поле умного ввода в Списке
  const smartInp = document.getElementById('smartAddInput');
  const submitSmartAdd = () => {
    const raw = smartInp.value.trim();
    if (!raw) return;
    const parsed = parseSmartInputString(raw);
    addShoppingItem(parsed.name, parsed.note);
    smartInp.value = '';
    document.getElementById('smartSuggestions').classList.add('hidden');
  };
  smartInp.addEventListener('input', e => renderSmartSuggestions(e.target.value));
  smartInp.addEventListener('keydown', e => { if (e.key === 'Enter') submitSmartAdd(); });
  document.getElementById('btnSmartAddSubmit').addEventListener('click', submitSmartAdd);

  document.getElementById('btnOpenCatalogSheet').addEventListener('click', openCatalogSheet);
  document.getElementById('btnListSharePdf').addEventListener('click', exportShoppingListPdf);
  document.getElementById('btnListCopyTxt').addEventListener('click', () => {
    const active = state.shoppingList.filter(i => !i.done);
    if (!active.length) { showToast('Список пуст'); return; }
    copyText(active.map(i => `• ${i.name}${i.note ? ' (' + i.note + ')' : ''}`).join('\n'), 'Список скопирован!');
  });

  // События вкладки План
  document.getElementById('btnPeopleMinus').addEventListener('click', () => {
    if (state.people > 1) { state.people--; saveState(); renderWeekPlan(); }
  });
  document.getElementById('btnPeoplePlus').addEventListener('click', () => {
    if (state.people < 10) { state.people++; saveState(); renderWeekPlan(); }
  });
  document.getElementById('chkBatchDinners').addEventListener('change', e => {
    state.batchDinners = e.currentTarget.checked;
    if (state.batchDinners && state.weeklyMenu.length === 7) {
      state.weeklyMenu[1].meals['Ужин'] = state.weeklyMenu[0].meals['Ужин'];
      state.weeklyMenu[3].meals['Ужин'] = state.weeklyMenu[2].meals['Ужин'];
    }
    saveState();
    renderWeekPlan();
  });
  document.getElementById('btnAutoFillWeek').addEventListener('click', () => generateWeeklyMenu(true));
  document.getElementById('btnOpenGroceriesModal').addEventListener('click', openGroceriesReviewModal);
  document.getElementById('btnOpenVacuumSheet').addEventListener('click', openVacuumPlanSheet);
  document.getElementById('btnPlanPdf').addEventListener('click', exportWeeklyPlanPdf);

  // События вкладки Рецепты (Папки 2x4)
  document.getElementById('btnBackToFolders').addEventListener('click', () => {
    state.activeFolder = null;
    const sInp = document.getElementById('globalRecipeSearch');
    if (sInp) sInp.value = '';
    renderRecipesTab();
  });
  document.getElementById('globalRecipeSearch').addEventListener('input', renderRecipesTab);
  document.getElementById('btnClearRecSearch').addEventListener('click', () => {
    document.getElementById('globalRecipeSearch').value = '';
    renderRecipesTab();
  });
  document.getElementById('btnNewCustomRecipe').addEventListener('click', openNewCustomRecipeSheet);

  // Закрытие шторок по клику на затемнённый фон
  ['recipeSheet', 'pickerSheet', 'groceriesReviewSheet', 'utilitySheet'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
  });
});
</script>
<script id="market-patch">
/* Надстройка «Свежий рынок»: карточка «Сегодня», «⋯»-меню, живые тексты, прогресс покупок.
   Подключать ПОСЛЕ основного <script>, перед </body>. Основной код не меняется. */
(function () {
  const $ = id => document.getElementById(id);
  const wrapFn = (name, after) => {
    const orig = window[name];
    if (typeof orig !== 'function') return;
    window[name] = function () {
      const r = orig.apply(this, arguments);
      try { after(); } catch (e) { console.error(name, e); }
      return r;
    };
  };

  /* 1. Карточка «Сегодня на ужин» над списком дней */
  function renderToday() {
    const list = $('weekDaysList');
    if (!list || !state.weeklyMenu || !state.weeklyMenu.length) return;
    let card = $('todayCard');
    if (!card) {
      card = document.createElement('div');
      card.id = 'todayCard';
      list.parentNode.insertBefore(card, list);
    }
    const idx = (new Date().getDay() + 6) % 7;           // Пн = 0
    const day = state.weeklyMenu[idx];
    const r = day && getRecipeById(day.meals['Ужин']);
    if (!r) { card.innerHTML = ''; card.className = ''; return; }
    const hint = r.isVacuumPrep ? '🧊 Достаньте заготовку из морозилки заранее' : `⏱ ${r.timeMin} мин`;
    card.className = 'today-card';
    card.innerHTML =
      `<div class="today-kicker">Сегодня на ужин · ${DAYS_CONFIG[idx].name}</div>` +
      `<div class="today-title">${r.emoji || '🍽️'} ${escapeHtml(r.name)}</div>` +
      `<div class="today-hint">${hint}</div>`;
    card.onclick = () => openRecipeSheet(r.id);
  }

  /* 2. Прогресс покупок, «Всё куплено 🎉», живой пустой список */
  function renderListExtras() {
    const c = $('shoppingListGroups');
    if (!c) return;
    const total = state.shoppingList.length;
    const done = state.shoppingList.filter(i => i.done).length;
    if (total === 0) {
      c.innerHTML = `<div class="ios-group" style="padding:32px 20px;text-align:center">
        <div style="font-size:42px">🧺</div>
        <div style="font-weight:900;font-size:17px;margin:6px 0 2px">Пока пусто</div>
        <div class="text-xs" style="color:var(--muted)">Добавьте что-нибудь вкусное 🙂</div></div>`;
      return;
    }
    const pct = Math.round(done / total * 100);
    c.insertAdjacentHTML('afterbegin', done === total
      ? `<div class="ios-group done-banner">Всё куплено 🎉</div>`
      : `<div class="progress-wrap"><div class="text-xs font-bold">Куплено ${done} из ${total}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`);
  }

  /* 3. Одна кнопка «⋯» вместо PDF / копирования / темы */
  function addMoreMenu(headerBtnId, items) {
    const anchor = $(headerBtnId);
    if (!anchor) return;
    const box = anchor.parentNode;
    items.forEach(it => { const b = $(it.id); if (b) b.style.display = 'none'; });
    const more = document.createElement('button');
    more.className = 'ios-btn ios-btn-gray ios-btn-sm';
    more.textContent = '⋯';
    more.setAttribute('aria-label', 'Ещё');
    more.onclick = () => {
      const sheet = $('utilitySheet'), body = $('utilitySheetBody');
      const rows = items.map((it, i) => {
        const label = it.theme ? (state.theme === 'dark' ? '☀️ Светлая тема' : '🌙 Тёмная тема') : it.label;
        return `<div class="ios-row cursor-pointer more-row" data-i="${i}"><span style="font-weight:700">${label}</span><span style="color:var(--muted)">›</span></div>`;
      }).join('');
      body.innerHTML = `<div class="flex items-center justify-between mb-2">
        <h3 class="text-base font-extrabold m-0">Ещё</h3>
        <button id="btnCloseMore" class="ios-btn ios-btn-gray ios-btn-sm">Готово</button></div>
        <div class="ios-group">${rows}</div>`;
      $('btnCloseMore').onclick = () => sheet.classList.remove('open');
      body.querySelectorAll('.more-row').forEach(row => row.onclick = () => {
        sheet.classList.remove('open');
        const target = $(items[Number(row.dataset.i)].id);
        if (target) target.click();
      });
      sheet.classList.add('open');
    };
    box.appendChild(more);
  }

  /* Живые заголовки */
  const h1 = document.querySelector('#view-plan h1');
  if (h1) h1.textContent = 'Что готовим на этой неделе';
  const sub = document.querySelector('#view-plan p');
  if (sub) sub.textContent = 'Будни — ужин, выходные — завтрак, перекус и ужин';

  addMoreMenu('btnListSharePdf', [
    { id: 'btnListSharePdf', label: '📄 Скачать PDF' },
    { id: 'btnListCopyTxt',  label: '📋 Скопировать список' },
    { id: 'btnTheme1', theme: true }
  ]);
  addMoreMenu('btnPlanPdf', [
    { id: 'btnPlanPdf', label: '📄 Скачать PDF плана' },
    { id: 'btnTheme2', theme: true }
  ]);

  wrapFn('renderWeekPlan', renderToday);
  wrapFn('renderShoppingList', renderListExtras);
  renderToday();
  renderListExtras();
})();

</script>
