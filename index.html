ji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/1833-pasta-karbonara-klassicheskaya","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Спагетти","qty":170,"unit":"г"},{"id":"bacon","label":"Бекон сырокопчёный","qty":120,"unit":"г"},{"id":"eggs","label":"Желтки яичные","qty":3,"unit":"шт"},{"id":"cheese","label":"Сыр пармезан","qty":50,"unit":"г"},{"id":"garlic","label":"Чеснок и чёрный перец","qty":5,"unit":"г"}],"steps":["Отварите спагетти.","Обжарьте полоски бекона до хруста.","Смешайте горячую пасту с беконом, снимите с огня и быстро вмешайте желтки, взбитые с тёртым сыром и 3 ложками воды от пасты."]},{"id":"q02","name":"Паста Альфредо с куриным филе и пармезаном","type":"Ужин","subcat":"quick","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":520,"p":35,"f":21,"c":48,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/34112-pasta-s-kuricei-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Паста феттуччине / пенне","qty":160,"unit":"г"},{"id":"chicken_fillet","label":"Куриное филе","qty":280,"unit":"г"},{"id":"cream","label":"Сливки 20%","qty":120,"unit":"мл"},{"id":"cheese","label":"Сыр твёрдый","qty":50,"unit":"г"},{"id":"garlic","label":"Чеснок и сливочное масло","qty":15,"unit":"г"}],"steps":["Отварите пасту.","Обжарьте куриное филе с чесноком на сливочном масле 6 минут, влейте сливки и тёртый сыр.","Перемешайте пасту с густым сырным соусом."]},{"id":"q03","name":"Паста с курицей и шампиньонами в сметанном соусе","type":"Ужин","subcat":"quick","difficulty":"Простая","timeMin":25,"baseServings":2,"kcal":490,"p":33,"f":18,"c":49,"emoji":"🍝","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/34112-pasta-s-kuricei-v-slivochnom-souse","sourceName":"1000.menu","ingredients":[{"id":"pasta","label":"Макароны / паста","qty":160,"unit":"г"},{"id":"chicken_fillet","label":"Куриное филе","qty":250,"unit":"г"},{"id":"mushrooms ing/2869-ovoshchnoe-ragu-s-kuricei","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":300,"unit":"г"},{"id":"potato","label":"Картофель","qty":250,"unit":"г"},{"id":"zucchini","label":"Кабачки молодые","qty":200,"unit":"г"},{"id":"tomato","label":"Помидоры","qty":150,"unit":"г"},{"id":"onion","label":"Лук и морковь","qty":90,"unit":"г"},{"id":"oil","label":"Масло растительное","qty":15,"unit":"мл"}],"steps":["Обжарьте кусочки курицы с луком и морковью 6 минут.","Добавьте кубики картофеля, кабачков и помидоров, тушите под крышкой 25 минут."]},{"id":"s01","name":"Греческий салат с сыром фета и оливковым маслом","type":"Перекус","subcat":"snack","difficulty":"Простая","timeMin":10,"baseServings":2,"kcal":210,"p":8,"f":17,"c":7,"emoji":"🥗","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/2407-grecheskii-salat-klassicheskii","sourceName":"1000.menu","ingredients":[{"id":"tomato","label":"Помидоры свежие","qty":200,"unit":"г"},{"id":"cucumber","label":"Огурцы свежие","qty":160,"unit":"г"},{"id":"pepper","label":"Перец сладкий","qty":100,"unit":"г"},{"id":"cheese","label":"Сыр фета / брынза","qty":90,"unit":"г"},{"id":"oil_olive","label":"Оливковое масло","qty":20,"unit":"мл"}],"steps":["Нарежьте овощи крупными кубиками.","Выложите кубики сыра фета, полейте оливковым маслом с орегано."]},{"id":"s02","name":"Салат «Цезарь» домашний с куриным филе и сухариками","type":"Перекус","subcat":"snack","difficulty":"Простая","timeMin":20,"baseServings":2,"kcal":340,"p":28,"f":18,"c":16,"emoji":"🥗","isVacuumPrep":false,"prepNote":"","sourceUrl":"https://1000.menu/cooking/24150-salat-cezar-klassicheskii-s-kuricei","sourceName":"1000.menu","ingredients":[{"id":"chicken_fillet","label":"Куриное филе","qty":200,"unit":"г"},{"id":"cabbage","label":"Пекинская капуста / салат айсберг","qty":150,"unit":"г"},{"id":"tomato","label":"Помидоры черри","qty":100,"unit":"г"},{"id":"cheese","label":"Сыр пармезан","qty":40,"unit":"г"}    3. СОСТОЯНИЕ И ПАМЯТЬ
   ========================================================================= */
const STORAGE_KEY = 'moldova_iphone15_compact_v4';

const DAYS_CONFIG = [
  { dayIndex: 0, code: 'Пн', name: 'Понедельник', isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 1, code: 'Вт', name: 'Вторник',     isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 2, code: 'Ср', name: 'Среда',       isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 3, code: 'Чт', name: 'Четверг',     isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 4, code: 'Пт', name: 'Пятница',     isWeekend: false, slots: ['Ужин'] },
  { dayIndex: 5, code: 'Сб', name: 'Суббота',     isWeekend: true,  slots: ['Завтрак', 'Перекус', 'Ужин'] },
  { dayIndex: 6, code: 'Вс', name: 'Воскресенье', isWeekend: true,  slots: ['Завтрак', 'Перекус', 'Ужин'] }
];

let state = {
  theme: 'light',
  activeTab: 'menu',
  selectedDay: '0', // '0'..'6' или 'all' (по умолчанию показываем 1 выбранный день, чтобы страница не уходила вниз!)
  people: 2,
  batchDinners: true,
  pref: 'all',
  catFilter: 'all',
  recBookCat: 'all',
  shoppingList: [
    { id: 's_1', name: 'Куриные крылышки', note: '1 кг', cat: 'meat', done: false },
    { id: 's_2', name: 'Творог 5–9% (на сырники)', note: '500 г', cat: 'dairy', done: false },
    { id: 's_3', name: 'Пакеты для вакууматора 20х30', note: '1 упак', cat: 'vacuum', done: false },
    { id: 's_4', name: 'Пергамент для выпечки', note: '1 рулон', cat: 'household', done: false }
  ],
  customCatalog: [],
  customRecipes: [],
  haveAtHome: {},
  weeklyMenu: []
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign({}, state, parsed);
    }
  } catch (e) {}

  try {
    const params = new URLSearchParams(window.location.search);
    const shared = params.get('list');
    if (shared) {
      const decoded = JSON.parse(decodeURIComponent(escape(atob(shared))));
      if (Array.isArray(decoded) && decoded.length > 0) {
        state.shoppingList = decoded;
        state.activeTab = 'list';
      }
    }
  } catch (e) {}

  if (!Array.isArray(state.weeklyMenu) || state.weeklyMenu.length !== 7) {
    generateWeeklyMenu(false);
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  updateBadges();
}

function getAllRecipes() { return BUILTIN_RECIPES.concat(state.customRecipes || []); }
function getRecipeById(id) {
  const all = getAllRecipes();
  return all.find(r => r.id === id) || all[0];
}
function getAllCatalog() { return DEFAULT_CATALOG.concat(state.customCatalog || []); }
function getCatInfo(catId) { return CATEGORIES.find(c => c.id === catId) || CATEGORIES[CATEGORIES.length - 1]; }

let toastTimer = null;
function showToast(msg) {
  const box = document.getElementById('toast');
  const txt = document.getElementById('toastText');
  if (!box || !txt) return;
  txt.textContent = msg;
  box.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('show'), 2200);
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  const btn = document.getElementById('btnThemeToggle');
  if (btn) btn.textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function scaleQty(qty) {
  const val = qty * (state.people / 2);
  return val >= 10 ? Math.round(val) : Math.round(val * 10) / 10;
}

function formatAmount(qty, unit) {
  if (unit === 'г' && qty >= 1000) return (Math.round((qty / 1000) * 100) / 100) + ' кг';
  if (unit === 'мл' && qty >= 1000) return (Math.round((qty / 1000) * 100) / 100) + ' л';
  return `${qty} ${unit}`;
}

function updateBadges() {
  const left = state.shoppingList.filter(i => !i.done).length;
  const navB = document.getElementById('navBadgeList');
  if (navB) navB.textContent = String(left);
  const recB = document.getElementById('hdrRecipeCount');
  if (recB) recB.textContent = `${getAllRecipes().length} блюд`;
}

/* =========================================================================
   4. ВКЛАДКА 1: СПИСОК ПОКУПОК
   ========================================================================= */
function guessCategoryByName(name) {
  const n = name.toLowerCase();
  if (/вакуум|пакет для вакуум|рулон для вакуум/.test(n)) return 'vacuum';
  if (/мыло|порошок|гель|стирк|посуд|губк|бумаг|салфет|мусор|фольг|пергамент|зубн|шампун|чист|таблет/.test(n)) return 'household';
  if (/форел|дорад|лосос|семг|сёмг|рыб/.test(n)) return 'fish';
  if (/куриц|крыл|бедр|бёдр|голен|филе|грудк|фарш|котлет|мясо|свинин|говяд|стейк|ветчин|бекон|пельмен|ребр/.test(n)) return 'meat';
  if (/молок|кефир|сливк|сметан|творог|сыр|масло слив|яйц|йогурт/.test(n)) return 'dairy';
  if (/картош|картоф|помидор|черри|огурц|кабач|перец|лук|морков|чеснок|зелен|укроп|лимон|банан|яблок|гриб|шампин|капуст/.test(n)) return 'veggies';
  if (/макарон|паста|спагет|рис|гречк|овсян|манк|мука/.test(n)) return 'grains';
  if (/хлеб|батон|тост|багет|лаваш|булоч/.test(n)) return 'bakery';
  if (/соев|масло|горчиц|мёд|мед|паста томат|соус|паприк|соль|сахар|специ/.test(n)) return 'grocery';
  return 'other';
}

function addShoppingItem(name, note, catId) {
  const cleanName = (name || '').trim();
  if (!cleanName) { showToast('Введите название'); return; }
  const cleanNote = (note || '').trim();
  const resolvedCat = catId || guessCategoryByName(cleanName);

  const existing = state.shoppingList.find(it => !it.done && it.name.toLowerCase() === cleanName.toLowerCase());
  if (existing) {
    if (cleanNote && existing.note !== cleanNote) {
      existing.note = existing.note ? `${existing.note} + ${cleanNote}` : cleanNote;
    }
    saveState();
    renderShoppingList();
    renderCatalog();
    showToast(`Обновлено: ${cleanName}`);
    return;
  }

  state.shoppingList.unshift({
    id: 'it_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    name: cleanName,
    note: cleanNote,
    cat: resolvedCat,
    done: false
  });
  saveState();
  renderShoppingList();
  renderCatalog();
  showToast(`В списке: ${cleanName}`);
}

function renderShoppingList() {
  const container = document.getElementById('shoppingListContainer');
  if (!container) return;

  const total = state.shoppingList.length;
  const bought = state.shoppingList.filter(i => i.done).length;
  const left = total - bought;

  const statsEl = document.getElementById('listStatsLine');
  if (statsEl) statsEl.textContent = `К покупке: ${left} • Куплено: ${bought}`;

  const bar = document.getElementById('listProgressBar');
  if (bar) bar.style.width = (total > 0 ? Math.round((bought / total) * 100) : 0) + '%';

  if (total === 0) {
    container.innerHTML = `<div class="text-center py-5 text-xs" style="color: var(--muted);">Список покупок пуст. Добавьте товары сверху или из «Меню».</div>`;
    return;
  }

  const groups = {};
  state.shoppingList.forEach(item => {
    const c = item.cat || 'other';
    if (!groups[c]) groups[c] = [];
    groups[c].push(item);
  });

  const sortedCatIds = Object.keys(groups).sort((a, b) => getCatInfo(a).order - getCatInfo(b).order);

  let html = '';
  sortedCatIds.forEach(catId => {
    const cat = getCatInfo(catId);
    const items = groups[catId].slice().sort((a, b) => Number(a.done) - Number(b.done));
    html += `
      <div class="mb-2">
        <div class="text-[11px] font-extrabold uppercase tracking-wide mb-1 px-0.5" style="color: var(--muted);">${cat.name}</div>
        <div class="space-y-1">
    `;
    items.forEach(it => {
      html += `
        <div class="compact-row ${it.done ? 'done' : ''}">
          <label class="flex items-center gap-2 flex-1 min-w-0 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 accent-emerald-600 shrink-0 item-check" data-id="${it.id}" ${it.done ? 'checked' : ''}>
            <span class="font-semibold text-xs truncate row-title">${escapeHtml(it.name)}</span>
          </label>
          <div class="flex items-center gap-1 shrink-0">
            ${it.note ? `<span class="tag tag-cyan">${escapeHtml(it.note)}</span>` : ''}
            <button class="btn btn-ghost btn-xs item-del" data-id="${it.id}" style="padding: 2px 6px; color: var(--acc);">✕</button>
          </div>
        </div>
      `;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;

  container.querySelectorAll('.item-check').forEach(chk => {
    chk.addEventListener('change', e => {
      const id = e.currentTarget.getAttribute('data-id');
      const target = state.shoppingList.find(x => x.id === id);
      if (target) { target.done = e.currentTarget.checked; saveState(); renderShoppingList(); }
    });
  });

  container.querySelectorAll('.item-del').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      state.shoppingList = state.shoppingList.filter(x => x.id !== id);
      saveState();
      renderShoppingList();
      renderCatalog();
    });
  });
}

/* =========================================================================
   5. ВКЛАДКА 2: КОМПАКТНЫЙ КАТАЛОГ ПРОДУКТОВ И ХИМИИ (В 2 КОЛОНКИ)
   ========================================================================= */
function renderCatalogPills() {
  const bar = document.getElementById('catFilterPills');
  if (!bar) return;
  let html = `<button class="pill-btn ${state.catFilter === 'all' ? 'active' : ''}" data-c="all">Все</button>`;
  CATEGORIES.forEach(c => {
    html += `<button class="pill-btn ${state.catFilter === c.id ? 'active' : ''}" data-c="${c.id}">${c.short}</button>`;
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.pill-btn').forEach(b => {
    b.addEventListener('click', e => {
      state.catFilter = e.currentTarget.getAttribute('data-c');
      renderCatalogPills();
      renderCatalog();
    });
  });
}

function renderCatalog() {
  const container = document.getElementById('catalogContainer');
  if (!container) return;

  const q = (document.getElementById('catSearchInput')?.value || '').trim().toLowerCase();
  const items = getAllCatalog().filter(it => {
    if (state.catFilter !== 'all' && it.cat !== state.catFilter) return false;
    if (q && !it.name.toLowerCase().includes(q)) return false;
    return true;
  });

  if (items.length === 0) {
    container.innerHTML = `<div class="text-center py-4 text-xs" style="color: var(--muted);">Ничего не найдено.</div>`;
    return;
  }

  // Компактная 2-колоночная сетка для iPhone 15
  container.innerHTML = `<div class="grid grid-cols-2 gap-1.5">` + items.map(item => {
    const inList = state.shoppingList.some(x => !x.done && x.name.toLowerCase() === item.name.toLowerCase());
    return `
      <div class="compact-row cursor-pointer ${inList ? 'border-emerald-500 bg-emerald-50/50 dark:bg-emerald-950/30' : ''}" data-name="${escapeHtml(item.name)}" data-note="${escapeHtml(item.defNote || '')}" data-cat="${item.cat}">
        <div class="min-w-0 flex-1">
          <div class="font-semibold text-xs truncate">${escapeHtml(item.name)}</div>
          <div class="text-[10.5px]" style="color: var(--muted);">${escapeHtml(item.defNote || '')}</div>
        </div>
        <span class="tag ${inList ? 'tag-ok' : 'tag-acc'}">${inList ? '✓' : '+'}</span>
      </div>
    `;
  }).join('') + `</div>`;

  container.querySelectorAll('.compact-row').forEach(row => {
    row.addEventListener('click', e => {
      const name = e.currentTarget.getAttribute('data-name');
      const note = e.currentTarget.getAttribute('data-note');
      const cat = e.currentTarget.getAttribute('data-cat');
      const idx = state.shoppingList.findIndex(x => !x.done && x.name.toLowerCase() === name.toLowerCase());
      if (idx !== -1) {
        state.shoppingList.splice(idx, 1);
        saveState();
        renderShoppingList();
        renderCatalog();
        showToast(`Убрано: ${name}`);
      } else {
        addShoppingItem(name, note, cat);
      }
    });
  });
}

/* =========================================================================
   6. ВКЛАДКА 3: МЕНЮ НА НЕДЕЛЮ (С ПЕРЕКЛЮЧАТЕЛЕМ ДНЕЙ ПН–ВС БЕЗ ДЛИННОГО СКРОЛЛА)
   ========================================================================= */
function filterPoolByPref(pool, slotType) {
  let filtered = pool.filter(r => {
    if (slotType === 'Завтрак') return r.type === 'Завтрак';
    if (slotType === 'Перекус') return r.type === 'Перекус';
    return r.type === 'Ужин';
  });

  if (slotType === 'Ужин') {
    if (state.pref === 'vacuum') {
      const vac = filtered.filter(r => r.isVacuumPrep);
      if (vac.length >= 3) filtered = vac;
    } else if (state.pref === 'chicken_mince') {
      const cm = filtered.filter(r => r.subcat === 'chicken' || r.subcat === 'mince');
      if (cm.length >= 3) filtered = cm;
    } else if (state.pref === 'fish') {
      const f = filtered.filter(r => r.subcat === 'fish');
      const rest = filtered.filter(r => r.subcat !== 'fish');
      filtered = f.concat(rest);
    }
  }
  return filtered;
}

function pickRandomDistinct(pool, usedIds) {
  const unused = pool.filter(r => !usedIds.has(r.id));
  const list = unused.length > 0 ? unused : pool;
  const pick = list[Math.floor(Math.random() * list.length)];
  if (pick) usedIds.add(pick.id);
  return pick ? pick.id : pool[0].id;
}

function generateWeeklyMenu(notify = true) {
  const all = getAllRecipes();
  const bPool = filterPoolByPref(all, 'Завтрак');
  const sPool = filterPoolByPref(all, 'Перекус');
  const dPool = filterPoolByPref(all, 'Ужин');

  const usedB = new Set(), usedS = new Set(), usedD = new Set();

  const monD = pickRandomDistinct(dPool, usedD);
  const tueD = state.batchDinners ? monD : pickRandomDistinct(dPool, usedD);
  const wedD = pickRandomDistinct(dPool, usedD);
  const thuD = state.batchDinners ? wedD : pickRandomDistinct(dPool, usedD);
  const friD = pickRandomDistinct(dPool, usedD);
  const satD = pickRandomDistinct(dPool, usedD);
  const sunD = pickRandomDistinct(dPool, usedD);

  const dinners = [monD, tueD, wedD, thuD, friD, satD, sunD];

  state.weeklyMenu = DAYS_CONFIG.map((d, idx) => {
    const meals = { 'Ужин': dinners[idx] };
    if (d.isWeekend) {
      meals['Завтрак'] = pickRandomDistinct(bPool, usedB);
      meals['Перекус'] = pickRandomDistinct(sPool, usedS);
    }
    return { dayIndex: idx, meals };
  });

  saveState();
  renderWeeklyMenu();
  if (notify) showToast('Новое меню на неделю составлено!');
}

function calculateWeeklyIngredients() {
  const map = {};
  state.weeklyMenu.forEach((dayObj, idx) => {
    const dayCfg = DAYS_CONFIG[idx];
    dayCfg.slots.forEach(slot => {
      const r = getRecipeById(dayObj.meals[slot]);
      if (!r) return;
      (r.ingredients || []).forEach(ing => {
        const key = (ing.id || ing.label).toLowerCase();
        const scaled = scaleQty(ing.qty);
        if (!map[key]) {
          map[key] = {
            key, id: ing.id || key, label: ing.label, qty: 0,
            unit: ing.unit || 'г',
            cat: INGREDIENT_CAT_MAP[ing.id] || guessCategoryByName(ing.label)
          };
        }
        map[key].qty = Math.round((map[key].qty + scaled) * 10) / 10;
      });
    });
  });
  return Object.values(map).sort((a, b) => getCatInfo(a.cat).order - getCatInfo(b.cat).order);
}

function renderDaySwitcher() {
  const bar = document.getElementById('daySwitcherBar');
  if (!bar) return;

  let html = DAYS_CONFIG.map((d, idx) => {
    const active = String(state.selectedDay) === String(idx);
    return `<button class="pill-btn ${active ? 'active' : ''}" data-day="${idx}">${d.code}${d.isWeekend ? '☀️' : ''}</button>`;
  }).join('');
  html += `<button class="pill-btn ${state.selectedDay === 'all' ? 'active' : ''}" data-day="all">Все 7 дн</button>`;

  bar.innerHTML = html;
  bar.querySelectorAll('.pill-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      state.selectedDay = e.currentTarget.getAttribute('data-day');
      saveState();
      renderWeeklyMenu();
    });
  });
}

          <div class="text-[10.5px] truncate" style="color: var(--muted);">${escapeHtml(ingsShort)}</div>
        </div>
        <div class="flex items-center gap-1 shrink-0">

        </div>
      </div>
    `;
  });

  html += `</div></div>`;
  return html;
}

function renderWeeklyMenu() {
  const pVal = document.getElementById('peopleCountVal');
  if (pVal) pVal.textContent = `${state.people} чел`;
  const chkBatch = document.getElementById('chkBatchDinners');
  if (chkBatch) chkBatch.checked = !!state.batchDinners;

  renderDaySwitcher();

  const view = document.getElementById('activeDayView');
  if (view) {
    if (state.selectedDay === 'all') {
      view.innerHTML = DAYS_CONFIG.map((_, idx) => renderDayCardHtml(idx)).join('');
    } else {
      const idx = Number(state.selectedDay) || 0;
      view.innerHTML = renderDayCardHtml(idx);
    }

    view.querySelectorAll('.open-recipe-btn').forEach(btn => {
      btn.addEventListener('click', e => openRecipeModal(e.currentTarget.getAttribute('data-id')));
    });
    view.querySelectorAll('.replace-meal-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        openReplaceModal(Number(e.currentTarget.getAttribute('data-day')), e.currentTarget.getAttribute('data-slot'));
      });
    });
  }

  renderVacuumPrepBlock();
  renderMenuIngredientsSummary();
}

function renderVacuumPrepBlock() {
  const box = document.getElementById('vacuumPrepList');
  const badge = document.getElementById('vacCountBadge');
  if (!box) return;

  const vacMap = {};
  state.weeklyMenu.forEach((dayObj, dIdx) => {
    DAYS_CONFIG[dIdx].slots.forEach(slot => {
      const r = getRecipeById(dayObj.meals[slot]);
      if (r && r.isVacuumPrep) {
        if (!vacMap[r.id]) vacMap[r.id] = { r, days: [] };
        vacMap[r.id].days.push(DAYS_CONFIG[dIdx].code);
      }
    });
  });

  const list = Object.values(vacMap);
  if (badge) badge.textContent = `${list.length} шт`;

  if (list.length === 0) {
    box.innerHTML = `<div class="text-xs" style="color: var(--muted);">В текущем меню нет блюд для вакууматора.</div>`;
    return;
  }

  box.innerHTML = list.map(item => `
    <div class="compact-row flex-col items-start gap-0.5">
      <div class="flex items-center justify-between w-full">
        <span class="font-bold text-xs" style="color: var(--cyan);">${item.r.emoji} ${escapeHtml(item.r.name)}</span>
        <span class="tag tag-cyan">${item.days.join(', ')}</span>
      </div>
      <div class="text-[11px]" style="color: var(--muted);">${escapeHtml(item.r.prepNote || 'Замариновать и запаять в пакет.')}</div>
    </div>
  `).join('');
}

function renderMenuIngredientsSummary() {
  const box = document.getElementById('menuIngredientsSummary');
  const badge = document.getElementById('menuIngCountBadge');
  if (!box) return;

  const list = calculateWeeklyIngredients();
  const needCount = list.filter(i => !state.haveAtHome[i.key]).length;
  if (badge) badge.textContent = `${needCount} купить`;

  box.innerHTML = list.map(ing => {
    const have = !!state.haveAtHome[ing.key];
    return `
      <div class="compact-row cursor-pointer ${have ? 'done' : ''}" data-key="${escapeHtml(ing.key)}">
        <span class="font-semibold text-xs truncate row-title">${escapeHtml(ing.label)}</span>
        <span class="tag ${have ? 'tag-ok' : 'tag-cyan'} shrink-0">${have ? 'Дома' : formatAmount(ing.qty, ing.unit)}</span>
      </div>
    `;
  }).join('');

  box.querySelectorAll('.compact-row').forEach(row => {
    row.addEventListener('click', e => {
      const k = e.currentTarget.getAttribute('data-key');
      state.haveAtHome[k] = !state.haveAtHome[k];
      saveState();
      renderMenuIngredientsSummary();
    });
  });
}

function mergeMenuIngredientsToShoppingList() {
  const list = calculateWeeklyIngredients();
  let count = 0;
  list.forEach(ing => {
    if (state.haveAtHome[ing.key]) return;
    const amt = formatAmount(ing.qty, ing.unit);
    const existing = state.shoppingList.find(x => !x.done && x.name.toLowerCase() === ing.label.toLowerCase());
    if (existing) existing.note = amt;
    else {
      state.shoppingList.push({
        id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        name: ing.label, note: amt, cat: ing.cat, done: false
      });
    }
    count++;
  });
  saveState();
  renderShoppingList();
  renderCatalog();
  showToast(`В список покупок добавлено ${count} поз.!`);
}

   7. ВКЛАДКА 4: ПОЛНАЯ БАЗА 120 РЕЦЕПТОВ (ЧТОБЫ ВСЁ БЫЛО ВИДНО!)
   ========================================================================= */
function renderRecipeBook() {
  const grid = document.getElementById('recBookGrid');
  if (!grid) return;

  const q = (document.getElementById('recBookSearch')?.value || '').trim().toLowerCase();
  const cat = state.recBookCat || 'all';

  const list = getAllRecipes().filter(r => {
    if (cat === 'vacuum' && !r.isVacuumPrep) return false;
    else if (cat !== 'all' && cat !== 'vacuum' && r.subcat !== cat) return false;
    if (q) {
      const inName = r.name.toLowerCase().includes(q);
      const inIng = (r.ingredients || []).some(i => i.label.toLowerCase().includes(q));
      return inName || inIng;
    }
    return true;
  });

  if (list.length === 0) {
    grid.innerHTML = `<div class="text-center py-6 text-xs col-span-2" style="color: var(--muted);">Рецепты не найдены.</div>`;
    return;
  }

  grid.innerHTML = list.map(r => `
    <div class="compact-row cursor-pointer open-rec-book" data-id="${r.id}">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-1 mb-0.5">
          <span class="tag ${r.type === 'Завтрак' ? 'tag-ok' : (r.type === 'Перекус' ? 'tag-cyan' : 'tag-acc')}">${r.type}</span>
          ${r.isVacuumPrep ? `<span class="tag tag-cyan">🧊 Вакуум</span>` : ''}
          <span class="text-[10.5px]" style="color: var(--muted);">⏱ ${r.timeMin}м</span>
        </div>
        <div class="font-bold text-xs truncate">${r.emoji || '🍽️'} ${escapeHtml(r.name)}</div>
      </div>
      <span class="text-xs font-bold" style="color: var(--muted);">›</span>
    </div>
  `).join('');

  grid.querySelectorAll('.open-rec-book').forEach(el => {
    el.addEventListener('click', e => openRecipeModal(e.currentTarget.getAttribute('data-id')));
  });
}

   8. МОДАЛЬНЫЕ ОКНА: РЕЦЕПТ, ЗАМЕНА С КАТЕГОРИЯМИ, СВОЁ БЛЮДО
   ========================================================================= */
function openRecipeModal(recipeId) {
  const r = getRecipeById(recipeId);
  if (!r) return;
  const modal = document.getElementById('recipeModal');
  const body = document.getElementById('recipeModalBody');

  const ingHtml = (r.ingredients || []).map(i => `
    <div class="flex items-center justify-between py-1 border-b text-xs" style="border-color: var(--line);">
      <span>${escapeHtml(i.label)}</span>
      <span class="font-bold">${scaleQty(i.qty)} ${escapeHtml(i.unit)}</span>
    </div>
  `).join('');

  const stepHtml = (r.steps || []).map((s, idx) => `
    <div class="flex gap-2 mb-1.5 text-xs">
      <span class="font-extrabold" style="color: var(--acc);">${idx + 1}.</span>
      <span>${escapeHtml(s)}</span>
    </div>
  `).join('');

  body.innerHTML = `
    <div class="flex items-start justify-between gap-2 mb-2">
      <div>
        <div class="flex items-center gap-1 mb-1">
          <span class="tag tag-acc">${escapeHtml(r.type)}</span>
          <span class="tag tag-ok">⏱ ${r.timeMin} мин</span>
          <span class="tag tag-cyan">На ${state.people} чел</span>
        </div>
        <h3 class="text-sm font-extrabold m-0">${r.emoji || '🍽️'} ${escapeHtml(r.name)}</h3>
      </div>
      <button id="btnCloseRecipeModal" class="btn btn-ghost btn-xs">✕</button>
    </div>

    ${r.isVacuumPrep ? `
      <div class="p-2 rounded-lg mb-2 text-xs" style="background: var(--cyan-soft); color: var(--text);">
        <b style="color: var(--cyan);">🧊 Заготовка в вакууматор:</b> ${escapeHtml(r.prepNote || '')}
      </div>
    ` : ''}

    <div class="mb-2">
      <div class="text-[11px] font-extrabold uppercase mb-1" style="color: var(--muted);">Ингредиенты:</div>
      ${ingHtml}
    </div>

    <div class="mb-3">
      <div class="text-[11px] font-extrabold uppercase mb-1" style="color: var(--muted);">Приготовление:</div>
      ${stepHtml}
    </div>

    <div class="flex items-center justify-between gap-2 pt-2 border-t" style="border-color: var(--line);">
      <button id="btnAddRecIngsToShop" class="btn btn-ok btn-xs flex-1">➕ Добавить продукты в список покупок</button>
      ${r.sourceUrl ? `<a href="${escapeHtml(r.sourceUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-xs">Источник ↗</a>` : ''}
    </div>
  `;

  modal.classList.add('open');
  document.getElementById('btnCloseRecipeModal').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('btnAddRecIngsToShop').addEventListener('click', () => {
    (r.ingredients || []).forEach(i => {
      addShoppingItem(i.label, `${scaleQty(i.qty)} ${i.unit}`, INGREDIENT_CAT_MAP[i.id]);
    });
    modal.classList.remove('open');
    showToast('Продукты для блюда добавлены в список!');
  });
}

function openReplaceModal(dayIdx, slot) {
  const modal = document.getElementById('replaceModal');
  const body = document.getElementById('replaceModalBody');
  const dayCfg = DAYS_CONFIG[dayIdx];
  const currentId = state.weeklyMenu[dayIdx]?.meals[slot];

  let activeFilter = slot === 'Завтрак' ? 'breakfast' : (slot === 'Перекус' ? 'snack' : 'all');

  body.innerHTML = `
    <div class="flex items-center justify-between gap-2 mb-2">
      <div>
        <h3 class="text-sm font-extrabold m-0">↻ Заменить (${dayCfg.code} — ${slot})</h3>
        <p class="text-[11px] m-0" style="color: var(--muted);">Выберите любое из 120 блюд — продукты пересчитаются сами</p>
      </div>
      <button id="btnCloseReplaceModal" class="btn btn-ghost btn-xs">✕</button>
    </div>

    <div class="pill-scroll mb-2" id="replaceCatPills">
      <button class="pill-btn ${activeFilter === 'all' ? 'active' : ''}" data-f="all">Все</button>
      <button class="pill-btn ${activeFilter === 'breakfast' ? 'active' : ''}" data-f="breakfast">🥞 Завтраки</button>
      <button class="pill-btn ${activeFilter === 'chicken' ? 'active' : ''}" data-f="chicken">🍗 Курица</button>
      <button class="pill-btn ${activeFilter === 'mince' ? 'active' : ''}" data-f="mince">🧆 Фарш/Котлеты</button>
      <button class="pill-btn ${activeFilter === 'meat' ? 'active' : ''}" data-f="meat">🥩 Мясо</button>
      <button class="pill-btn ${activeFilter === 'fish' ? 'active' : ''}" data-f="fish">🐟 Рыба</button>
      <button class="pill-btn ${activeFilter === 'quick' ? 'active' : ''}" data-f="quick">🍝 Паста/Быстро</button>
      <button class="pill-btn ${activeFilter === 'snack' ? 'active' : ''}" data-f="snack">🥗 Салаты</button>
      <button class="pill-btn ${activeFilter === 'vacuum' ? 'active' : ''}" data-f="vacuum">🧊 Вакуум</button>

    <div id="replaceCandidatesList" class="space-y-1.5 max-h-[54vh] overflow-y-auto pr-0.5"></div>
  `;

  const renderCandidates = () => {
    const q = (document.getElementById('replaceSearchInput')?.value || '').trim().toLowerCase();
    const all = getAllRecipes();
    const filtered = all.filter(r => {
      if (activeFilter === 'vacuum' && !r.isVacuumPrep) return false;
      else if (activeFilter !== 'all' && activeFilter !== 'vacuum' && r.subcat !== activeFilter) return false;
      if (q) {
        const inName = r.name.toLowerCase().includes(q);
        const inIng = (r.ingredients || []).some(i => i.label.toLowerCase().includes(q));
        return inName || inIng;
      }
      return true;
    });

    const listEl = document.getElementById('replaceCandidatesList');
    listEl.innerHTML = filtered.map(r => {
      const isCur = r.id === currentId;
      const ingText = (r.ingredients || []).slice(0, 3).map(i => `${i.label} (${scaleQty(i.qty)}${i.unit})`).join(', ');
      return `
        <div class="compact-row ${isCur ? 'border-rose-500' : ''}">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1">
              <span class="font-bold text-xs truncate">${r.emoji || '🍽️'} ${escapeHtml(r.name)}</span>

        </div>

    }).join('');

    listEl.querySelectorAll('.pick-rep').forEach(btn => {
      btn.addEventListener('click', e => {
        const pickedId = e.currentTarget.getAttribute('data-id');
        state.weeklyMenu[dayIdx].meals[slot] = pickedId;
        if (state.batchDinners && slot === 'Ужин') {
          if (dayIdx === 0) state.weeklyMenu[1].meals['Ужин'] = pickedId;
          if (dayIdx === 2) state.weeklyMenu[3].meals['Ужин'] = pickedId;
        }
        saveState();
        renderWeeklyMenu();
        modal.classList.remove('open');
        showToast('Блюдо заменено!');
      });
    });
  };

  renderCandidates();
  modal.classList.add('open');

  document.getElementById('btnCloseReplaceModal').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('replaceSearchInput').addEventListener('input', renderCandidates);
  document.querySelectorAll('#replaceCatPills .pill-btn').forEach(b => {
    b.addEventListener('click', e => {

/* =========================================================================
   9. PDF ГЕНЕРАЦИЯ И КОПИРОВАНИЕ ТЕКСТА
   ========================================================================= */
function buildPdfFromCanvasPages(jpegs, W, H) {
  const enc = new TextEncoder(), chunks = [], offs = [];
  let off = 0;
  const push = b => { if (typeof b === 'string') b = enc.encode(b); chunks.push(b); off += b.length; };
  const obj = (id, fn) => { offs[id] = off; push(id + ' 0 obj\n'); fn(); push('\nendobj\n'); };
  const n = jpegs.length;
  push('%PDF-1.4\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${jpegs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ')}] /Count ${n} >>`));
  jpegs.forEach((j, i) => {
    const p = 3 + 3 * i, cs = 'q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(p, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${p + 2} 0 R >> >> /Contents ${p + 1} 0 R >>`));
    obj(p + 1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p + 2, () => {
      push(`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);
      push(j);
      push('\nendstream');
    });
  });
  const total = 3 + 3 * n, xo = off;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let id = 1; id < total; id++) push(String(offs[id]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

async function renderBlocksToPdf(blocks, filename) {
  try { await document.fonts.ready; } catch (e) {}
  const W = 1240, H = 1754, M = 85, F = 'Inter, Arial, sans-serif', pages = [];
  let cv, ctx, y;
  const newPage = () => {
    cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    ctx = cv.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top'; ctx.textAlign = 'left'; y = M; pages.push(cv);
  };
  newPage();
  const wrap = (t, maxW) => {
    const out = []; let line = '';
    String(t).split(/\s+/).forEach(w => {
      const tst = line ? line + ' ' + w : w;
      if (ctx.measureText(tst).width > maxW && line) { out.push(line); line = w; }
      else line = tst;
    });
    if (line) out.push(line);
    return out;
  };
  const ST = {
    h1: [800, 42, '#0f172a', 0, 12],
    h2: [700, 28, '#e11d48', 20, 8],
    b:  [700, 24, '#0f172a', 10, 4],
    p:  [400, 21, '#334155', 0, 4],
    row:[500, 23, '#0f172a', 0, 6]
  };
  blocks.forEach(bk => {
    const [wt, sz, col, mt, mb] = ST[bk.k];
    ctx.font = `${wt} ${sz}px ${F}`; ctx.fillStyle = col;
    const lh = Math.round(sz * 1.35);
    if (bk.k === 'row') {
      if (y + mt + lh > H - M) newPage();
      y += mt; ctx.font = `${wt} ${sz}px ${F}`; ctx.fillStyle = col;
      ctx.fillText(bk.l, M, y);
      ctx.textAlign = 'right'; ctx.fillStyle = '#0891b2'; ctx.fillText(bk.r, W - M, y);
      ctx.textAlign = 'left'; y += lh + mb;
      return;
    }
    const lines = wrap(bk.t, W - 2 * M);
    if (y + mt + lh > H - M) newPage();
    y += mt;
    lines.forEach(l => {
      if (y + lh > H - M) newPage();
      ctx.font = `${wt} ${sz}px ${F}`; ctx.fillStyle = col;
      ctx.fillText(l, M, y); y += lh;
    });
    y += mb;
  });
  const jpegs = pages.map(c => {
    const b = atob(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    const u = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  });
  const blob = buildPdfFromCanvasPages(jpegs, W, H);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast('PDF скачан!');
}

function exportShoppingListPdf() {
  const active = state.shoppingList.filter(i => !i.done);
  const list = active.length > 0 ? active : state.shoppingList;
  if (list.length === 0) { showToast('Список пуст'); return; }
  const blocks = [
    { k: 'h1', t: 'Список покупок' },
    { k: 'p',  t: `Дата: ${new Date().toLocaleDateString('ru-RU')} • Позиций: ${list.length}` }
  ];
  const groups = {};
  list.forEach(it => { const c = it.cat || 'other'; if (!groups[c]) groups[c] = []; groups[c].push(it); });
  Object.keys(groups).sort((a, b) => getCatInfo(a).order - getCatInfo(b).order).forEach(cId => {
    blocks.push({ k: 'h2', t: getCatInfo(cId).name });
    groups[cId].forEach(it => blocks.push({ k: 'row', l: `☐  ${it.name}`, r: it.note || '' }));
  });
  renderBlocksToPdf(blocks, 'spisok-pokupok.pdf');
}

function exportWeeklyMenuPdf() {
  const blocks = [
    { k: 'h1', t: `Меню на неделю и заготовки (${state.people} чел.)` },
    { k: 'h2', t: '1. План по дням' }
  ];
  DAYS_CONFIG.forEach((dCfg, idx) => {
    const dayObj = state.weeklyMenu[idx];
    const mealsStr = dCfg.slots.map(s => `${s}: ${getRecipeById(dayObj.meals[s]).name}`).join(' | ');
    blocks.push({ k: 'b', t: `${dCfg.code} (${dCfg.name})` });
    blocks.push({ k: 'p', t: mealsStr });
  });
  blocks.push({ k: 'h2', t: '2. Продукты к покупке' });
  calculateWeeklyIngredients().filter(i => !state.haveAtHome[i.key]).forEach(ing => {
    blocks.push({ k: 'row', l: `☐  ${ing.label}`, r: formatAmount(ing.qty, ing.unit) });
  });
  renderBlocksToPdf(blocks, 'menu-na-nedelyu.pdf');
}

function copyText(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
  } else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast(msg); } catch (e) {}
  ta.remove();
}

  state.activeTab = tabId;

  const target = document.getElementById('view-' + tabId);
  if (target) target.classList.remove('hidden');
  document.querySelectorAll('.nav-tab').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-tab') === tabId);
  });
}

    nEl.value = ''; noteEl.value = ''; cEl.dataset.changed = '0';
  };

  });

      state.pref = e.currentTarget.getAttribute('data-pref');

    copyText(lines.join('\n'), 'Меню скопировано!');

    const vacs = [];

    const m = document.getElementById(id);

  });
});
